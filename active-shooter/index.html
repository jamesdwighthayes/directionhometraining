me":0.009,"finishTime":3.279},{"text":"and they usually occur without warning.","startTime":3.44,"finishTime":5.25},{"text":"These events are unpredictable and evolve quickly.","startTime":6.179,"finishTime":8.76},{"text":"No organization is immune to such events.","startTime":9.649000000000001,"finishTime":12.109},{"text":"Many of these situations are over within 10 to 15 minutes.","startTime":12.989,"finishTime":16.379},{"text":"Staff must therefore be prepared to respond before law enforcement arrives.","startTime":17.28,"finishTime":21.28},{"text":"Guns are not the only means used.","startTime":22.159,"finishTime":23.94},{"text":"Knives,","startTime":24.84,"finishTime":25.36},{"text":"explosive devices,","startTime":25.469,"finishTime":26.709},{"text":"and other improvised weapons also pose a threat.","startTime":26.92,"finishTime":29.42},{"text":"Preparation is both an individual","startTime":30.43,"finishTime":32.15},{"text":"responsibility and an organizational responsibility.","startTime":32.15,"finishTime":35.169},{"text":"The safety of each individual and the safety of others are of primary importance.","startTime":36,"finishTime":40.139}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["64Q2Fmk8rJuXedjgF","pTGqjnbotP8NCz43g"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Active shooter and hostile threat events can occur at any time, and they usually occur without warning. These events are unpredictable and evolve quickly. No organization is immune to such events. Many of these situations are over within ten to fifteen minutes. Staff must therefore be prepared to respond before law enforcement arrives. Guns are not the only means used. Knives, explosive devices, and other improvised weapons also pose a threat. Preparation is both an individual responsibility and an organizational responsibility. The safety of each individual and the safety of others are of primary importance. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Active shooter and hostile threat events can occur at any time, and they usually occur without warning. These events are unpredictable and evolve quickly. No organization is immune to such events. Many of these situations are over within ten to fifteen minutes. Staff must therefore be prepared to respond before law enforcement arrives. Guns are not the only means used. Knives, explosive devices, and other improvised weapons also pose a threat. Preparation is both an individual responsibility and an organizational responsibility. The safety of each individual and the safety of others are of primary importance. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"pvXh9c5EL5yaycXfP"}},"3aqxoCQ2ibavcjy4e":{"_id":"3aqxoCQ2ibavcjy4e","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank"},"dates":{"dateCreated":"2026-10-16T18:59:27.325Z","dateModified":"2026-10-17T04:33:19.618Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true,"questions":["pNYYDNhhCxuPMJwYS"]},"video":{"autoPlay":true,"overlays":[{"identifier":"mfMY5JtY5nEs6wEzE","kind":"overlay","type":"questionMC","width":1152,"height":648,"x":64,"y":36,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":16},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"}},"questionId":"pNYYDNhhCxuPMJwYS","start":0,"behaviorType":"pause"}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":[],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"3vt7vQ6jDFFHskseF":{"_id":"3vt7vQ6jDFFHskseF","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"TrSrDbjZ2mZNaNpxC"},"dates":{"dateCreated":"2026-10-16T19:06:43.400Z","dateModified":"2026-10-17T05:13:48.597Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"FATfAntPphLhSx8G8","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"XWnMtM7cfFFB2g5mu","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":46.7,"captions":[{"text":"A lockdown protects people from a hostile event.","startTime":0.009,"finishTime":2.529},{"text":"At Direction Home Akron Canton,","startTime":3.39,"finishTime":5.119},{"text":"a lockdown has several features.","startTime":5.239,"finishTime":7.059},{"text":"Doors are locked on the outside and staff and","startTime":7.92,"finishTime":10.479},{"text":"the public are unable to enter the building.","startTime":10.479,"finishTime":12.38},{"text":"Staff may leave the building if leaving is the safest action.","startTime":13.399000000000001,"finishTime":16.399},{"text":"The building also enters lockdown mode,","startTime":17.229,"finishTime":19.35},{"text":"which stops badges from working in order to keep an intruder out.","startTime":19.51,"finishTime":22.709},{"text":"During an exterior threat lockdown,","startTime":23.6,"finishTime":25.44},{"text":"all exterior doors and windows are locked,","startTime":25.6,"finishTime":27.87},{"text":"and occupants remain inside.","startTime":28.04,"finishTime":29.68},{"text":"Persons in hallways and common areas move into a secured room,","startTime":30.51,"finishTime":33.83},{"text":"preferably a designated safe room.","startTime":34.069,"finishTime":35.93},{"text":"Blinds on the first floor are closed and staff stay away from glass.","startTime":36.79,"finishTime":40.729},{"text":"Staff remain in secured areas until law","startTime":41.569,"finishTime":43.729},{"text":"enforcement authorities give the all clear.","startTime":43.729,"finishTime":45.75}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["TrSrDbjZ2mZNaNpxC","XWnMtM7cfFFB2g5mu"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"A lockdown protects people from a hostile event. At Direction Home Akron Canton, a lockdown has several features. Doors are locked on the outside, and staff and the public are unable to enter the building. Staff may leave the building if leaving is the safest action. The building also enters lockdown mode, which stops badges from working in order to keep an intruder out. During an exterior threat lockdown, all exterior doors and windows are locked, and occupants remain inside. Persons in hallways and common areas move into a secured room, preferably a designated safe room. Blinds on the first floor are closed, and staff stay away from glass. Staff remain in secured areas until law enforcement authorities give the all clear. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"A lockdown protects people from a hostile event. At Direction Home Akron Canton, a lockdown has several features. Doors are locked on the outside, and staff and the public are unable to enter the building. Staff may leave the building if leaving is the safest action. The building also enters lockdown mode, which stops badges from working in order to keep an intruder out. During an exterior threat lockdown, all exterior doors and windows are locked, and occupants remain inside. Persons in hallways and common areas move into a secured room, preferably a designated safe room. Blinds on the first floor are closed, and staff stay away from glass. Staff remain in secured areas until law enforcement authorities give the all clear. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"XP8yoT9g5FdnKMSBq"}},"3wzft349JB8B8sfGE":{"_id":"3wzft349JB8B8sfGE","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceAssessment","locale":"en","title":"Quiz"},"dates":{"dateCreated":"2026-10-17T05:36:43.003Z","dateModified":"2026-10-17T05:48:29.204Z"},"users":{"_userCreatorID":"fMCCj2F5RvKP s the difference between an active shooter and a hostile threat, and it describes situational awareness. The section also distinguishes interior, exterior, and combination threats, and it identifies the ways in which staff may receive threat notifications. Finally, the section presents the four tenets that guide initial decision-making during an incident.","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"4zZPSyhMi4YaDQuB2"}},"6GFtdna93of3aYziP":{"_id":"6GFtdna93of3aYziP","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"NGNTRep6Pnwf2Arhj"},"dates":{"dateCreated":"2026-10-16T19:08:13.705Z","dateModified":"2026-10-17T05:14:03.288Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"m4TzsyHPApLHrXY25","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"Mrwxcg5Qiw2d43GQc","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":62.025,"captions":[{"text":"Expectations differ according to the work location of the employee.","startTime":0.079,"finishTime":3.549},{"text":"Home-based employees work at an alternative location or remotely.","startTime":4.42,"finishTime":7.84},{"text":"These employees continue until the emergency response team and law enforcement","startTime":8.75,"finishTime":12.75},{"text":"determine that the agency and the surrounding vicinity are safe.","startTime":12.75,"finishTime":16.09},{"text":"Office-based employees follow different expectations depending","startTime":16.92,"finishTime":20.09},{"text":"on the type of threat.","startTime":20.09,"finishTime":21.17},{"text":"When an active shooter is in the building,","startTime":22.059,"finishTime":23.979},{"text":"employees who have the opportunity to leave practice run,","startTime":24.35,"finishTime":26.959},{"text":"hide,","startTime":27.19,"finishTime":27.51},{"text":"fight.","startTime":27.709,"finishTime":27.969},{"text":"Employees who are unable to leave stay in the office until the","startTime":28.899,"finishTime":31.809},{"text":"emergency response team and law enforcement determined that the area is safe.","startTime":31.809,"finishTime":35.68},{"text":"When an exterior threat exists,","startTime":36.709,"finishTime":38.549},{"text":"employees remain at the main office until the emergency response team","startTime":38.919,"finishTime":42.279},{"text":"determines that the agency and the surrounding vicinity are safe.","startTime":42.279,"finishTime":45.86},{"text":"Threatening behavior is handled differently.","startTime":46.549,"finishTime":48.659},{"text":"Depending on the severity,","startTime":49.529,"finishTime":50.93},{"text":"information technology,","startTime":51.54,"finishTime":52.54},{"text":"human resources,","startTime":52.779,"finishTime":53.819},{"text":"the manager of support and emergency operations,","startTime":54.02,"finishTime":56.659},{"text":"coverage staff,","startTime":56.9,"finishTime":57.779},{"text":"and the on-call supervisor report to the area of the behavior.","startTime":57.939,"finishTime":61.24}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRc ishTime":15.149},{"text":"First,","startTime":16.09,"finishTime":16.67},{"text":"staff close and lock the door.","startTime":16.69,"finishTime":18.309},{"text":"Second,","startTime":19.29,"finishTime":19.69},{"text":"staff place a door stopper under the door.","startTime":19.979,"finishTime":21.989},{"text":"Third,","startTime":22.86,"finishTime":23.26},{"text":"staff block the door with heavy furniture","startTime":23.54,"finishTime":25.6},{"text":"such as tables,","startTime":25.78,"finishTime":26.649},{"text":"desks,","startTime":26.86,"finishTime":27.299},{"text":"file cabinets,","startTime":27.5,"finishTime":28.37},{"text":"or book shelves.","startTime":28.489,"finishTime":29.459},{"text":"Fourth,","startTime":30.36,"finishTime":30.75},{"text":"if no other item is available,","startTime":30.87,"finishTime":32.369},{"text":"staff use small wedges such as a shoe or a binder.","startTime":32.79,"finishTime":35.81},{"text":"5th,","startTime":36.72,"finishTime":37.22},{"text":"staff seek additional cover inside the room,","startTime":37.4,"finishTime":39.419},{"text":"such as a closet or storage area.","startTime":39.72,"finishTime":41.419},{"text":"Staff also check whether the door opens inward or outward.","startTime":42.419,"finishTime":45.369},{"text":"A door that opens outward cannot be barricaded,","startTime":46.13,"finishTime":48.689},{"text":"so another room may be needed.","startTime":48.889,"finishTime":50.369}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["WWBfzQ5BurKQNxSFc","4QH3GqEvrXT7WAwRb"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"A barricade is makeshift. The objective is not to keep an assailant out for many hours. The objective is to delay, deter, and defend until the assailant moves on or law enforcement arrives. Five steps are used to build a barricade. First, staff close and lock the door. Second, staff place a door stopper under the door. Third, staff block the door with heavy furniture, such as tables, desks, file cabinets, or bookshelves. Fourth, if no other item is available, staff use small wedges, such as a shoe or a binder. Fifth, staff seek additional cover inside the room, such as a closet or storage area. Staff also check whether the door opens inward or outward. A door that opens outward cannot be barricaded, so another room may be needed.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"A barricade is makeshift. The objective is not to keep an assailant out for many hours. The objective is to delay, deter, and defend until the assailant moves on or law enforcement arrives. Five steps are used to build a barricade. First, staff close and lock the door. Second, staff place a door stopper under the door. Third, staff block the door with heavy furniture, such as tables, desks, file cabinets, or bookshelves. Fourth, if no other item is available, staff use small wedges, such as a shoe or a binder. Fifth, staff seek additional cover inside the room, such as a closet or storage area. Staff also check whether the door opens inward or outward. A door that opens outward cannot be barricaded, so another room may be needed.","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"kYC5hXKgwtq6ikm6D"}},"8qWcmy3ANKRNigubq":{"_id":"8qWcmy3ANKRNigubq","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"qZPYYiy2Hi4kT5z7w"},"dates":{"dateCreated":"2026-10-16T18:57:30.164Z","dateModified":"2026-10-17T04:33:00.022Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE "text":"Staff generally shelter in place or relocate to a safe room.","startTime":30.94,"finishTime":34.36},{"text":"Evacuation is generally avoided because the exit","startTime":35.24,"finishTime":38.279},{"text":"doors could be monitored by assailants.","startTime":38.279,"finishTime":40.259},{"text":"When the threat cannot be identified,","startTime":41.13,"finishTime":42.799},{"text":"the worst case scenario is assumed until","startTime":43.06,"finishTime":45.06},{"text":"a more accurate identification can be made.","startTime":45.06,"finishTime":47.52},{"text":"More than one assailant may be involved,","startTime":48.419,"finishTime":50.5},{"text":"and communication and signaling systems are activated to alert others.","startTime":50.58,"finishTime":54.659}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["qZPYYiy2Hi4kT5z7w","bwGbtmd4Jq3WZxZdn"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The first step in any response is to identify the type of threat. Three types are defined. An interior threat is located inside the facility. The response options are to escape, shelter in place, relocate to a lockdown area, or take action. An exterior threat is located outside the facility. The response is to lock down the facility, remain inside, and use safe rooms. A combination threat is located both inside and outside the facility. Staff generally shelter in place or relocate to a safe room. Evacuation is generally avoided, because the exit doors could be monitored by assailants. When the threat cannot be identified, the worst-case scenario is assumed until a more accurate identification can be made. More than one assailant may be involved, and communication and signaling systems are activated to alert others.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The first step in any response is to identify the type of threat. Three types are defined. An interior threat is located inside the facility. The response options are to escape, shelter in place, relocate to a lockdown area, or take action. An exterior threat is located outside the facility. The response is to lock down the facility, remain inside, and use safe rooms. A combination threat is located both inside and outside the facility. Staff generally shelter in place or relocate to a safe room. Evacuation is generally avoided, because the exit doors could be monitored by assailants. When the threat cannot be identified, the worst-case scenario is assumed until a more accurate identification can be made. More than one assailant may be involved, and communication and signaling systems are activated to alert others.","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"4oAdqx6P4BrjLET8g"}},"9ngM83HqBsbZZCmfe":{"_id":"9ngM83HqBsbZZCmfe","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"LvDRDPybSsuhy7ifa"},"dates":{"dateCreated":"2026-10-16T19:01:31.730Z","dateModified":"2026-10-16T19:49:44.525Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"yES3NrnwzCpS5vrn8","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","borde tartTime":38.569,"finishTime":40.419},{"text":"and everyone remains quiet.","startTime":40.68,"finishTime":42.2},{"text":"Staff call 911 when it is safe to do so.","startTime":43.08,"finishTime":45.819},{"text":"One caution applies.","startTime":46.709,"finishTime":48.09},{"text":"Staff do not open the door to an unfamiliar voice.","startTime":48.95,"finishTime":51.689},{"text":"The voice may belong to the assailant who may","startTime":52.479,"finishTime":54.88},{"text":"be attempting to lure victims from the room.","startTime":54.88,"finishTime":57.02}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["LvDRDPybSsuhy7ifa","rs5EApKeqSuGEJxpt"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Shelter-in-place is used when evacuation is not possible, or when the location of the assailant is uncertain. When choosing a location, staff use a designated safe room whenever one is available. Otherwise, staff choose a room that can be locked, barricaded, or both, and that has no large panes of glass or windows. Lobbies, hallways, and open common areas are avoided. Inside the room, staff lock the door and turn off the lights. Staff close and block the blinds or windows, if applicable. Staff stay away from doors and windows and use available cover. Cell phones are silenced, radios and televisions are turned off, and everyone remains quiet. Staff call 9-1-1 when it is safe to do so. One caution applies. Staff do not open the door to an unfamiliar voice. The voice may belong to the assailant, who may be attempting to lure victims from the room. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","prompt {"text":"4th,","startTime":23.659,"finishTime":24.2},{"text":"staff tell others to exit and prevent anyone from entering the area of a threat.","startTime":24.379,"finishTime":28.5},{"text":"5th staff proceed to the rally point,","startTime":29.42,"finishTime":31.75},{"text":"which is the designated area outside the building.","startTime":31.92,"finishTime":34.38},{"text":"6th staff remain at the rally point until","startTime":35.33,"finishTime":37.909},{"text":"law enforcement authorities give the instruction to leave.","startTime":37.909,"finishTime":40.77},{"text":"Several cautions apply.","startTime":41.61,"finishTime":43.06},{"text":"A hallway may be more dangerous when the location of the shooter is unknown,","startTime":43.819,"finishTime":47.459},{"text":"and the better option may then be to barricade and shelter in place.","startTime":47.619,"finishTime":50.88},{"text":"When fleeing,","startTime":51.779,"finishTime":52.5},{"text":"staff use cover such as brick walls,","startTime":52.74,"finishTime":54.939},{"text":"large trees,","startTime":55.169,"finishTime":55.979},{"text":"or the front tire or engine of a vehicle.","startTime":56.18,"finishTime":58.509},{"text":"After escaping,","startTime":59.369,"finishTime":60.299},{"text":"staff move away from the exit doors and do not gather close to the building.","startTime":60.58,"finishTime":64.379}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["bnuttCcrNSEtzZcHj","n2RTFNNnBEoGWKoHm"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Escape and evacuation is the recommended choice when an interior threat exists and a safe path is available. Six guidelines apply. First, staff know a primary and a secondary evacuation route. Second, staff leave by the safest and closest exit. Third, staff carry nothing in the hands, move quickly, and keep the hands visible. Fourth, staff tell others to exit and prevent anyone from entering the area of the threat. Fifth, staff proceed to the Rally Point, which is the designated area outside the building. Sixth, staff remain at the Rally Point until law enforcement authorities give the instruction to leave. Several cautions apply. A hallway may be more dangerous when the location of the shooter is unknown, and the better option may then be to barricade and shelter in place. When fleeing, staff use cover, such as brick walls, large trees, or the front tire or engine of a vehicle. After escaping, staff move away from the exit doors and do not gather close to the building. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Escape and evacuation is the recommended choice when an interior threat exists and a safe path is available. Six guidelines apply. First, staff know a primary and a secondary evacuation route. Second, staff leave by the safest and closest exit. Third, staff carry nothing in the hands, move quickly, and keep the hands visible. Fourth, staff tell others to exit and prevent anyone from entering the area of the threat. Fifth, staff proceed to the Rally Point, which is the designated area outside the building. Sixth, staff remain at the Rally Point until law enforcement authorities give the instruction to leave. Several cautions apply. A hallway may be more dangerous when the location of the shooter is unknown, and the better option may then be to barricade and shelter in place. When fleeing, staff use cover, such as brick walls, large trees, or the front tire or engine of a vehicle. After escaping, staff move away from the exit doors and do not gather close to the building. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"CxNG67xvHt4NXeKnh"}},"HukYikSTLQkcqnKvv":{"_id":"HukYikSTLQkcqnKvv","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Knowledge Check 8"},"dates":{"dateCreated":"2026-10-17T05:31:41.492Z","dateModified":"2026-10-17T05:33:00.224Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true,"questions":["3FdQJdKk6YLRvwwRP"]},"video":{"autoPlay":true,"overlays":[{"identifier":"fty3P25jQBocibL8B","kind":"overlay","type":"questionMC","width":1152,"height":648,"x":64,"y":36,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":16},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"}},"questionId":"3FdQJdKk6YLRvwwRP","start":0,"behaviorType":"pause"}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":[],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"P9t9DyWzZKuwpMMZS":{"_id":"P9t9DyWzZKuwpMMZS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"pYiFkrcr5qHnvyN6G"},"dates":{"dateCreated":"2026-10-16T19:02:32.314Z","dateModified":"2026-10-16T19:51:35.529Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"qrovvLanGgPai2mnK","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"DeT3WhtXtEELS8qC3","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":47,"captions":[{"text":"Taking action applies only when an individual cannot evacuate,","startTime":0.129,"finishTime":3.559},{"text":"cannot find secure shelter,","startTime":3.769,"finishTime":5.25},{"text":"and cannot avoid direct confrontation with an assailant.","startTime":5.449,"finishTime":8.289},{"text":"This option is the last resort.","startTime":9.199,"finishTime":10.96},{"text":"In this situation,","startTime":11.779,"finishTime":12.939},{"text":"several defensive actions may be used.","startTime":13.14,"finishTime":15.239},{"text":"The individual acts as aggressively as possible and","startTime":16.01,"finishTime":18.77},{"text":"yells to create noise as a distraction.","startTime":18.77,"finishTime":20.989},{"text":"The individual may throw items at the assailant and may use improvised weapons.","startTime":21.899,"finishTime":26.02},{"text":"If possible,","startTime":26.79,"finishTime":27.569},{"text":"the individual swarms the assailant together with others.","startTime":27.829,"finishTime":30.77},{"text":"Several considerations apply.","startTime":31.639,"finishTime":33.43},{"text":"More than one assailant may be present.","startTime":34.279,"finishTime":36.099},{"text":"Each individual uses personal discretion.","startTime":37.169,"finishTime":39.459},{"text":"Direction home Akron Canton does not require,","startTime":40.319,"finishTime":42.75},{"text":"and no individual is obligated to engage an assailant.","startTime":43.049,"finishTime":46.209}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["pYiFkrcr5qHnvyN6G","DeT3WhtXtEELS8qC3"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Taking action applies only when an individual cannot evacuate, cannot find secure shelter, and cannot avoid direct confrontation with an assailant. This option is the last resort. In this situation, several defensive actions may be used. The individual acts as aggressively as possible and yells to create noise as a distraction. The individual may throw items at the assailant and may use improvised weapons. If possible, the individual swarms the assailant together with others. Several considerations apply. More than one assailant may be present. Each individual uses personal discretion. Direction Home Akron Canton does not require, and no individual is obligated, to engage an assailant. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Taking action applies only when an individual cannot evacuate, cannot find secure shelter, and cannot avoid direct confrontation with an assailant. This option is the last resort. In this situation, several defensive actions may be used. The individual acts as aggressively as possible and yells to create noise as a distraction. The individual may throw items at the assailant and may use improvised weapons. If possible, the individual swarms the assailant together with others. Several considerations apply. More than one assailant may be present. Each individual uses personal discretion. Direction Home Akron Canton does not require, and no individual is obligated, to engage an assailant. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"ZJ3SHwA7LReCbo82G"}},"RjtLBLxsKvqQQ9AcC":{"_id":"RjtLBLxsKvqQQ9AcC","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"5ifHjGWwdLmmBz4ir"},"dates":{"dateCreated":"2026-10-16T19:07:10.313Z","dateModified":"2026-10-17T05:13:54.991Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"bx2ew4az76SyNdkYY","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"KG2MJjSt5xHDXHQFo","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":63.875,"captions":[{"text":"The designated safe rooms were chosen for thick walls,","startTime":0.009,"finishTime":3.1189999999999998},{"text":"solid doors with locks,","startTime":3.3689999999999998,"finishTime":4.65},{"text":"minimal interior windows,","startTime":4.789,"finishTime":6.4},{"text":"and available items for barricading.","startTime":6.599,"finishTime":8.568999999999999},{"text":"5 safe rooms are located on the 1st floor.","startTime":9.489,"finishTime":12.069},{"text":"These are the Human Resources and Financial Services division conference room,","startTime":12.96,"finishTime":16.989},{"text":"storage room 114,","startTime":17.149,"finishTime":18.739},{"text":"information technology storage room 130,","startTime":19.35,"finishTime":21.549},{"text":"wellness room 127,","startTime":21.739,"finishTime":23.389},{"text":"and the fitness center restroom.","startTime":23.59,"finishTime":25.069},{"text":"Storage room 114 and storage room 130 require a barricade to secure the door.","startTime":26.01,"finishTime":30.79},{"text":"3 safe rooms are located on the 2nd floor.","startTime":31.649,"finishTime":34.069},{"text":"These are the Chief Executive Officer Office,","startTime":35.119,"finishTime":37.229},{"text":"Room 213,","startTime":37.45,"finishTime":38.569},{"text":"storage room 222,","startTime":38.689,"finishTime":40.36},{"text":"and the Home and Community-based Services storage room 244.","startTime":40.529,"finishTime":44.189},{"text":"Storage room 222 requires a key lock or a barricade to secure the door.","startTime":45.09,"finishTime":49.4},{"text":"Safe room locations are subject to maximum capacity,","startTime":50.4,"finishTime":53.61},{"text":"and they are subject to the availability of keys.","startTime":53.72,"finishTime":56.36},{"text":"Staff identify the nearest safe room in advance","startTime":57.209,"finishTime":59.95},{"text":"so that the location is known before an emergency occurs.","startTime":60.13,"finishTime":63.11}],"needToCompleteSlideForPageCompletion":false,"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["5ifHjGWwdLmmBz4ir","KG2MJjSt5xHDXHQFo"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The designated safe rooms were chosen for thick walls, solid doors with locks, minimal interior windows, and available items for barricading. Five safe rooms are located on the first floor. These are the Human Resources and Financial Services Division Conference Room, Storage Room 114, Information Technology Storage Room 130, Wellness Room 127, and the Fitness Center Restroom. Storage Room 114 and Storage Room 130 require a barricade to secure the door. Three safe rooms are located on the second floor. These are the Chief Executive Officer Office, Room 213, Storage Room 222, and the Home and Community-Based Services Storage Room 244. Storage Room 222 requires a key lock or a barricade to secure the door. Safe room locations are subject to maximum capacity, and they are subject to the availability of keys. Staff identify the nearest safe room in advance, so that the location is known before an emergency occurs.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The designated safe rooms were chosen for thick walls, solid doors with locks, minimal interior windows, and available items for barricading. Five safe rooms are located on the first floor. These are the Human Resources and Financial Services Division Conference Room, Storage Room 114, Information Technology Storage Room 130, Wellness Room 127, and the Fitness Center Restroom. Storage Room 114 and Storage Room 130 require a barricade to secure the door. Three safe rooms are located on the second floor. These are the Chief Executive Officer Office, Room 213, Storage Room 222, and the Home and Community-Based Services Storage Room 244. Storage Room 222 requires a key lock or a barricade to secure the door. Safe room locations are subject to maximum capacity, and they are subject to the availability of keys. Staff identify the nearest safe room in advance, so that the location is known before an emergency occurs.","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"E9piYSHBbSjPd8TdK"}},"TECbo3ZKdJ6B28RH6":{"_id":"TECbo3ZKdJ6B28RH6","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"pg8qdMSKhzBzAoEud"},"dates":{"dateCreated":"2026-10-16T19:11:36.741Z","dateModified":"2026-10-17T05:35:23.786Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"K6mHmGatzSNh6SQfL","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"qD4HZABAHRmN98zFk","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":65.0125,"captions":[{"text":"When law enforcement arrives,","startTime":0.09,"finishTime":1.679},{"text":"staff follow a consistent set of actions.","startTime":1.929,"finishTime":4.26},{"text":"Staff remain calm and follow the instructions of the officers.","startTime":5.09,"finishTime":8.289},{"text":"Staff put down any items held in the hands.","startTime":9.14,"finishTime":11.68},{"text":"Immediately raise the hands,","startTime":11.72,"finishTime":13.17},{"text":"spread the fingers,","startTime":13.369,"finishTime":14.279},{"text":"and keep the hands visible at all times.","startTime":14.449,"finishTime":16.629},{"text":"Staff avoid quick movements toward officers,","startTime":17.52,"finishTime":19.95},{"text":"and they avoid pointing,","startTime":20.079,"finishTime":21.319},{"text":"screaming,","startTime":21.399,"finishTime":21.959},{"text":"and yelling.","startTime":22.11,"finishTime":22.799},{"text":"Staff do not stop to ask officers for help,","startTime":23.67,"finishTime":26.19},{"text":"and they proceed in the direction from which officers are entering.","startTime":26.35,"finishTime":29.29},{"text":"Staff tell officers any information about the location of the shooter.","startTime":30.17,"finishTime":33.869},{"text":"Staff can also expect certain actions from responders.","startTime":34.74,"finishTime":37.819},{"text":"The first officers do not stop to help injured","startTime":38.619,"finishTime":41.02},{"text":"persons because their priority is to stop the threat.","startTime":41.02,"finishTime":44.06},{"text":"Rescue teams of additional officers and emergency medical personnel follow,","startTime":44.97,"finishTime":49.209},{"text":"and these teams treat and remove injured persons.","startTime":49.369,"finishTime":51.93},{"text":"The rescue teams may ask able-bodied individuals to help remove the wounded.","startTime":52.709,"finishTime":56.709},{"text":"Staff may be held at a safe location until the situation","startTime":57.549,"finishTime":60.669},{"text":"is under control and all witnesses have been identified and questioned.","startTime":60.669,"finishTime":64.209}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["pg8qdMSKhzBzAoEud","qD4HZABAHRmN98zFk"],"childResources":[],"overlayTemplateIds" ation about the location of the shooter. Staff can also expect certain actions from responders. The first officers do not stop to help injured persons, because their priority is to stop the threat. Rescue teams of additional officers and emergency medical personnel follow, and these teams treat and remove injured persons. The rescue teams may ask able-bodied individuals to help remove the wounded. Staff may be held at a safe location until the situation is under control and all witnesses have been identified and questioned.","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"bBzy37WZ9wzwFucxL"}},"TRbzNc85anjYiW2MZ":{"_id":"TRbzNc85anjYiW2MZ","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"q4haNsqQFxJF6ki4s"},"dates":{"dateCreated":"2026-10-16T19:09:46.711Z","dateModified":"2026-10-17T05:35:10.983Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"Tc5wueJC8yTLBtwod","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"F9kLuhaFjYmkAShJZ","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":26.8625,"captions":[ omLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"qjYdSfSLHkiRMx7x2","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":51.6,"captions":[{"text":"Three special considerations apply during a threat.","startTime":0.079,"finishTime":2.74},{"text":"The first concerns the fire alarm.","startTime":3.549,"finishTime":5.59},{"text":"If the fire alarm is activated and an emergency","startTime":6.369,"finishTime":9.17},{"text":"text alert reports a threat in the building,","startTime":9.17,"finishTime":11.149},{"text":"staff do not evacuate immediately.","startTime":11.568999999999999,"finishTime":13.449},{"text":"Staff follow the directions in the text alert.","startTime":14.35,"finishTime":16.659},{"text":"A person who intends harm may have activated the","startTime":17.469,"finishTime":19.899},{"text":"alarm to draw staff out of secure areas.","startTime":19.899,"finishTime":22.329},{"text":"The second concerns the all clear.","startTime":23.12,"finishTime":25.079},{"text":"Staff remain in secured areas until the","startTime":25.94,"finishTime":27.94},{"text":"all clear is received from authorized sources.","startTime":27.94,"finishTime":30.559},{"text":"Silence,","startTime":31.479,"finishTime":32.08},{"text":"the absence of noise or an unverified voice is not at all clear.","startTime":32.209,"finishTime":36.029},{"text":"Staff do not respond to voice commands until certain","startTime":36.93,"finishTime":39.5},{"text":"that the commands come from actual law enforcement.","startTime":39.5,"finishTime":41.979},{"text":"The third concerns lockdown access.","startTime":42.79,"finishTime":44.81},{"text":"Badges stop working during lockdown mode,","startTime":45.86,"finishTime":48.009},{"text":"and staff may leave if leaving is the safest action.","startTime":48.169,"finishTime":50.639}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["CE2Bvf8xZNDvkbfqc","qjYdSfSLHkiRMx7x2"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Three special considerations apply during a threat. The first concerns the fire alarm. If the fire alarm is activated and an emergency text alert reports a threat in the building, staff do not evacuate immediately. Staff follow the directions in the text alert. A person who intends harm may have activated the alarm to draw staff out of secure areas. The second concerns the all clear. Staff remain in secured areas until the all clear is received from authorized sources. Silence, the absence of noise, or an unverified voice is not an all clear. Staff do not respond to voice commands until certain that the commands come from actual law enforcement. The third concerns lockdown access. Badges stop working during lockdown mode, and staff may leave if leaving is the safest action. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Three special considerations apply during a threat. The first concerns the fire alarm. If the fire alarm is activated and an emergency text alert reports a threat in the building, staff do not evacuate immediately. Staff follow the directions in the text alert. A person who intends harm may have activated the alarm to draw staff out of secure areas. The second concerns the all clear. Staff remain in secured areas until the all clear is received from authorized sources. Silence, the absence of noise, or an unverified  in the alert and the Active Shooter Policy in the Continuity of Operations Plan, abbreviated as the COOP, on the employee portal. A separate process applies to external threats. When an external threat is a danger to staff, an emergency text alert indicates a lockdown. IT also notifies employees by all-staff email, text, and page. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"When an active shooter or threatening person is in the building, the alert process of the Agency begins immediately. The process follows a set sequence. First, an emergency text alert instructs staff to run, hide, and fight. Second, Information Technology staff, abbreviated as IT staff, have access to the cameras. These staff send an email notification to all employees and call 9-1-1. Third, the Safety Officer, or the back-up Safety Officer, sends a text notification to all employees. Fourth, the Incident Command Staff monitor the situation and inform staff. Fifth, staff follow the instructions in the alert and the Active Shooter Policy in the Continuity of Operations Plan, abbreviated as the COOP, on the employee portal. A separate process applies to external threats. When an external threat is a danger to staff, an emergency text alert indicates a lockdown. IT also notifies employees by all-staff email, text, and page. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"g24LHimWWMTDjRA5a"}},"iYbRuig8kNjYtAK2H":{"_id":"iYbRuig8kNjYtAK2H","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"PawvBaqEzytaqpGeT"},"dates":{"dateCreated":"2026-10-16T18:59:55.345Z","dateModified":"2026-10-16T19:46:37.50 hTime":44.54},{"text":"the continuity of operations plan,","startTime":44.659,"finishTime":46.659},{"text":"and the emergency response plan are available","startTime":46.819,"finishTime":49.279},{"text":"on the employee portal for detailed reference.","startTime":49.279,"finishTime":51.72}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["7ihF6uTqDokc3ceDx","SFgC3CxMnniwjxFiw"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Preparation before an event improves the safety of every person in the building. In any threat, staff identify the type of threat, determine its proximity, assume a leadership role, and respond. Staff run when a safe path exists, hide when evacuation is not possible, and fight only as a last resort. Staff also know the location of the nearest safe room, two evacuation routes, and the Rally Point in the Aldi parking lot. A fire alarm that is accompanied by a threat alert does not trigger immediate evacuation, and staff follow the text alert. After an incident, staff wait for a verified all clear, follow the instructions of law enforcement, and support recovery. The Emergency Action Plan, the Continuity of Operations Plan, and the Emergency Response Plan are available on the employee portal for detailed reference. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JennyNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Preparation before an event improves the safety of every person in the building. In any threat, staff identify the type of threat, determine its proximity, assume a leadership role, and respond. Staff run when a safe path exists, hide when evacuatio ile thread is broader.","startTime":15.97,"finishTime":17.549},{"text":"The individual may use knives,","startTime":18.37,"finishTime":20.09},{"text":"explosive devices,","startTime":20.2,"finishTime":21.44},{"text":"blunt objects,","startTime":21.569,"finishTime":22.6},{"text":"or other improvised weapons.","startTime":22.77,"finishTime":24.409},{"text":"A hostile individual may also exhibit behaviors","startTime":25.159,"finishTime":27.959},{"text":"that require an emergency action response.","startTime":27.959,"finishTime":30.379},{"text":"The EAP uses the word assailant for any individual whose intent","startTime":31.18,"finishTime":34.819},{"text":"is to cause harm to another person or a targeted group.","startTime":34.819,"finishTime":37.599},{"text":"The distinction matters because the response is based on the threat itself.","startTime":38.509,"finishTime":42.61},{"text":"Staff respond to the threat,","startTime":43.22,"finishTime":44.61},{"text":"whatever form the threat takes.","startTime":44.75,"finishTime":46.31}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["zdPC4YwxmKT7GN3Fp","xx65EoDKxeFFHpuAc"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The Emergency Action Plan, abbreviated as the EAP, uses the term active shooter and hostile threat. The term covers a range of situations. An active shooter is an aggressive individual who is armed in the traditional sense, such as with a gun. A hostile threat is broader. The individual may use knives, explosive devices, blunt objects, or other improvised weapons. A hostile individual may also exhibit behaviors that require an emergency action response. The EAP uses the word assailant for any individual whose intent is to cause harm to another person or a targeted group. The distinction matters because the le and creates protection barriers. The third tenet is to assume a leadership role. Staff direct those under their supervision to safety. When it is safe, staff serve as a communication liaison with first responders. The fourth tenet is to respond to the threat. The person selects the response option that fits the circumstances. When the proximity of the threat cannot be determined, the safest place to be is inside a secure room. A secure room is the default choice. ","voiceCodeUsed":"en-US-JennyNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"drtBbZtHatTsRvrC6"}},"w7wJiyAX3LCvyfvgb":{"_id":"w7wJiyAX3LCvyfvgb","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank"},"dates":{"dateCreated":"2026-10-16T19:04:09.595Z","dateModified":"2026-10-17T04:36:37.748Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true,"questions":["ybSfjuDWK4BeJ38Rg"]},"video":{"autoPlay":true,"overlays":[{"identifier":"JursrpChvdNEnMZaZ","kind":"overlay","type":"questionMatchText","width":1152,"height":648,"x":64,"y":36,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":16},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"}},"questionId":"ybSfjuDWK4BeJ38Rg","start":0,"behaviorType":"pause"}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":[],"child
