ailant is uncertain. Fight means to take action. This option is a last resort and is used only when no other option exists. The best option depends on the circumstances. Each option may still result in a negative consequence, so each decision is made with the information available at the time. ","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"pRwCvLCBKfG5K86KS","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">The Run, Hide, Fight model organizes the response options, and the model corresponds to the response options in the Emergency Action Plan. Run means to escape or evacuate. This option is used when a safe escape path exists. Hide means to shelter in place or to relocate to a lockdown area. This option is used when evacuation is not possible, or when the location of the assailant is uncertain. Fight means to take action. This option is a last resort and is used only when no other option exists. The best option depends on the circumstances. Each option may still result in a negative consequence, so each decision is made with the information available at the time. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The run,","startTime":0.009,"finishTime":0.61},{"text":"hide,","startTime":0.85,"finishTime":1.21},{"text":"fight model organizes the response options,","startTime":1.409,"finishTime":3.839},{"text":"and the model corresponds to the response options in the emergency action plan.","startTime":4.01,"finishTime":8.09},{"text":"Run means to escape or evacuate.","startTime":9.01,"finishTime":10.97},{"text":"This option is used when a safe escape path exists.","startTime":11.859,"finishTime":14.88},{"text":"Hyde means to sh ly during a threat. The first concerns the fire alarm. If the fire alarm is activated and an emergency text alert reports a threat in the building, staff do not evacuate immediately. Staff follow the directions in the text alert. A person who intends harm may have activated the alarm to draw staff out of secure areas. The second concerns the all clear. Staff remain in secured areas until the all clear is received from authorized sources. Silence, the absence of noise, or an unverified voice is not an all clear. Staff do not respond to voice commands until certain that the commands come from actual law enforcement. The third concerns lockdown access. Badges stop working during lockdown mode, and staff may leave if leaving is the safest action. ","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"YTnZTrXiCcy5JmWg5","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">Three special considerations apply during a threat. The first concerns the fire alarm. If the fire alarm is activated and an emergency text alert reports a threat in the building, staff do not evacuate immediately. Staff follow the directions in the text alert. A person who intends harm may have activated the alarm to draw staff out of secure areas. The second concerns the all clear. Staff remain in secured areas until the all clear is received from authorized sources. Silence, the absence of noise, or an unverified voice is not an all clear. Staff do not respond to voice commands until certain that the commands come from actual law enforcement. The third concerns lockdown access. Badges stop working during lockdown mode, and staff may leave if leaving is the safest action. \u003c/voice>\n          \u003c/speak>"},"cap ns. The section also covers safe room concepts and barricading techniques, and it describes how to choose the safest response based on the circumstances.","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"iYbRuig8kNjYtAK2H","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">Section 2 presents the response to a threat. This section introduces the Run, Hide, Fight model and explains each of the three options. The section also covers safe room concepts and barricading techniques, and it describes how to choose the safest response based on the circumstances.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Section 2 presents the response to a threat.","startTime":0.17,"finishTime":2.529},{"text":"This section introduces the run,","startTime":3.45,"finishTime":5.21},{"text":"hide,","startTime":5.489,"finishTime":5.849},{"text":"fight,","startTime":6.05,"finishTime":6.239},{"text":"model,","startTime":6.289,"finishTime":6.57},{"text":"and explains each of the three options.","startTime":6.65,"finishTime":8.689},{"text":"The section also covers safe room concepts and barricading techniques,","startTime":9.489,"finishTime":13.399000000000001},{"text":"and it describes how to choose the safest response based on the circumstances.","startTime":13.568999999999999,"finishTime":17.61}]}},"Pm6irzjwbWow7AjCN":{"_id":"Pm6irzjwbWow7AjCN","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":143773,"uploadedFileName":"Responding-to-a-Threat.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-10-16T19:00:14.111Z","dateModified":"2026-10 ff,","startTime":17.93,"finishTime":19.709},{"text":"have access to the cameras.","startTime":19.809,"finishTime":21.379},{"text":"These staff send an email notification to all employees and call 911.","startTime":22.219,"finishTime":26.6},{"text":"Third,","startTime":27.479,"finishTime":27.86},{"text":"the safety officer or the backup safety officer","startTime":27.959,"finishTime":31.159},{"text":"sends a text notification to all employees.","startTime":31.159,"finishTime":33.799},{"text":"4th,","startTime":34.709,"finishTime":35.15},{"text":"the incident command staff monitor the situation and inform staff.","startTime":35.27,"finishTime":39.09},{"text":"5th staff follow the instructions in the alert and the active shooter policy in","startTime":39.93,"finishTime":44.189},{"text":"the continuity of operations plan abbreviated as the coup on the employee portal.","startTime":44.189,"finishTime":48.93},{"text":"A separate process applies to external threats.","startTime":49.74,"finishTime":52.459},{"text":"When an external threat is a danger to staff,","startTime":53.319,"finishTime":55.5},{"text":"an emergency text alert indicates a lockdown.","startTime":55.689,"finishTime":58.369},{"text":"IT also notifies employees by all staff email,","startTime":59.18,"finishTime":62.139},{"text":"text,","startTime":62.34,"finishTime":62.7},{"text":"and page.","startTime":62.81,"finishTime":63.54}]}},"RJao7cHNAmF3XQf2B":{"_id":"RJao7cHNAmF3XQf2B","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":789120,"uploadedFileName":"Jenny-en-Contacting911-10162026.mp3","uploadedFileNameExtension":".mp3","duration":32.8375},"dates":{"dateCreated":"2026-10-16T20:03:49.524Z","dateModified":"2026-10-16T20:03:50.968Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"Staff call 9-1-1 as soon as it is safe to do so. The call is made from a secured location, and staff speak in a calm, clear manner so that the dispatcher can relay the information quickly to responding law enforcement and emergency personnel. If speaking is not safe, staff leave the line open so that the dispatcher can hear what is taking place. The dispatcher can determine the location of a caller without the caller speaking. Staff also use the available communication systems, such as mobile phones, when it is safe to do so. ","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"abN2y37oc4rpYhWxx","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">Staff call 9-1-1 as soon as it is safe to do so. The call is made from a secured location, and staff speak in a calm, clear manner so that the dispatcher can relay the information quickly to responding law enforcement and emergency personnel. If speaking is not safe, staff leave the line open so that the dispatcher can hear what is taking place. The dispatcher can determine the location of a caller without the caller speaking. Staff also use the available communication systems, such as mobile phones, when it is safe to do so. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Staff call 911 as soon as it is safe to do so.","startTime":0.09,"finishTime":3.109},{"text":"The call is made from a secured location,","startTime":3.92,"finishTime":6.11},{"text":"and staff speak in a calm,","startTime":6.28,"finishTime":7.719},{"text":"clear manner so that the dispatcher can relay the","startTime":7.969,"finishTime":10.67},{"text":"information quickly to responding law enforcement and emergency personnel.","startTime":10.67,"finishTime":14.279},{"text":"If speaking is not safe,","startTime":15.119,"finishTime":16.559},{"text":"staff leave the line open so that the dispatcher can hear what is taking place.","startTime":16.85,"finishTime":20.549},{"text":"The dispatcher can determine the location of a caller without the caller speaking.","startTime":21.34,"finishTime":25.319},{"text":"Staff also use the available communication systems,","startTime":26.229,"finishTime":29.409},{"text":"such as mobile phones when it is safe to do so.","startTime":29.42,"finishTime":32.06}]}},"SFgC3CxMnniwjxFiw":{"_id":"SFgC3CxMnniwjxFiw","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":430852,"uploadedFileName":"Conclusion (10).png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-10-16T19:14:08.279Z","dateModified":"2026-10-16T19:14:08.279Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"vCChnD8NYx6gNMmm6","thumbnail":"hP4WFbGxDgRugALHF"},"TrSrDbjZ2mZNaNpxC":{"_id":"TrSrDbjZ2mZNaNpxC","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1121472,"uploadedFileName":"Jenny-en-LockdownProcedures-10162026.mp3","uploadedFileNameExtension":".mp3","duration":46.7},"dates":{"dateCreated":"2026-10-16T19:57:50.129Z","dateModified":"2026-10-16T19:57:51.998Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"A lockdown protects people from a hostile event. At Direction Home Akron Canton, a lockdown has several features. Doors are locked on the outside, and staff and the public are unable to enter the building. Staff may leave the building if leaving is the safest action. The building also enters lockdown mode, which stops badges from working in order to keep an intruder out. During an exterior threat lockdown, all exterior doors and windows are locked, and occupants remain inside. Persons in hallways and common areas move into a secured room, preferably a designated safe room. Blinds on the first floor are closed, and staff stay away from glass. Staff remain in secured areas until law enforcement authorities give the all clear. ","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"3vt7vQ6jDFFHskseF","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">A lockdown protects people from a hostile event. At Direction Home Akron Canton, a lockdown has several features. Doors are locked on the outside, and staff and the public are unable to enter the building. Staff may leave the building if leaving is the safest action. The building also enters lockdown mode, which stops badges from working in order to keep an intruder out. During an exterior threat lockdown, all exterior doors and windows are locked, and occupants remain inside. Persons in hallways and common areas move into a secured room, preferably a designated safe room. Blinds on the first floor are closed, and staff stay away from glass. Staff remain in secured areas until law enforcement authorities give the all clear. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"A lockdown protects people from a hostile event.","startTime":0.009,"finishTime":2.529},{"text":"At Direction Home Akron Canton,","startTime":3.39,"finishTime":5.119},{"text":"a lockdown has several features.","startTime":5.239,"finishTime":7.059},{"text":"Doors are locked on the outside and staff and","startTime":7.92,"finishTime":10.479},{"text":"the public are unable to enter the building.","startTime":10.479,"finishTime":12.38},{"text":"Staff may leave the building if leaving is the safest action.","startTime":13.399000000000001,"finishTime":16.399},{"text":"The building also enters lockdown mode,","startTime":17.229,"finishTime":19.35},{"text":"which stops badges from working in order to keep an intruder out.","startTime":19.51,"finishTime":22.709},{"text":"During an exterior threat lockdown,","startTime":23.6,"finishTime":25.44},{"text":"all exterior doors and windows are locked,","startTime":25.6,"finishTime":27.87},{"text":"and occupants remain inside.","startTime":28.04,"finishTime":29.68},{"text":"Persons in hallways and common areas move into a secured room,","startTime":30.51,"finishTime":33.83},{"text":"preferably a designated safe room.","startTime":34.069,"finishTime":35.93},{"text":"Blinds on the first floor are closed and staff stay away from glass.","startTime":36.79,"finishTime":40.729},{"text":"Staff remain in secured areas until law","startTime":41.569,"finishTime":43.729},{"text":"enforcement authorities give the all clear.","startTime":43.729,"finishTime":45.75}]}},"WWBfzQ5BurKQNxSFc":{"_id":"WWBfzQ5BurKQNxSFc","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1228032,"uploadedFileName":"Jenny-en-BarricadingTechniques-10162026.mp3","uploadedFileNameExtension":".mp3","duration":51.1375},"dates":{"dateCreated":"2026-10-16T19:50:27.537Z","dateModified":"2026-10-16T19:50:29.540Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"A barricade is makeshift. The objective is not to keep an assailant out for many hours. The objective is to delay, deter, and defend until the assailant moves on or law enforcement arrives. Five steps are used to build a barricade. First, staff close and lock the door. Second, staff place a door stopper under the door. Third, staff block the door with heavy furniture, such as tables, desks, file cabinets, or bookshelves. Fourth, if no other item is available, staff use small wedges, such as a shoe or a binder. Fifth, staff seek additional cover inside the room, such as a closet or storage area. Staff also check whether the door opens inward or outward. A door that opens outward cannot be barricaded, so another room may be needed.","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"8bCkthimsuMp28HyL","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">A barricade is makeshift. The objective is not to keep an assailant out for many hours. The objective is to delay, deter, and defend until the assailant moves on or law enforcement arrives. Five steps are used to build a barricade. First, staff close and lock the door. Second, staff place a door stopper under the door. Third, staff block the door with heavy furniture, such as tables, desks, file cabinets, or bookshelves. Fourth, if no other item is available, staff use small wedges, such as a shoe or a binder. Fifth, staff seek additional cover inside the room, such as a closet or storage area. Staff also check whether the door opens inward or outward. A door that opens outward cannot be barricaded, so another room may be needed.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"A barricade is makeshift.","startTime":0.009, e facility, staff lock down the facility, remain inside, and use a safe room. When the threat is both inside and outside the facility, staff hide in a safe room, and evacuation is generally avoided. When the assailant is within reach and no other option exists, staff fight as a last resort. One reminder applies to every exterior threat. Until the threat is neutralized, individuals do not exit into an open area where an outside assailant may be waiting.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The best response depends on where the threat is","startTime":0.079,"finishTime":2.24},{"text":"located and what is known about the situation.","startTime":2.24,"finishTime":4.65},{"text":"When the thread is inside the facility and a safe exit path is available,","startTime":5.539,"finishTime":9.25},{"text":"staff run to the rally point.","startTime":9.71,"finishTime":11.27},{"text":"When the threat is inside the facility,","startTime":12.13,"finishTime":14.029},{"text":"but the location of the assailant is unknown or the exit is unsafe,","startTime":14.13,"finishTime":17.649},{"text":"staff hide by locking and barricading a room.","startTime":18.01,"finishTime":20.37},{"text":"When the threat is outside the facility,","startTime":21.29,"finishTime":23.2},{"text":"staff lock down the facility,","startTime":23.45,"finishTime":24.93},{"text":"remain inside,","startTime":25.209,"finishTime":25.95},{"text":"and use a safe room.","startTime":26.17,"finishTime":27.309},{"text":"When the threat is both inside and outside the facility,","startTime":28.18,"finishTime":30.979},{"text":"staff hide in a safe room,","startTime":31.27,"finishTime":32.529},{"text":"and evacuation is generally avoided.","startTime":32.759,"finishTime":34.909},{"text":"When the assailant is within reach and no other option exists,","startTime":35.75,"finishTime":38.909},{"text":"staff fight as a last resort.","startTime":39.229,"finishTime":40.88},{"text":"O ributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":148521,"uploadedFileName":"image.png","height":369,"uploadedFileNameExtension":".png","width":359},"dates":{"dateCreated":"2026-10-17T04:59:37.018Z","dateModified":"2026-10-17T04:59:37.018Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"BrA3wf5ZLRiYehyaL","thumbnail":"Wfryf2tnpvcrwqBeq"},"zdPC4YwxmKT7GN3Fp":{"_id":"zdPC4YwxmKT7GN3Fp","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1131840,"uploadedFileName":"Jenny-en-ActiveShootervsHostileThreat-10162026.mp3","uploadedFileNameExtension":".mp3","duration":47.125},"dates":{"dateCreated":"2026-10-16T19:32:58.342Z","dateModified":"2026-10-16T19:33:00.596Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The Emergency Action Plan, abbreviated as the EAP, uses the term active shooter and hostile threat. The term covers a range of situations. An active shooter is an aggressive individual who is armed in the traditional sense, such as with a gun. A hostile threat is broader. The individual may use knives, explosive devices, blunt objects, or other improvised weapons. A hostile individual may also exhibit behaviors that require an emergency action response. The EAP uses the word assailant for any individual whose intent is to cause harm to another person or a targeted group. The distinction matters because the response is based on the threat itself. Staff respond to the threat, whatever form the threat takes.","voiceCode":"en-US-JennyNeural","language":"en","originalResourceId":"kjhdrxexc4cfBcphq","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JennyNeural\">The Emergency Action Plan, abbreviated as the EAP, uses the term active shooter and hostile threat. The term covers a range of situations. An active shooter is an aggressive individual who is armed in the traditional sense, such as with a gun. A hostile threat is broader. The individual may use knives, explosive devices, blunt objects, or other improvised weapons. A hostile individual may also exhibit behaviors that require an emergency action response. The EAP uses the word assailant for any individual whose intent is to cause harm to another person or a targeted group. The distinction matters because the response is based on the threat itself. Staff respond to the threat, whatever form the threat takes.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The Emergency Action Plan,","startTime":0.009,"finishTime":1.5699999999999998},{"text":"abbreviated as the EAP,","startTime":1.69,"finishTime":3.289},{"text":"uses the term active shooter and hostile threat.","startTime":3.529,"finishTime":5.829},{"text":"The term covers a range of situations.","startTime":6.829,"finishTime":9.069},{"text":"An active shooter is an aggressive individual","startTime":9.859,"finishTime":12.22},{"text":"who is armed in the traditional sense,","startTime":12.22,"finishTime":14.079},{"text":"such as with a gun.","startTime":14.25,"finishTime":15.22},{"text":"A hostile thread is broader.","startTime":15.97,"finishTime":17.549},{"text":"The individual may use knives,","startTime":18.37,"finishTime":20.09},{"text":"explosive devices,","startTime":20.2,"finishTime":21.44},{"text":"blunt objects,","startTime":21.569,"finishTime":22.6},{"text":"or other improvised weapons.","startTime":22.77,"finishTime":24.409},{"text":"A hostile individual may also exhibit behaviors","startTime":25.159,"finishTime":27.959},{"text":"that require an emergency action response.","startTime":27.959,"finishTime":30.379},{"text":"The EAP uses the word assailant for any individual whose intent","startTime":31.18,"finishTime":34.819},{"text":"is to cause harm to another person or a targeted group.","startTime":34.819,"finishTime":37.599},{"text":"The distinction matters because the response is based on the threat itself.","startTime":38.509,"finishTime":42.61},{"text":"Staff respond to the threat,","startTime":43.22,"finishTime":44.61},{"text":"whatever form the threat takes.","startTime":44.75,"finishTime":46.31}]}},"ztkY2657iKB4nDGfS":{"_id":"ztkY2657iKB4nDGfS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":501054,"uploadedFileName":"image.png","height":711,"uploadedFileNameExtension":".png","width":1024},"dates":{"dateCreated":"2026-10-17T05:09:47.799Z","dateModified":"2026-10-17T05:09:47.799Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"o8iiYYfu3Xxe7TXQr","thumbnail":"iDXuCctNAASvr7xrc"}},"questionsById":{"2LiSpzBbACBrkHc92":{"_id":"2LiSpzBbACBrkHc92","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>The fire alarm sounds, and an emergency text alert reports a threat in the building. What should staff do?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["DAZg6fwvAPFWLzX6W"],"multipleAnswers":false},"submitButton":{"containerOverlay":{"identifier":"jvYYtvC8Rz45JS24x","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type  way of the main drive so that emergency responders can perform their duties.\u003c/div>\n"}},"responses":[{"identifier":"ybvCLkxjrmBdRWdY5","description":{"type":"text","html":"\u003cdiv>The north end of the second floor\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"TnWh4anscXAbJd25f","description":{"type":"text","html":"\u003cdiv>The front lobby\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"y4qNRmnoHsCAgBewu","description":{"type":"text","html":"\u003cdiv>The Aldi parking lot, on the west side of the building\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"tFYRzAWTaLQKdAg9J","description":{"type":"text","html":"\u003cdiv>Any location the staff member selects\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"36CJg2dyYu24LWYTm":{"_id":"36CJg2dyYu24LWYTm","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>An emergency text alert reports an armed person in the parking lot. A staff member is working near the main entrance on the first floor. What is the best response?\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["owPv23q5gf4yZbCjr"],"multipleAnswers":false},"submitButton":{"containerOverlay":{"identifier":"TXiY4dkMCXbzaWgXv","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:15:32.224Z","dateCreated":"2026-10-17T05:09:58.532Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong>&nbsp;For an exterior threat, the facility is locked down, occupants remain inside, and persons near exterior entrances move to a secured room, preferably a designated safe room.&nbsp;\u003c/div>\n","feedbackNegative":"\u003cdiv>\n\u003cdiv>\u003cstrong>Incorrect:\u003c/strong>&nbsp;\u003c/div>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>A. Walk outside to see the situation: Not correct. Until an exterior threat is neutralized, individuals do not exit into an open area where an assailant may be waiting.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>C. Leave through the nearest exit to reach a vehicle: Not correct. Exiting exposes the staff member to the assailant.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>D. Stand near the glass doors to watch for law enforcement: Not correct. Staff stay away from glass and use walls and secured rooms for concealment.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n"}},"responses":[{"identifier":"72h6d5FzTaXowfzda","description":{"type":"text","html":"\u003cdiv>Walk outside to see the situation.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"owPv23q5gf4yZbCjr","description":{"type":"text","html":"\u003cdiv>Move away from the entrance to a secured room without exterior exposure, such as a safe room, and remain inside.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"2DoKjzudwjTScK9dY","description":{"type":"text","html":"\u003cdiv>Leave the building through the nearest exit to reach a vehicle.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"bWFGmQusQhjGhQD32","description":{"type":"text","html":"\u003cdiv>Stand near the glass doors to watch for law enforcement.\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"3FdQJdKk6YLRvwwRP":{"_id":"3FdQJdKk6YLRvwwRP","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Law enforcement arrives. Select all of the correct actions for staff.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["KrcPr64XvzzEYA3xs","fuv7Daoge7wjZYQv2","ac8gtyYMmozeWNQgo","bPJdgDcvbbPCxdwP5"],"multipleAnswers":true},"submitButton":{"containerOverlay":{"identifier":"Mo6mxMak3Q9zS4NFS","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:34:14.329Z","dateCreated":"2026-10-17T05:33:00.100Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Officers must be able to see that staff are not threats. Quick movements toward officers, pointing, screaming, and yelling can be mistaken for a threat.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Staff keep the hands empty and visible, follow the instructions of the officers, and avoid quick movements, pointing, screaming, and yelling. Holding on to an officer may be mistaken for an attack.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Point and yell to attract attention\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"25P24JBR48aHSKGkx"},{"description":{"html":"\u003cdiv>Hold on to an officer for safety&nbsp;\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"v4FxNZtSX67Poe84W"},{"description":{"html":"\u003cdiv>Tell officers any information about the location of the shooter\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"KrcPr64XvzzEYA3xs"},{"description":{"html":"\u003cdiv>Raise the hands, spread the fingers, and keep the hands visible\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"fuv7Daoge7wjZYQv2"},{"description":{"html":"\u003cdiv>Put down any items held in the hands\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"ac8gtyYMmozeWNQgo"},{"identifier":"bPJdgDcvbbPCxdwP5","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Remain calm and follow the instructions of the officers\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"BWnhfKTXvfaacWvdF":{"_id":"BWnhfKTXvfaacWvdF","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Select all of the statements that describe a lockdown at Direction Home Akron Canton. \u003cstrong>Select all that apply.\u003c/strong>\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["dwuCW8PHfBd8eeND4","unnBYcKvW5Ay4e4Xd","AYmToaEsNyhBextED","xn3dScozJAYigzeQ7"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:49:38.594Z","dateCreated":"2026-10-17T05:48:29.161Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> A lockdown protects people from a hostile event and keeps an intruder out. Silence is not an all clear, and the all clear must come from authorized sources.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>Not quite. During a lockdown, entry is prevented, staff may leave only if leaving is the safest action, and badges stop working. Staff remain in secured areas until law enforcement authorities give the all clear. Silence or an unverified voice is not an all clear.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Staff and the public are unable to enter the building\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"dwuCW8PHfBd8eeND4"},{"description":{"html":"\u003cdiv>Staff may leave the building if leaving is the safest action&nbsp;\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"unnBYcKvW5Ay4e4Xd"},{"description":{"html":"\u003cdiv>The building enters lockdown mode, which stops badges from working\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"AYmToaEsNyhBextED"},{"description":{"html":"\u003cdiv>Occupants remain in secured areas until law enforcement gives the all clear\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"xn3dScozJAYigzeQ7"},{"identifier":"vtpehinciiCXDW9JB","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>A lockdown ends when the building becomes quiet&nbsp;\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"GmMaQBij8cr9bgsow":{"_id":"GmMaQBij8cr9bgsow","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMatchText","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Match each threat type to the general response.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["vYMEFeLhTKvS7GDfA tDgTYmR66XELemNEM","Dj9jx6x48bcogyLzS N6bNSxJGtjvBvFMBB","dZsLHLTM5jjTBewAS GpjbRTSanPeoAaKqo"],"shuffleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:39:45.592Z","dateCreated":"2026-10-17T05:38:12.945Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Identifying the type of threat is the first step in any response, and each type has a different general response.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> An interior threat allows four response options. An exterior threat calls for lockdown and remaining inside. A combination threat calls for sheltering in place or relocating to a safe room, because assailants could monitor the exit doors.\u003c/div>\n"}},"responses":[{"identifier":"Dj9jx6x48bcogyLzS","description":{"type":"text","html":"\u003cdiv>Interior Threat\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"dZsLHLTM5jjTBewAS","description":{"type":"text","html":"\u003cdiv>Exterior threat\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"vYMEFeLhTKvS7GDfA","description":{"type":"text","html":"\u003cdiv>Combination threat\u003c/div>\n","resourceWidthPercentage":100}}],"responsesMatchText":[{"identifier":"GpjbRTSanPeoAaKqo","description":{"type":"text","html":"\u003cdiv>Lock down the facility, remain inside, and use safe rooms&nbsp;\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"N6bNSxJGtjvBvFMBB","description":{"type":"text","html":"\u003cdiv>Escape, shelter in place, relocate to a lockdown area, or take action&nbsp;\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"tDgTYmR66XELemNEM","description":{"type":"text","html":"\u003cdiv>Shelter in place or relocate to a safe room, and generally avoid evacuation&nbsp;\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"JEeEmCdRshsEe6jKk":{"_id":"JEeEmCdRshsEe6jKk","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Select all of the details that staff provide to the 9-1-1 dispatcher, as many as possible.\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["WFRQ3PiXZGhHMztop","xupqMGANXuB5xmGtD","tcrgqrpH5htCYYvTX","zxHf9kvpnWmq8PbnN"],"multipleAnswers":true},"submitButton":{"containerOverlay":{"identifier":"BY9dAocnpnamkTGfg","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:31:37.235Z","dateCreated":"2026-10-17T05:29:56.044Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Location, number of people, injuries, and the description and location of the assailant are the most urgent details. Information is given in a calm, clear manner so that the dispatcher can relay it quickly.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>Not quite. The dispatcher needs the location, the number of people, injuries, a description of the threat and weapons, and the location and direction of travel of the assailant. Vendor information is not needed.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>The names of the vendors that supply the building&nbsp;\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"NKt4cSJJSDm5QWuLo"},{"description":{"html":"\u003cdiv>The location and direction of travel of the assailant\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"zxHf9kvpnWmq8PbnN"},{"description":{"html":"\u003cdiv>A description of the assailant and any weapons\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"tcrgqrpH5htCYYvTX"},{"description":{"html":"\u003cdiv>The number of people at the location and any injuries\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"xupqMGANXuB5xmGtD"},{"identifier":"WFRQ3PiXZGhHMztop","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>The specific location, including building name, floor, and room number\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"JzBR7rnoHCKBTei6C":{"_id":"JzBR7rnoHCKBTei6C","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>A staff member attempts to barricade a room and notices that the door opens outward. What is the correct conclusion?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["fbAtHXDCrPwj535KW"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:47:49.253Z","dateCreated":"2026-10-17T05:47:08.747Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> The direction in which the door opens is crucial in building a barricade, and a door that opens outward cannot be barricaded.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Staff check whether a door opens inward or outward. A door that opens outward cannot be barricaded. Opening the door to the hallway creates unnecessary exposure.\u003c/div>\n"}},"responses":[{"identifier":"qE4taYxagSDQNqePz","description":{"type":"text","html":"\u003cdiv>The door can be barricaded with a door stopper alone\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"fbAtHXDCrPwj535KW","description":{"type":"text","html":"\u003cdiv>A door that opens outward cannot be barricaded\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"BGBaLnv7owpW6JakL","description":{"type":"text","html":"\u003cdiv>The staff member opens the door to check the hallway\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"um37iJLWLE5un9dEx","description":{"type":"text","html":"\u003cdiv>The staff member removes the lock\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"TJYmNhxtcmdEizyTp":{"_id":"TJYmNhxtcmdEizyTp","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionTF","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>During a lockdown, silence in the building is a sufficient sign that the threat has ended, and staff may leave the secured room.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["gCuPEPNup6BzP4atn"]},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:44:34.968Z","dateCreated":"2026-10-17T05:44:09.918Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Silence, the absence of noise, or an unverified voice is not an all clear. Staff remain in secured areas until the all clear is received from authorized sources.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Staff remain in secured areas until law enforcement authorities give the all clear. An unfamiliar voice may belong to the assailant.&nbsp;\u003c/div>\n"}},"responses":[{"identifier":"MQ3P6DYTYTeHizB9c","description":{"type":"text","html":"True","resourceWidthPercentage":100}},{"identifier":"gCuPEPNup6BzP4atn","description":{"type":"text","html":"False","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"Wp6Y9CfEWbNZYjixj":{"_id":"Wp6Y9CfEWbNZYjixj","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which actions are part of building a barricade in a secured room? \u003cstrong>Select all that apply.&nbsp;\u003c/strong>\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["5dNxvNTSxyp8Q9cdG","FDYbgkAQfj7bJGmqr","2WebvKvpd2obvp7q2"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:42:12.920Z","dateCreated":"2026-10-17T05:41:04.453Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> The objective of a barricade is to delay, deter, and defend until the assailant moves on or law enforcement arrives. Staff also check the direction in which the door opens, because a door that opens outward cannot be barricaded.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>Not quite. Staff lock the door, place a door stopper, and block the door with heavy furniture. Staff stay away from doors and windows, and do not open the door to check the hallway.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Close and lock the door\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"5dNxvNTSxyp8Q9cdG"},{"description":{"html":"\u003cdiv>Stand near the door to listen for voices&nbsp;\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"RLXhYMXzJdEgPw7RP"},{"description":{"html":"\u003cdiv>Place a door stopper under the door\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"FDYbgkAQfj7bJGmqr"},{"description":{"html":"\u003cdiv>Block the door with heavy furniture\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"2WebvKvpd2obvp7q2"},{"identifier":"9pSErk7aiiZfLDrAR","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Prop the door open slightly to observe the hallway&nbsp;\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"Zxa5FT9MutgaQBHfS":{"_id":"Zxa5FT9MutgaQBHfS","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>When may a staff member use the Fight option in the Run, Hide, Fight model?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["Ro2ArqBjh5ZXdpswe"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:40:54.239Z","dateCreated":"2026-10-17T05:40:05.134Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Fight is a last resort. Direction Home Akron Canton does not require, and no individual is obligated, to engage an assailant.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>Not quite. Run and Hide are used first. Taking action applies only when evacuation, secure shelter, and avoiding confrontation are all impossible, and engaging an assailant is never required.\u003c/div>\n"}},"responses":[{"identifier":"HxE6HscpSXtBbcSou","description":{"type":"text","html":"\u003cdiv>Whenever an alert is received\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"8eLkKFcrpLqSfekLT","description":{"type":"text","html":"\u003cdiv>As the first choice, before attempting to evacuate\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"Ro2ArqBjh5ZXdpswe","description":{"type":"text","html":"\u003cdiv>As a last resort, when the staff member cannot evacuate, cannot find secure shelter, and cannot avoid direct confrontation\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"HubWjBFreEyNehLD3","description":{"type":"text","html":"\u003cdiv>Only when a supervisor gives the instruction\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"bcyj2iwcFA5fmaep5":{"_id":"bcyj2iwcFA5fmaep5","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>A staff member is at a desk on the second floor when gunfire is heard in the hallway at the north end. The staff member is near the south stairwell, and the path is clear. What is the best response?\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["moFpGnwWZq7xb7Aap"],"multipleAnswers":false},"submitButton":{"containerOverlay":{"identifier":"rd2yjANLPWejk4SvD","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:00:41.033Z","dateCreated":"2026-10-17T04:57:03.488Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> The threat is inside the facility, and a safe escape path is available. Escape and evacuation is the recommended choice in this circumstance. Carrying nothing and keeping the hands visible prevents confusion with an assailant when law enforcement arrives.&nbsp;\u003c/div>\n","feedbackNegative":"\u003cdiv>\n\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>\u003c/div>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>B. Walk toward the north hallway: Not correct. Moving toward the threat places the staff member in danger. The response is to move away from the threat.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>C. Call a coworker for information before moving: Not correct. Delay reduces the time available to escape. Staff act first and alert others as the threat is identified.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>D. Gather belongings before leaving: Not correct. Staff carry nothing in the hands and move quickly.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n"}},"responses":[{"identifier":"moFpGnwWZq7xb7Aap","description":{"type":"text","html":"\u003cdiv>Leave by the south stairwell, carry nothing, keep hands visible, proceed to the Rally Point.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"ochKuSFSzfRsGo9GK","description":{"type":"text","html":"\u003cdiv>Walk toward the north hallway to see what happened.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"e8gqD8Dw4SwMQdSPC","description":{"type":"text","html":"\u003cdiv>Call a coworker to ask for information before moving.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"LN9pocoZorx5SGno8","description":{"type":"text","html":"\u003cdiv>Gather belongings before leaving.\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"gAaeNzteF7oXzSxBW":{"_id":"gAaeNzteF7oXzSxBW","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>An emergency text alert reports an armed person in the parking lot. A staff member is near the main entrance on the first floor. What is the best response?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["CFrX7oJ9jR44Gzoxn"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:43:06.036Z","dateCreated":"2026-10-17T05:42:21.100Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> For an exterior threat, the facility is locked down and occupants remain inside. Until the threat is neutralized, individuals do not exit into an open area where an assailant may be waiting.\u003c/div>\n","feedbackNegative":"\u003cdiv>Not quite. Exiting or standing near glass exposes the staff member to the assailant. The correct response is to move to a safe room or other secured room and remain inside.\u003c/div>\n"}},"responses":[{"identifier":"BaQXBrRykry4c3YZW","description":{"type":"text","html":"\u003cdiv>Walk outside to see the situation\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"CFrX7oJ9jR44Gzoxn","description":{"type":"text","html":"\u003cdiv>Move away from the entrance to a safe room or other secured room, and remain inside\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"24pCD7xD3wgoMhctm","description":{"type":"text","html":"\u003cdiv>Leave through the nearest exit to reach a vehicle\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"5Pp8qh4fhMk97BNvq","description":{"type":"text","html":"\u003cdiv>Stand near the glass doors to watch for law enforcement\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"hcKeAcaS67juK79ih":{"_id":"hcKeAcaS67juK79ih","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>A staff member is in a first-floor storage room when screaming is heard. The assailant&#39;s location is unknown. The door opens inward and has a lock. What is the best response?\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["bD8q7KeY8zg7sAmgD"],"multipleAnswers":false},"submitButton":{"containerOverlay":{"identifier":"Eu2rJ9bCuNkAXsZQQ","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:14:41.255Z","dateCreated":"2026-10-17T05:02:53.356Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> The location of the assailant is unknown, and a hallway may be the more dangerous choice. The door opens inward, so the door can be barricaded. The goal is to delay, deter, and defend.\u003c/div>\n","feedbackNegative":"\u003cdiv>\n\u003cdiv>\u003cstrong>Incorrect:\u003c/strong>&nbsp;\u003c/div>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>A. Open the door to look into the hallway: Not correct. Opening the door exposes the occupants and may reveal the location of the room.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>B. Run into the hallway to find an exit: Not correct. When the location of the assailant is unknown, exiting into a hallway may be the more dangerous choice.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv>\n\u003cul>\n\t\u003cli>\n\t\u003cdiv>D. Wait near the door and listen for a familiar voice: Not correct. Staff stay away from doors, and an unfamiliar or unverified voice may belong to the assailant.&nbsp;\u003c/div>\n\t\u003c/li>\n\u003c/ul>\n\u003c/div>\n"}},"responses":[{"identifier":"8uRCE7knQMaovNYMN","description":{"type":"text","html":"\u003cdiv>Open the door to look into the hallway.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"g3g6uArjJSqziy7cH","description":{"type":"text","html":"\u003cdiv>Run into the hallway to find an exit.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"bD8q7KeY8zg7sAmgD","description":{"type":"text","html":"\u003cdiv>Lock the door, place a stopper, barricade with furniture, turn off lights, silence phones, remain quiet.\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"9MmW6pcuc9z8NSnbc","description":{"type":"text","html":"\u003cdiv>Wait near the door and listen for a familiar voice.\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"hwiTCDuLMJS4dRQix":{"_id":"hwiTCDuLMJS4dRQix","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Select all of the actions that belong inside a secured room during a hide response.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["PAb5Fr32haF7bbg2g","SQq77sk5JLHsWx3Pc","kSRZFoMaH7RqsCaCH","bRZP5jT2NNQAgFyN2"],"multipleAnswers":true},"submitButton":{"containerOverlay":{"identifier":"y9j6nzE2ux5pSpc9x","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T04:39:17.010Z","dateCreated":"2026-10-17T04:38:12.265Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> These actions delay, deter, and defend until the assailant moves on or law enforcement arrives. Staff do not respond to voice commands or open the door until certain that the commands come from actual law enforcement.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:&nbsp;\u003c/strong>Not quite. Inside a secured room, staff lock and barricade the door, turn off the lights, silence phones, remain quiet, and call 9-1-1 when safe. An unfamiliar voice may belong to the assailant, who may be attempting to lure victims from the room.&nbsp;&nbsp;\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Lock the door and place a door stopper under the door\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"PAb5Fr32haF7bbg2g"},{"identifier":"xnF3GMSNoQMCxAtMe","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Open the door to an unfamiliar voice that claims to be law enforcement&nbsp;\u003c/div>\n"}},{"description":{"html":"\u003cdiv>Turn off the lights and silence cell phones\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"SQq77sk5JLHsWx3Pc"},{"description":{"html":"\u003cdiv>Stay away from doors and windows and remain quiet\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"kSRZFoMaH7RqsCaCH"},{"description":{"html":"\u003cdiv>Call 9-1-1 when it is safe to do so\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"bRZP5jT2NNQAgFyN2"}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"miff9rnX44ubAN5Kb":{"_id":"miff9rnX44ubAN5Kb","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which statement best describes a hostile threat, as the term is used in the Emergency Action Plan (EAP)?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["n5Sq4sGkXZX2cFbiN"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:37:58.350Z","dateCreated":"2026-10-17T05:37:05.965Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> The EAP uses the term active shooter / hostile threat to cover situations in which an aggressive individual may not be armed in the traditional sense. The individual may also exhibit behaviors that require an emergency action response.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> A hostile threat is broader than a gunman. The individual may use knives, explosive devices, blunt objects, or other improvised weapons, and the threat may be inside, outside, or both.\u003c/div>\n"}},"responses":[{"identifier":"GHZLjrr3EJAJosNrm","description":{"type":"text","html":"\u003cdiv>Only an individual armed with a gun\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"n5Sq4sGkXZX2cFbiN","description":{"type":"text","html":"\u003cdiv>A broader situation in which an aggressive individual may use a gun, knives, explosive devices, blunt objects, or other improvised weapons\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"Wd3bwJ5mDM9aqFcHo","description":{"type":"text","html":"\u003cdiv>Only a threat that originates outside the building\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"qiR6FL9CKxBcuk5ia","description":{"type":"text","html":"\u003cdiv>Only a threat that law enforcement has already confirmed\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"pNYYDNhhCxuPMJwYS":{"_id":"pNYYDNhhCxuPMJwYS","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>An emergency text alert reports an armed person inside the building, and gunfire is also heard outside. Which type of threat is present?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["XPcQh3f52vCcMvejQ"],"multipleAnswers":false},"submitButton":{"containerOverlay":{"identifier":"rfuq8htwpSDpMnueu","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T04:34:24.671Z","dateCreated":"2026-10-17T04:33:19.474Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> A combination threat exists inside and outside the facility. Staff generally shelter in place or relocate to a safe room, and evacuation is generally avoided because assailants could monitor the exit doors.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. An interior threat is located only inside the facility, and an exterior threat is located only outside. A threat in both places is a combination threat. When a threat cannot be identified, the worst-case scenario is assumed until a more accurate identification can be made.\u003c/div>\n"}},"responses":[{"identifier":"umS7Srqwb5NW4Ym5z","description":{"type":"text","html":"\u003cdiv>Interior threat\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"PnF8sivKcqoBRByTD","description":{"type":"text","html":"\u003cdiv>Exterior threat\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"XPcQh3f52vCcMvejQ","description":{"type":"text","html":"\u003cdiv>Combination threat\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"haPTDbDji9FZ4i3r5","description":{"type":"text","html":"\u003cdiv>No threat, because the reports conflict\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"rdeZzzNszayvBDoMv":{"_id":"rdeZzzNszayvBDoMv","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>The fire alarm sounds, and an emergency text alert reports a threat in the building. What should staff do?&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["v3DYbfJakqA6wHGRP"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:44:02.533Z","dateCreated":"2026-10-17T05:43:14.386Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Staff follow the directions in the text alert and do not evacuate immediately. A person who intends harm may have activated the fire alarm to draw staff out of secure areas.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. The text alert takes priority over the fire alarm when a threat is reported in the building, because the alarm may have been activated to draw staff out of secure areas.\u003c/div>\n"}},"responses":[{"identifier":"PHZKXLHWsbD6aeWRJ","description":{"type":"text","html":"\u003cdiv>Evacuate immediately through the nearest exit\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"AexQQ5CwNnh4eW4RX","description":{"type":"text","html":"\u003cdiv>Ignore the text alert and follow the fire alarm\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"v3DYbfJakqA6wHGRP","description":{"type":"text","html":"\u003cdiv>Follow the directions in the text alert\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"8zaEDsNY8JFJGwFpF","description":{"type":"text","html":"\u003cdiv>Wait in the hallway for a supervisor\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"uZC4Jmq3KYAMPzfWR":{"_id":"uZC4Jmq3KYAMPzfWR","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Select all of the ways in which staff may become aware of a threat.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["YMWqsT83aQBoipbAD","xDTbaryJ23vvm68kd","zXNc3PHhmtQ4AzWLF","w8TrcgPb39tL5xgMr"],"multipleAnswers":true},"submitButton":{"containerOverlay":{"identifier":"Crm86aMDtExuPs9iM","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"button","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"fontColor":"koantic(light1, 1, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"clickAction":{"type":"goToPage","goToPage":{"type":"nextPage"}}}},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T04:35:51.532Z","dateCreated":"2026-10-17T04:34:43.927Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Staff may become aware of a threat through alerts, calls, text messages, video screens, in-person notification, and what is seen or heard. An emergency text alert gives specific instructions, and staff follow the instructions in the alert.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Threat information arrives through many channels, including emergency text alerts, phone calls, in-person notification, video screens, and sights and sounds such as running people, screaming, or gunfire. A notice on the Employee Portal is not an immediate notification method.&nbsp;\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>An emergency text alert\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"YMWqsT83aQBoipbAD"},{"description":{"html":"\u003cdiv>Running people or screaming\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"w8TrcgPb39tL5xgMr"},{"description":{"html":"\u003cdiv>The sound of gunfire\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"zXNc3PHhmtQ4AzWLF"},{"description":{"html":"\u003cdiv>In-person notification or video screens\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"xDTbaryJ23vvm68kd"},{"identifier":"ijKw5ny8tm2jhadaJ","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Only a notice posted on the Employee Portal&nbsp;\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"ybSfjuDWK4BeJ38Rg":{"_id":"ybSfjuDWK4BeJ38Rg","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMatchText","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Match each option in the Run, Hide, Fight model to its meaning and use.&nbsp;\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0,"correctResponses":["Ef4x8QrYhrzEZKQ8C pjXsdJxbcjaMGzLtg","7KwNm8DHTxdFZHF9x Z34szjbzkevbGXKt3","ChXJ2387iBBcEuwtp cHXzDYmsTYRFM8cxK"],"shuffleAnswers":true},"submitButton":{"containerOverlay":{"identifier":"b47JJ9BLT58iBF9mC","kind":"overlay","type":"button","width":320,"height":72,"x":832,"y":576,"entranceAnimati tml":"\u003cdiv>Shelter in place or relocate to a lockdown area when evacuation is not possible or the location of the assailant is uncertain&nbsp;\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"Z34szjbzkevbGXKt3","description":{"type":"text","html":"\u003cdiv>Escape or evacuate when a safe escape path exists&nbsp;\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"zPbbiGSWD5EkK2Dzj":{"_id":"zPbbiGSWD5EkK2Dzj","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which activities occur after the threat is neutralized? \u003cstrong>Select all that apply.&nbsp;\u003c/strong>\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["2wuZF8WCYszNxodAs","Yo7B43rsjprZPTsQD"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-17T05:45:52.100Z","dateCreated":"2026-10-17T05:44:45.602Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Accountability, notification, and the After Action Review support recovery and improve future preparedness. The facility also performs a post-lockdown assessment before resuming normal operations.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Staff do not re-enter the building until authorized personnel clear the building. The Agency accounts for individuals, sends notifications, and completes an After Action Review to improve the Emergency Action Plan.\u003c/div>\n"}},"responses":[{"identifier":"zL6mqbCcLwCWBqxTA","description":{"type":"text","html":"\u003cdiv>No review of the response is conducted&nbsp;\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"aaBAFyoxzSXLs2bfY","description":{"type":"text","html":"\u003cdiv>S
