erline":false,"size":20}},"isImage":true,"imageAsset":"N39D5jwz6BTuCjZ3C","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":49.4375,"captions":[{"text":"The COOP organizes emergency management into 4 stages readiness and preparation,","startTime":0.009,"finishTime":5.329},{"text":"activation,","startTime":5.489,"finishTime":6.17},{"text":"response,","startTime":6.489,"finishTime":6.889},{"text":"and recovery.","startTime":7.05,"finishTime":7.809},{"text":"Readiness and preparation is the ongoing work carried out throughout the year.","startTime":8.619,"finishTime":12.279},{"text":"Policies,","startTime":13.14,"finishTime":13.739},{"text":"training,","startTime":13.939,"finishTime":14.26},{"text":"drills,","startTime":14.34,"finishTime":14.97},{"text":"and awareness are kept current during this stage.","startTime":15.1,"finishTime":17.12},{"text":"Activation begins when an emergency is imminent.","startTime":18.03,"finishTime":20.67},{"text":"The chief executive officer activates the incident command System,","startTime":21.469,"finishTime":24.549},{"text":"abbreviated as ICS,","startTime":24.709,"finishTime":26.29},{"text":"and emergency text alerts are sent to staff.","startTime":26.469,"finishTime":28.75},{"text":"Response occurs while the emergency is taking place.","startTime":29.579,"finishTime":32.259},{"text":"Employees follow the hazard specific procedures and","startTime":33.119,"finishTime":35.65},{"text":"the division specific COOP recovery restores operations.","startTime":35.65,"finishTime":39.33},{"text":"Operations may reopen,","startTime":40.169,"finishTime":41.49},{"text":"shift to alternate facilities,","startTime":41.61,"finishTime":43.15},{"text":"or resume in phases,","startTime":43.25,"finishTime":44.409},{"text":"and an after action report is completed to","startTime":44.599,"finishTime":46.529},{"text":"record what happened and what improvements are needed.","startTime":46.529,"finishTime":48.65}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["YCHciQuYs3Bi2Twow","N39D5jwz6BTuCjZ3C"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The C O O P organizes emergency management into four stages: Readiness and Preparation, Activation, Response, and Recovery. Readiness and Preparation is the ongoing work carried out throughout the year. Policies, training, drills, and awareness are kept current during this stage. Activation begins when an emergency is imminent. The Chief Executive Officer activates the Incident Command System, abbreviated as I C S, and emergency text alerts are sent to staff. Response occurs while the emergency is taking place. Employees follow the hazard-specific procedures and the division-specific C O O P. Recovery restores operations. Operations may reopen, shift to alternate facilities, or resume in phases, and an After Action Report is completed to record what happened and what improvements are needed. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The C O O P organizes emergency management into four stages: Readiness and Preparation, Activation, Response, and Recovery. Readiness and Preparation is the ongoing work carried out throughout the year. Policies, training, drills, and awareness are kept current during this stage. Activation begins when an emergency is imminent. The Chief Executive Officer activates the Incident Command System, abbreviated as I C S, and emergency text alerts are sent to staff. Response occurs while the emergency is taking place. Employees follow the hazard-specific procedures and the division-specific C O O P. Recovery restores operations. Operations may reopen, shift to alternate facilities, or resume in phases, and an After Action Report is completed to record what happened and what improvements are needed. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"8wKnToAePZ5gTcNup"}},"yPeSrdr5LL2B37Bdy":{"_id":"yPeSrdr5LL2B37Bdy","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"WCckM34EMrT4HExYw"},"dates":{"dateCreated":"2026-10-13T14:03:55.177Z","dateModified":"2026-10-13T18:58:52.699Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"YpcyusDz3m5xkkbdp","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"bYma3hjP2cDqZ22Cz","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":66.375,"captions":[{"text":"The agency responds according to the level of the emergency,","startTime":0.079,"finishTime":2.99},{"text":"and 4 levels are defined.","startTime":3.089,"finishTime":4.61},{"text":"Level 0 is normal operation.","startTime":5.46,"finishTime":7.079},{"text":"No emergency exists","startTime":8.239,"finishTime":9.699},{"text":"and the agency remains in a normal duty status.","startTime":9.838,"finishTime":12.359},{"text":"Level one is elevated.","startTime":13.25,"finishTime":14.529},{"text":"An emergency may develop or worsen,","startTime":15.3,"finishTime":17.26},{"text":"such as when a storm watch is issued.","startTime":17.42,"finishTime":19.059},{"text":"Increased monitoring and possible planning to","startTime":19.829,"finishTime":21.909},{"text":"work from home are typical responses.","startTime":21.909,"finishTime":23.75},{"text":"Level 2 is a state emergency.","startTime":24.62,"finishTime":26.43},{"text":"A serious interruption has occurred.","startTime":27.159,"finishTime":29.079},{"text":"Examples include an active shooter,","startTime":29.889,"finishTime":31.69},{"text":"a significant power outage,","startTime":31.77,"finishTime":33.169},{"text":"or the loss of critical technology.","startTime":33.33,"finishTime":35.069},{"text":"Only key staff or needed emergency coordinators are called to duty.","startTime":35.88,"finishTime":39.299},{"text":"Level 3 is a major disaster.","startTime":40.159,"finishTime":41.979},{"text":"The event exceeds local capabilities,","startTime":42.709,"finishTime":44.77},{"text":"and the governor declares a state of emergency.","startTime":44.869,"finishTime":47.049},{"text":"The full COOP is activated for all divisions,","startTime":47.83,"finishTime":50.97},{"text":"typically within 24 hours.","startTime":51.029,"finishTime":52.669},{"text":"When a Level 2 or Level 3 emergency is received from the Ohio Department of Aging,","startTime":53.52,"finishTime":57.799},{"text":"abbreviated as AGE or from another state representative,","startTime":57.93,"finishTime":61.45},{"text":"the CEO or a designee instructs staff to implement the COOP.","startTime":61.65,"finishTime":65.61}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["WCckM34EMrT4HExYw","bYma3hjP2cDqZ22Cz"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The Agency responds according to the level of the emergency, and four levels are defined. Level 0 is Normal Operation. No emergency exists, and the Agency remains in a normal duty status. Level 1 is Elevated. An emergency may develop or worsen, such as when a storm watch is issued. Increased monitoring and possible planning to work from home are typical responses. Level 2 is a State Emergency. A serious interruption has occurred. Examples include an active shooter, a significant power outage, or the loss of critical technology. Only key staff or needed emergency coordinators are called to duty. Level 3 is a Major Disaster. The event exceeds local capabilities, and the Governor declares a state of emergency. The full C O O P is activated for all Divisions, typically within twenty-four hours. When a Level 2 or Level 3 emergency is received from the Ohio Department of Aging, abbreviated as A G E, or from another state representative, the CEO or a designee instructs staff to implement the C O O P.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The Agency responds according to the level of the emergency, and four levels are defined. Level 0 is Normal Operation. No emergency exists, and the Agency remains in a normal duty status. Level 1 is Elevated. An emergency may develop or worsen, such as when a storm watch is issued. Increased monitoring and possible planning to work from home are typical responses. Level 2 is a State Emergency. A serious interruption has occurred. Examples include an active shooter, a significant power outage, or the loss of critical technology. Only key staff or needed emergency coordinators are called to duty. Level 3 is a Major Disaster. The event exceeds local capabilities, and the Governor declares a state of emergency. The full C O O P is activated for all Divisions, typically within twenty-four hours. When a Level 2 or Level 3 emergency is received from the Ohio Department of Aging, abbreviated as A G E, or from another state representative, the CEO or a designee instructs staff to implement the C O O P.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"XKY6ajwYq5C4jrnos"}},"ygyuqBNxGFeNXtqAY":{"_id":"ygyuqBNxGFeNXtqAY","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"7Aqxa2W45dBL3bkQq"},"dates":{"dateCreated":"2026-10-13T14:49:10.348Z","dateModified":"2026-10-13T18:59:57.503Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"taa27kjMs9AX8XLyo","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"Qw4Awcm3SNXKHQsXR","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":51.775,"captions":[{"text":"A bomb threat may arrive by phone.","startTime":0.009,"finishTime":1.97},{"text":"The staff member who receives the threat notifies the chief executive officer,","startTime":2.74,"finishTime":6.3},{"text":"the supervisor,","startTime":6.5,"finishTime":7.329},{"text":"or the chief operating officer,","startTime":7.5,"finishTime":8.96},{"text":"abbreviated as the COO immediately.","startTime":9.18,"finishTime":11.779},{"text":"The staff member records in writing all details of the conversation.","startTime":12.539,"finishTime":15.92},{"text":"Details include the caller identification phone number,","startTime":16.78,"finishTime":19.459},{"text":"whether the caller has an accent,","startTime":19.62,"finishTime":20.959},{"text":"the gender of the caller,","startTime":21.26,"finishTime":22.329},{"text":"and the name of the caller.","startTime":22.54,"finishTime":23.62},{"text":"The staff member also records any statements about the location of","startTime":24.37,"finishTime":27.53},{"text":"the bomb and asks the caller to repeat what was said.","startTime":27.53,"finishTime":30.37},{"text":"If a suspicious object is found,","startTime":31.12,"finishTime":32.909},{"text":"staff do not touch the object.","startTime":33.159,"finishTime":34.72},{"text":"Staff report the object to the chief executive officer","startTime":35.569,"finishTime":38.25},{"text":"or the COO and stay clear of the area.","startTime":38.25,"finishTime":40.63},{"text":"When a bomb threat is made at the building,","startTime":41.43,"finishTime":43.229},{"text":"an emergency text alert instructs staff to evacuate.","startTime":43.36,"finishTime":46.159},{"text":"Each employee remains individually responsible for evacuating if necessary.","startTime":46.97,"finishTime":50.84}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["7Aqxa2W45dBL3bkQq","Qw4Awcm3SNXKHQsXR"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"ch
