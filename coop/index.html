        >\n            \u003cvoice name=\"en-CA-LiamNeural\">Welcome to the Continuity of Operations Plan and Emergency Preparedness course for staff of Direction Home Akron Canton Area Agency on Aging and Disabilities. The Continuity of Operations Plan, abbreviated as COOP, describes how the Agency continues essential services when an emergency disrupts normal operations. This course presents the practical actions that staff members take before, during, and after an emergency.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Welcome to the continuity of operations","startTime":0.119,"finishTime":2.009},{"text":"plan and emergency preparedness course for","startTime":2.009,"finishTime":4.05},{"text":"staff of Direction Home Akron Canton Area Agency on aging and disabilities.","startTime":4.05,"finishTime":8.01},{"text":"The continuity of operations plan,","startTime":8.818999999999999,"finishTime":10.659},{"text":"abbreviated as COO,","startTime":10.779,"finishTime":11.92},{"text":"describes how the agency continues essential services","startTime":12.38,"finishTime":14.789},{"text":"when an emergency disrupts normal operations.","startTime":14.789,"finishTime":17.02},{"text":"This course presents the practical actions that staff members take before,","startTime":17.959,"finishTime":21.28},{"text":"during,","startTime":21.52,"finishTime":21.879},{"text":"and after an emergency.","startTime":22.079,"finishTime":23.299}]}},"9PdyWbachNF25wzKS":{"_id":"9PdyWbachNF25wzKS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":672353,"uploadedFileName":"2_Why-Emergency-Preparedness-Matters.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-10-13T13:55:12.948Z","dateModified":"2026-10-13T13:55:12.948Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"vcEqn6i2bhaeczEAZ","thumbnail":"ns34azx4Ts6WmoEde"},"AQwFACjPeQh5BDmEt":{"_id":"AQwFACjPeQh5BDmEt","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1055808,"uploadedFileName":"Liam-en-COOPPurpose-10132026.mp3","uploadedFileNameExtension":".mp3","duration":43.9625},"dates":{"dateCreated":"2026-10-13T15:39:27.457Z","dateModified":"2026-10-13T15:39:38.694Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The C O O P, or continuity of operations plan, keeps essential services running when a disaster threatens the Agency. The plan serves several purposes. First, the plan protects assets, records, information, and the safety and well-being of employees. Second, the plan continues essential functions, especially when the primary facility is threatened or inaccessible. Third, the plan sets a target to re-establish critical operations within twenty-four to forty-eight hours of a declared disaster and to sustain those operations for a minimum of thirty days. Finally, the plan maintains the confidence of consumers, employees, funding providers, and vendors. Each of these purposes guides the actions presented in the remainder of the course. ","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"5YfQja6X4BDnntRNY","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">The C O O P, or continuity of operations plan, keeps essential services running when a disaster threatens xYw","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1593792,"uploadedFileName":"Liam-en-EmergnecyLevels-10132026.mp3","uploadedFileNameExtension":".mp3","duration":66.375},"dates":{"dateCreated":"2026-10-13T15:41:55.969Z","dateModified":"2026-10-13T15:41:58.093Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The Agency responds according to the level of the emergency, and four levels are defined. Level 0 is Normal Operation. No emergency exists, and the Agency remains in a normal duty status. Level 1 is Elevated. An emergency may develop or worsen, such as when a storm watch is issued. Increased monitoring and possible planning to work from home are typical responses. Level 2 is a State Emergency. A serious interruption has occurred. Examples include an active shooter, a significant power outage, or the loss of critical technology. Only key staff or needed emergency coordinators are called to duty. Level 3 is a Major Disaster. The event exceeds local capabilities, and the Governor declares a state of emergency. The full C O O P is activated for all Divisions, typically within twenty-four hours. When a Level 2 or Level 3 emergency is received from the Ohio Department of Aging, abbreviated as A G E, or from another state representative, the CEO or a designee instructs staff to implement the C O O P.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"yPeSrdr5LL2B37Bdy","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">Th uman-to-human spread exists. Phase IV applies when a confirmed case is on-site. In that phase, only essential personnel report to the Agency. Staff follow the instructions in each emergency alert and complete annual training on pandemic illnesses. Staff minimize social contact on and off Agency work sites when directed, and they follow the Division plan for a pandemic illness. When requested, staff report positive test results for a pandemic illness. ","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"8nj3BoB4F4q9w76Hm","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">When a pandemic disease affects the area, an emergency text alert instructs staff on next steps, and the Pandemic and Post-Pandemic Operations Plan applies. The Agency uses four phases to describe the level of risk. Phase I is low risk. No new virus sub-type has been detected in humans. Phase II is low to medium risk. No new virus sub-type has been identified with evidence of human-to-human spread. Phase III is high risk. Human infections with a new sub-type have been identified, and evidence of human-to-human spread exists. Phase IV applies when a confirmed case is on-site. In that phase, only essential personnel report to the Agency. Staff follow the instructions in each emergency alert and complete annual training on pandemic illnesses. Staff minimize social contact on and off Agency work sites when directed, and they follow the Division plan for a pandemic illness. When requested, staff report positive test results for a pandemic illness. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"When a pandemic disease affects the area,","startTime":0.009,"finishTime":1.95},{"text":"an emergency text alert instructs staff on next steps,","startTime":2.25,"finishTime":5.11},{"text":"and the pandemic and post-pandemic operations plan applies.","startTime":5.25,"finishTime":8.21},{"text":"The agency uses 4 phases to describe the level of risk.","startTime":9.06,"finishTime":12.119},{"text":"Phase one is low risk.","startTime":13.1,"finishTime":14.329},{"text":"No new virus subtype has been detected in humans.","startTime":15.359,"finishTime":17.969},{"text":"Phase 2 is low to medium risk.","startTime":18.809,"finishTime":20.809},{"text":"No new virus subtype has been identified with evidence of human to human spread.","startTime":21.67,"finishTime":25.67},{"text":"Phase 3 is high risk.","startTime":26.489,"finishTime":28.09},{"text":"Human infections with a new subtype have been identified,","startTime":28.92,"finishTime":31.62},{"text":"and evidence of human to human spread exists.","startTime":32,"finishTime":34.24},{"text":"Phase 4 applies when a confirmed case is on site.","startTime":35.11,"finishTime":37.83},{"text":"In that phase,","startTime":38.599,"finishTime":39.47},{"text":"only essential personnel report to the agency.","startTime":39.65,"finishTime":42},{"text":"Staff follow the instructions in each emergency alert","startTime":42.86,"finishTime":45.529},{"text":"and complete annual training on pandemic illnesses.","startTime":45.529,"finishTime":48.029},{"text":"Staff minimize social contact on and off agency work sites when directed,","startTime":48.93,"finishTime":52.919},{"text":"and they follow the division plan for a pandemic illness.","startTime":53.13,"finishTime":55.549},{"text":"When requested,","startTime":56.56,"finishTime":57.349},{"text":"staff report positive test results for a pandemic illness.","startTime":57.599,"finishTime":60.299}]}},"dbvh4dGJDjng4tjPi":{"_id":"dbvh4dGJDjng4tjPi","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInByte  routes and shelter locations for the work area. ","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"jsqvw9LLvC7ZfoK5e","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">Emergency planning is the responsibility of every staff member. The Agency provides structure and support, and staff complete their part. The Emergency Preparedness Committee includes one to two representatives from each Division. The Committee meets quarterly and notifies staff of changes to the C O O P. Human Resources directs new employees to the C O O P, the Division Specific C O O Pees, and the E O Pees. All staff receive an annual presentation on the C O O P at the All Staff meeting. Drills are held annually, with tornado drills in the spring, fire drills in the fall, and active shooter drills. Staff are expected to complete required training and participate in drills. Staff are also expected to know where the C O O P and the Division Specific C O O P are located, to keep contact information current with HR, and to know the evacuation routes and shelter locations for the work area. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Emergency planning is the responsibility of every staff member.","startTime":0.009,"finishTime":3.259},{"text":"The agency provides structure and support,","startTime":4.019,"finishTime":6.239},{"text":"and staff complete their part.","startTime":6.34,"finishTime":7.78},{"text":"The emergency Preparedness Committee includes 1","startTime":8.55,"finishTime":10.869},{"text":"to 2 representatives from each division.","startTime":10.869,"finishTime":12.789},{"text":"The committee meets quarterly and notifies staff of changes to the COOP.  we learn of an emergency, we notify the President and CEO, Operations staff, the Office of the State Ombudsman, and our Elder Rights team. We then gather facts about the scope and severity of the situation. Where possible, we verify those facts directly with facility management, residents, and families, and we collect a list of affected residents or family contacts. Throughout the response, we support each resident's right to make independent decisions about living arrangements, care, and privacy. The VP of Elder Rights leads the response, with Regional Program Supervisors as backups. The VP maintains facility information, identifies which residents are at risk, and determines the response, including the partners and resources needed. The VP also keeps Direction Home leadership, AGE, and other stakeholders informed. Inside an affected facility, our staff gather the resident roster and emergency contacts, track any transfers or hospital admissions, and keep communication open with facility management. They document their actions and, after a move, follow up with transitioned residents or families to identify any problems. Core Ombudsman services continue throughout the emergency. We keep providing information, advocacy, and complaint handling by phone, email, text, and our website. Direction Home Communications coordinates messaging with the public, media, and other stakeholders. Sensitive consumer information is recorded in MonAmi or AGE's SharePoint spreadsheet. If those state platforms are unavailable, staff use a standard form, such as the Associate Advocacy Report Form, to capture their work.The VP of Elder Rights activates the plan after consulting the President and CEO. Triggers include facility closures, natural disasters, severe weather, and incidents that disrupt resident care. The same leaders decide when we return to routine operations.The key takeaway is that this plan keeps us focused on protecting residents' rights and safety, gathering reliable infor -13T13:55:13.877Z","dateModified":"2026-10-13T13:55:13.877Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"RYsTJgWuHkL2MmtgD","thumbnail":"eJZFBHMxXdNPrfmaf"},"qKwGYc5dibKqvPEqY":{"_id":"qKwGYc5dibKqvPEqY","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":2653632,"uploadedFileName":"Liam-en-ProviderRelations-10132026.mp3","uploadedFileNameExtension":".mp3","duration":110.525},"dates":{"dateCreated":"2026-10-13T18:41:25.491Z","dateModified":"2026-10-13T18:41:28.598Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"This Provider Relations Continuity Plan explains how our team will keep communicating with providers, and recruit new ones when needed, during an emergency. Our two essential functions are communicating with providers and recruiting providers as needed. Every role on the team has a defined backup. Provider Relations Specialists back each other up. The Manager is backed up by the Non-Medicaid Team Leader, and the Team Leader by the Manager. The Vice President of Strategic Planning and Performance Improvement oversees the team, with the C O L O as backup. When a disaster occurs, the VP works with the Emergency Response Officer and the Incident Command Structure to determine whether there is an emergency. The VP then tells the Manager and Team Leader the emergency level, and the Manager directs staff on actions such as working from home, contacting providers, or retrieving vital records. The VP also works with Communications to reach the wider provider network and makes sure disaster assistance information reaches Home and Community Based Services, Elder Rights, and Communications. Email is our primary communication method, with text and phone calls as backups. Provider contact information is stored on the L: drive and copied monthly to an Excel file that any agency staff can use. The Communications Department can also reach providers through Constant Contact and social media. Critical files include the active Provider List in SharePoint and provider contracts on the L: drive. Provider information is also available in AGE's SAGE. If needed, we recruit providers to expand services in affected areas. Within a month after a disaster, the VP prepares an evaluation of our response, which is reviewed at the next E P C meeting. The key takeaway is that defined roles, clear communication, and ready access to provider information let us keep our provider network informed and supported when it matters most.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"sSgdsSeSPiPtKws9y","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">This Provider Relations Continuity Plan explains how our team will keep communicating with providers, and recruit new ones when needed, during an emergency. Our two essential functions are communicating with providers and recruiting providers as needed. Every role on the team has a defined backup. Provider Relations Specialists back each other up. The Manager is backed up by the Non-Medicaid Team Leader, and the Team Leader by the Manager. The Vice President of Strategic Planning and Performance Improvement oversees the team, with the C O L O as backup. When a disaster occurs, the VP works with the Emergency Response Officer and the Incident Command Structure to determine whether there is an emergency. The VP then tells the Manager and Team Leader the emergency level, and the Manager directs staff on actions such as working from home, contacting providers, or retrieving vital records. The VP also works with Communications to reach the wider provider network and makes sure disaster assistance information reaches Home and Community Based Services, Elder Rights, and Communications. Email is our primary communication method, with text and phone calls as backups. Provider contact information is stored on the L: drive and copied monthly to an Excel file that any agency staff can use. The Communications Department can also reach providers through Constant Contact and social media. Critical files include the active Provider List in SharePoint and provider contracts on the L: drive. Provider information is also available in AGE's SAGE. If needed, we recruit providers to expand services in affected areas. Within a month after a disaster, the VP prepares an evaluation of our response, which is reviewed at the next E P C meeting. The key takeaway is that defined roles, clear communication, and ready access to provider information let us keep our provider network informed and supported when it matters most.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"This provider relations continuity plan explains how","startTime":0.09,"finishTime":2.73},{"text":"our team will keep communicating with providers","startTime":2.73,"finishTime":4.969},{"text":"and recruit new ones when needed during an emergency.","startTime":5.09,"finishTime":7.829},{"text":"Our two essential functions are communicating with","startTime":8.64,"finishTime":10.97},{"text":"providers and recruiting providers as needed.","startTime":10.97,"finishTime":12.93},{"text":"Every role on the team has a defined backup.","startTime":13.75,"finishTime":16.158},{"text":"Provider relations specialists back each other up.","startTime":16.93,"finishTime":19.42},{"text":"The manager is backed up by the non- ithout windows. Doors to office areas are closed. Staff turn off computers and applications where able, and they avoid water, metal objects, and electrical wire. Staff outside the office follow different actions. Staff in vehicles stay in the vehicle. Staff outdoors go to the nearest ditch or ravine and drop to the knees. Staff do not stand in an open area or under a tree.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"Cu656WPEH5QkBHRo2","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">Two types of tornado notices require different responses. A tornado watch means that tornadoes are likely in the area. Staff are ready to act quickly and monitor weather information. A tornado warning means that the threat is imminent. An emergency text alert instructs staff to seek shelter immediately. Staff in the office shelter in the restrooms, the south stairwell, or enclosed offices without windows. Doors to office areas are closed. Staff turn off computers and applications where able, and they avoid water, metal objects, and electrical wire. Staff outside the office follow different actions. Staff in vehicles stay in the vehicle. Staff outdoors go to the nearest ditch or ravine and drop to the knees. Staff do not stand in an open area or under a tree.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Two types of tornado notices require different responses.","startTime":0.079,"finishTime":3.13},{"text":"A tornado watch means that tornadoes are likely in the area.","startTime":3.91,"finishTime":6.889},{"text":"Staff are ready to act quickly and monitor weather information.","startTime":7.73,"finishTime":10.47},{"text":"A tornado warning means that the threat is imminent.","startTime":11.489,"finishTime":13.93},{"text":"An emergency text alert instructs staff to seek shelter immediately.","startTime":14.77,"finishTime":18.2},{"text":"Staff in the office shelter in the restrooms,","startTime":19.059,"finishTime":21.069},{"text":"the south stairwell,","startTime":21.229,"finishTime":22.149},{"text":"or enclosed offices without windows.","startTime":22.309,"finishTime":24.229},{"text":"Doors to office areas are closed.","startTime":25.079,"finishTime":26.959},{"text":"Staff turn off computers and applications where able,","startTime":27.84,"finishTime":30.409},{"text":"and they avoid water,","startTime":30.569,"finishTime":31.53},{"text":"metal objects,","startTime":31.69,"finishTime":32.56},{"text":"and electrical wire.","startTime":32.72,"finishTime":33.81},{"text":"Staff outside the office followed different actions.","startTime":34.68,"finishTime":37.24},{"text":"Staff in vehicles stay in the vehicle.","startTime":38.139,"finishTime":39.97},{"text":"Staff outdoors go to the nearest ditch or ravine and drop to the knees.","startTime":40.99,"finishTime":44.299},{"text":"Staff do not stand in an open area or under a tree.","startTime":45.159,"finishTime":48.06}]}},"sfXxfHFuapykNojBW":{"_id":"sfXxfHFuapykNojBW","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":3123072,"uploadedFileName":"Liam-en-Finance-10132026.mp3","uploadedFileNameExtension":".mp3","duration":130.1},"dates":{"dateCreated":"2026-10-13T18:27:12.733Z","dateModified":"2026-10-13T18:27:15.941Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"This Financial Services Division Continuity Plan explains how we will keep our critical financial operations running during an emergency or disruption. Five functions must continue. They are processing payroll, provider billing, and accounts payable. We also prepare and submit requests for funds and invoices for our Grant and Risk contract activities. We purchase the supplies and equipment employees need, contact vendors and partners as required, and process and reconcile member share-of-cost accounts. Every one of these functions has a designated owner and a backup. For example, the Payroll/Accounting Specialist processes payroll with the Cash Specialist as backup. The Accountant I handles funds requests and grant invoices with the Manager of Accounting as backup. The CFO or designee handles vendor and partner contact with the A V P Finance/Controller as backup. Communication follows the chain of command. The Incident Commander notifies the CFO, who then informs the A V P Finance/Controller about the level of emergency. The A V P Finance/Controller and the Manager of Accounting serve as Team Leads. They direct staff on actions such as working from home or an alternate facility, processing payroll, and processing billing. If email is unavailable, we communicate by text and phone. The CFO also keeps current contacts for AGE, the AAAs, payors, our insurance risk advisor, P N C, Paycom, and other active vendors. Our critical files are stored in Financial Services folders on the L: drive. Several platforms are available without V P N, including Paycom, P N C online banking, and Office 365 email. Others, including the L: drive, S AGE, Ohio Benefits, and M I T S, require V P N. The plan is activated through the chain of command, and each Executive reviews the division's essential functions annually. The key takeaway is that clear roles, backups, communication, and secure access to files and systems let us keep paying staff and providers, billing our funders, and supporting members during any disruption.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"sTw28zT84y4Sy5GAK","ssml":"\u003cspeak \n emergency contact list. That list lets HR and the divisions reach employees even if agency phone lines are down. If an emergency lasts longer than 30 days, we also restore access to personnel records, keep the Employee Assistance Program active, and make payments to benefit vendors so coverage doesn't lapse. The HR Director and HR Generalist can each perform these functions, so the work continues even if one of them is unavailable. HR works with IT to keep the Help Desk available and to find a secure Wi-Fi network for processing payroll through Paycom. For communication, the HR team uses an established text group. Employees receive an initial alert through AlertMedia, followed by details by email, and the HR Help Desk serves as the main source for personnel, benefits, and payroll information. HR contacts external vendors as needed, based on the level of the emergency. All critical files are stored in the encrypted L:\\HR folder and should be copied to a backup location when possible. Paycom and Outlook, including the HR Help Desk, can be used without VPN. HR also follows the Incident Command System for emergencies such as tornadoes, power outages, fires, bomb threats, active shooter situations, and pandemic diseases. The key takeaway is that HR keeps employees paid and informed first, then restores records, assistance programs, and benefit payments if the emergency continues.\"","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"ZytSxrxMbN7ev7aqy","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">This Human Resources Continuity Plan explains how HR will keep employee support, payroll, and personnel functions running during an emergency. We organize our priorities by how long the emergency lasts. In an emergency under 30 days, our first priorities are the HR Help Desk, Paycom, payroll processing, and an up-to-date emergency contact list. That list lets HR and the divisions reach employees even if agency phone lines are down. If an emergency lasts longer than 30 days, we also restore access to personnel records, keep the Employee Assistance Program active, and make payments to benefit vendors so coverage doesn't lapse. The HR Director and HR Generalist can each perform these functions, so the work continues even if one of them is unavailable. HR works with IT to keep the Help Desk available and to find a secure Wi-Fi network for processing payroll through Paycom. For communication, the HR team uses an established text group. Employees receive an initial alert through AlertMedia, followed by details by email, and the HR Help Desk serves as the main source for personnel, benefits, and payroll information. HR contacts external vendors as needed, based on the level of the emergency. All critical files are stored in the encrypted L:\\HR folder and should be copied to a backup location when possible. Paycom and Outlook, including the HR Help Desk, can be used without VPN. HR also follows the Incident Command System for emergencies such as tornadoes, power outages, fires, bomb threats, active shooter situations, and pandemic diseases. The key takeaway is that HR keeps employees paid and informed first, then restores records, assistance programs, and benefit payments if the emergency continues.\"\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"This human resources continuity plan explains how HR will keep employee support,","startTime":0.09,"finishTime":4.369},{"text":"payroll,","startTime":4.57,"finishTime":5.09},{"text":"and personnel functions running during an emergency.","startTime":5.32,"finishTime":7.71},{"text":"We organize our priorities by how long the emergency lasts.","startTime":8.568999999 le":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"An emergency alert gives the specific action that staff must take, so the response begins with the alert itself. When an alert arrives, the employee reads the entire alert. The employee then follows the instructions in the alert. Examples of instructions include sheltering, evacuating, working remotely, or waiting for further instructions. The employee continues to watch for follow-up messages by text, email, and voicemail. If required, the employee notifies the supervisor of the location and status of the employee. One caution applies to fire alarms. If the fire alarm sounds and an emergency text alert reports a threat in the building, staff do not evacuate immediately. Staff follow the directions in the text alert. A person who intends harm may have activated the fire alarm to draw staff out of secure areas.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"Xmeo3zRFLzAv62g4o","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">An emergency alert gives the specific action that staff must take, so the response begins with the alert itself. When an alert arrives, the employee reads the entire alert. The employee then follows the instructions in the alert. Examples of instructions include sheltering, evacuating, working remotely, or waiting for further instructions. The employee continues to watch for follow-up messages by text, email, and voicemail. If required, the employee notifies the supervisor of the location and status of the employee. One caution applies to fire alarms. If the fire alarm sounds and an emergency text alert reports a threat in the building, staff do not evacuate 2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">The purpose of continuity planning is to keep services available to consumers during an emergency. Each Division defines the mission essential functions, which are the functions that must continue. If the Uniontown location has no power, the Division Supervisor instructs staff to provide only the essential functions that support staff and consumers. Several practical expectations apply. Staff work from home when directed and take the necessary equipment, such as a laptop, a power cord, a headset, and a MiFi device, which is a portable internet hotspot, if applicable. When systems are unavailable, staff document work on paper and enter the information once system access returns. This practice is used in the Aging and Disability Resource Center. Division Supervisors designate staff to contact consumers and advise them of the emergency. Once operations are restored, staff contact members according to acuity level. The Continuity of Operations Plan and the Division Specific Continuity of Operations Plans on the Employee Portal contain complete procedures.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The purpose of continuity planning is to keep","startTime":0.009,"finishTime":2.089},{"text":"services available to consumers during an emergency.","startTime":2.089,"finishTime":4.67},{"text":"Each division defines the mission essential functions,","startTime":5.48,"finishTime":7.909},{"text":"which are the functions that must continue.","startTime":8.119,"finishTime":9.88},{"text":"If the Uniontown location has no power,","startTime":10.72,"finishTime":12.89},{"text":"the division supervisor instructs staff to provide only","startTime":13.09,"finishTime":15.619},{"text":"the essential functions that support staff and consumers. ties unless community visits are suspended. Second, communication will follow the established chain of command. Staff and external partners may receive updates through email, text messages, phone calls, the agency website, social media, or the emergency messaging platform. Finally, if critical systems are unavailable, staff will complete work on paper when possible and enter the information after access is restored. Essential records, telephone and fax lines, and technology platforms must also remain accessible. The main takeaway is that staff should be prepared to work from an alternate location, remain connected, follow leadership instructions, and use approved backup methods so services to consumers can continue.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"jmMQjgy79wdKtyTtM","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">This continuity plan explains how the ADRC will keep essential services operating for at least 30 days during an emergency, office closure, or technology outage. First, office-based staff may transition to remote work using their laptops, headsets, home internet, and VPN. Home-based assessors will continue performing their duties unless community visits are suspended. Second, communication will follow the established chain of command. Staff and external partners may receive updates through email, text messages, phone calls, the agency website, social media, or the emergency messaging platform. Finally, if critical systems are unavailable, staff will complete work on paper when possible and enter the information after access is restored. Essential records, telephone and fax lines, and technology platforms must also remain accessible. The main takeaw timely instructions. Building safety is another key priority. The Manager of Support and Emergency Operations works closely with CAM Incorporated, local law enforcement, and the Green Fire Department to respond to building emergencies such as fires, severe weather, structural issues, utility failures, or security threats. Building security systems, including cameras and alarms, are maintained to support employee safety. To ensure continuity of operations, critical emergency documentation is maintained within the ICS Teams site, and emergency notification tools such as AlertMedia are available to quickly communicate with staff. If the building cannot be occupied, employees may be relocated to approved alternate sites or assigned to work remotely. The plan also provides guidance for specific emergencies, including tornadoes, power outages, medical emergencies, fires, earthquakes, bomb threats, active shooter incidents, and evacuations. Staff are expected to follow established emergency procedures and leadership instructions based on the situation. The key takeaway is that effective communication, coordinated emergency response, building safety measures, and flexible work location options allow the organization to continue serving the community while protecting employees during an emergency.","voiceCode":"en-CA-LiamNeural","language":"en","originalResourceId":"iWeJi5oRJhQW7Hkdp","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-CA-LiamNeural\">This Building Operations Continuity Plan explains how Direction Home Akron Canton will protect employees, maintain building safety, and continue operations during emergencies that affect our facilities. The plan begins with communication. During an emergency, the Incident Com ,"childResources":[]},"grLxPKNL4hpoJ53wt":{"_id":"grLxPKNL4hpoJ53wt","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionTF","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>When a chemical, biological, explosion, or radiological event occurs inside the building, staff evacuate when instructed by emergency text alert, turn off all electrical equipment except lights, and close all doors and windows.\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["iTdqZjcnMCwjHdvBh"]},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-13T19:18:49.829Z","dateCreated":"2026-10-13T19:18:17.763Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> For an event inside the building, staff evacuate immediately when instructed. Staff turn off electrical equipment except lights and close doors and windows. Supervisors report anyone who is missing.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. For an event inside the building, staff follow the text alert and evacuate. Before leaving, staff turn off electrical equipment except lights and close doors and windows. Remaining inside is the response to an event outside the building.\u003c/div>\n"}},"responses":[{"identifier":"iTdqZjcnMCwjHdvBh","description":{"type":"text","html":"True","resourceWidthPercentage":100}},{"identifier":"55sWb2dLrjfv5Y33F","description":{"type":"text","html":"False","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"rRSyKHPBEYuRQz5fn":{"_id":"rRSyKHPBEYuRQz5fn","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which methods does the Agency use to deliver emergency notifications to internal staff? \u003cstrong>Select all that apply.\u003c/strong>\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["CzPu9friTPPWRYWRZ","u44kS95EXYZ7KhyKe","89Eq642h655i8kC5z"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-13T19:22:57.493Z","dateCreated":"2026-10-13T19:22:03.409Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Internal stakeholders receive emergency notifications by text, email, and voicemail. These methods allow executive staff to reach the majority of staff quickly. The automated emergency text system also posts emergency messages on social media.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Postal mail and printed notices are too slow for an emergency. Internal staff receive emergency notifications by text, email, and voicemail.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Text\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"CzPu9friTPPWRYWRZ"},{"description":{"html":"\u003cdiv>Email\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"u44kS95EXYZ7KhyKe"},{"description":{"html":"\u003cdiv>Voicemail\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"89Eq642h655i8kC5z"},{"description":{"html":"\u003cdiv>Postal mail\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"2naBQ9RukkG59L3jF"},{"identifier":"tdBkxcQDC2wn4p5Je","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Printed notices mailed to the home of each employee\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"shCJihrgj5sY9t6cT":{"_id":"shCJihrgj5sY9t6cT","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"typ ation":64.3375,"captions":[{"text":"Emergency communication depends on a reliable system for reaching staff quickly.","startTime":0.009,"finishTime":4.19},{"text":"The emergency text system is an automated notification system.","startTime":4.96,"finishTime":8.239},{"text":"The system calls,","startTime":9.029,"finishTime":10.029},{"text":"texts,","startTime":10.189,"finishTime":10.699},{"text":"or emails staff and posts emergency messages on social media.","startTime":10.71,"finishTime":14.289},{"text":"Staff receive emergency notifications by text,","startTime":15.159,"finishTime":17.87},{"text":"email,","startTime":18.149,"finishTime":18.549},{"text":"and voicemail.","startTime":18.59,"finishTime":19.43},{"text":"Alerts are specific to the hazard.","startTime":20.26,"finishTime":21.989},{"text":"Tornado,","startTime":22.75,"finishTime":23.389},{"text":"fire,","startTime":23.62,"finishTime":23.989},{"text":"power outage,","startTime":24.149,"finishTime":24.899},{"text":"and active shooter alerts each instruct staff on the next steps to take.","startTime":25.069,"finishTime":28.209},{"text":"When systems are affected,","startTime":29.2,"finishTime":30.469},{"text":"information technology staff,","startTime":31.04,"finishTime":32.34},{"text":"abbreviated as IT staff,","startTime":32.439,"finishTime":34.18},{"text":"send detailed follow-up instructions by email.","startTime":34.36,"finishTime":36.7},{"text":"Information then moves through leaders to supervisors and staff,","startTime":37.59,"finishTime":40.7},{"text":"and executive leaders contact their managers and teams.","startTime":40.909,"finishTime":43.75},{"text":"The COOP,","startTime":45.049,"finishTime":46.209},{"text":"the divisionspecific COOPs,","startTime":46.409,"finishTime":48.61},{"text":"and the emergency operations procedures,","startTime":48.77,"finishTime":50.909},{"text":"abbreviated as EOPs,","startTime":51.049,"finishTime":52.849},{"text":"are located on the employee portal.","startTime":52.93,"finishTime":54.709},{"text":"The specific emergency action plans are located on","startTime":55.459,"finishTime":58.139},{"text":"the emergency preparedness page of the portal,","startTime":58.139,"finishTime":60.319},{"text":"and a copy of the COOP is available at the front desk.","startTime":60.459,"finishTime":63.599}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["4eYmo95HnaoYpHBCS","oLFGmhHAmySn9rYdC"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Emergency communication depends on a reliable system for reaching staff quickly. The emergency text system is an automated notification system. The system calls, texts, or emails staff and posts emergency messages on social media. Staff receive emergency notifications by text, email, and voicemail. Alerts are specific to the hazard. Tornado, fire, power outage, and active shooter alerts each instruct staff on the next steps to take. When systems are affected, Information Technology staff, abbreviated as IT staff, send detailed follow-up instructions by email. Information then moves through leaders to supervisors and staff, and executive leaders contact their managers and teams. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The C O O P, the Division Specific C O O Pees, and the Emergency Operations Procedures, abbreviated as E O Pees, are located on the Employee Portal. The specific emergency action plans are located on the Emergency Preparedness page of the portal, and a copy of the C O O P is available at the Front Desk. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Emergency communication depends on a reliable system for reaching staff quickly. The emergency text system is an automated notification system. The system calls, texts, or emails staff and posts emergency messages on social media. Staff receive emergency notifications by text, email, and voicemail. Alerts are specific to the hazard. Tornado, fire, power outage, and active shooter alerts each instruct staff on the next steps to take. When systems are affected, Information Technology staff, abbreviated as IT staff, send detailed follow-up instructions by email. Information then moves through leaders to supervisors and staff, and executive leaders contact their managers and teams. \nThe C O O P, the Division Specific C O O Pees, and the Emergency Operations Procedures, abbreviated as E O Pees, are located on the Employee Portal. The specific emergency action plans are located on the Emergency Preparedness page of the portal, and a copy of the C O O P is available at the Front Desk. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"R9QbvQZSofpCWSt6y"}},"3QFrQLj8e3KrsZ55n":{"_id":"3QFrQLj8e3KrsZ55n","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"DFjWXEQx25RErDZpe"},"dates":{"dateCreated":"2026-10-13T14:41:12.065Z","dateModified":"2026-10-13T18:59:09.842Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"hGeasfhiTMEggNPjq","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"FbrXLWmktjgRNuhmX","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":49.1125,"captions":[{"text":"Personal preparedness applies to every employee,","startTime":0.009,"finishTime":2.43},{"text":"whether the employee works in the office,","startTime":2.609,"finishTime":4.369},{"text":"in the field,","startTime":4.48,"finishTime":5.03},{"text":"or at home.","startTime":5.289,"finishTime":6.01},{"text":"Employees prepare personal go bag items for the home and for the vehicle.","startTime":6.829,"finishTime":10.38},{"text":"Ready.gov provides supply checklists for this purpose.","startTime":11.25,"finishTime":13.979},{"text":"Employees maintain up to-date contact information with human resources so","startTime":14.75,"finishTime":18.829},{"text":"that the agency can reach each person during an emergency.","startTime":18.829,"finishTime":21.569},{"text":"Employees also know the primary and alternate evacuation routes for the work area.","startTime":22.34,"finishTime":26.639},{"text":"The locations of the emergency exits,","startTime":27.399,"finishTime":29.44},{"text":"the shelter locations,","startTime":29.559,"finishTime":30.709},{"text":"the first aid kits,","startTime":30.879,"finishTime":31.87},{"text":"and the automated external defibrillators,","startTime":32.08,"finishTime":34.11},{"text":"abbreviated as AEDs are part of that knowledge.","startTime":34.119,"finishTime":36.9},{"text":"Employees know how family members will be located in an emergency.","startTime":37.88,"finishTime":41.31},{"text":"Finally,","startTime":42.18,"finishTime":42.77},{"text":"employees know the mission essential functions of the division,","startTime":43.139,"finishTime":45.54},{"text":"which are the functions that must continue during an emergency.","startTime":45.7,"finishTime":48.36}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["DFjWXEQx25RErDZpe","FbrXLWmktjgRNuhmX"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Personal preparedness applies to every employee, whether the employee works in the office, in the field, or at home. Employees prepare personal go-bag items for the home and for the vehicle. Ready.gov provides supply checklists for this purpose. Employees maintain up-to-date contact information with Human Resources, so that the Agency can reach each person during an emergency. Employees also know the primary and alternate evacuation routes for the work area. The locations of the emergency exits, the shelter locations, the first aid kits, and the Automated External Defibrillators, abbreviated as A E Dees, are part of that knowledge. Employees know how family members will be located in an emergency. Finally, employees know the mission essential functions of the Division, which are the functions that must continue during an emergency.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Personal preparedness applies to every employee, whether the employee works in the office, in the field, or at home. Employees prepare personal go-bag items for the home and for the vehicle. Ready.gov provides supply checklists for this purpose. Employees maintain up-to-date contact information with Human Resources, so that the Agency can reach each person during an emergency. Employees also know the primary and alternate evacuation routes for the work area. The locations of the emergency exits, the shelter locations, the first aid kits, and the Automated External Defibrillators, abbreviated as A E Dees, are part of that knowledge. Employees know how family members will be located in an emergency. Finally, employees know the mission essential functions of the Division, which are the functions that must continue during an emergency.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"aAG9tGh7FnDew9k7L"}},"5YfQja6X4BDnntRNY":{"_id":"5YfQja6X4BDnntRNY","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"AQwFACjPeQh5BDmEt"},"dates":{"dateCreated":"2026-10-13T13:56:44.027Z","dateModified":"2026-10-13T18:58:47.365Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"9Ji7b6vKZENNsLF6M","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"HKytannY8BGQzTNaL","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":43.9625,"captions":[{"text":"The COOP or continuity of operations plan","startTime":0.009,"finishTime":3.349},{"text":"keeps essential services running when a disaster threatens the agency.","startTime":3.49,"finishTime":6.75},{"text":"The plan serves several purposes.","startTime":7.53,"finishTime":9.329},{"text":"First,","startTime":10.319,"finishTime":10.71},{"text":"the plan protects assets,","startTime":10.84,"finishTime":12.159},{"text":"records,","startTime":12.279,"finishTime":12.75},{"text":"information,","startTime":13.319,"finishTime":13.55},{"text":"and the safety and well-being of employees.","startTime":13.68,"finishTime":15.76},{"text":"Second,","startTime":16.709,"finishTime":17.069},{"text":"the plan continues essential functions,","startTime":17.229,"finishTime":19.11},{"text":"especially when the primary facility is threatened or inaccessible.","startTime":19.739,"finishTime":22.409},{"text":"Third,","startTime":23.27,"finishTime":23.68},{"text":"the plan sets a target to re-establish critical operations within 24 to 48 hours of","startTime":23.829,"finishTime":28.399},{"text":"a declared disaster and to sustain those operations for a minimum of 30 days.","startTime":28.399,"finishTime":32.24},{"text":"Finally,","startTime":33.139,"finishTime":33.659},{"text":"the plan maintains the confidence of consumers,","startTime":33.819,"finishTime":36.06},{"text":"employees,","startTime":36.38,"finishTime":36.86},{"text":"funding providers,","startTime":37.06,"finishTime":38.09},{"text":"and vendors.","startTime":38.099,"finishTime":38.759},{"text":"Each of these purposes guides the actions presented in the remainder of the course.","startTime":39.58,"finishTime":43.209}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["AQwFACjPeQh5BDmEt","HKytannY8BGQzTNaL"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The C O O P, or continuity of operations plan, keeps essential services running when a disaster threatens the Agency. The plan serves several purposes. First, the plan protects assets, records, information, and the safety and well-being of employees. Second, the plan continues essential functions, especially when the primary facility is threatened or inaccessible. Third, the plan sets a target to re-establish critical operations within twenty-four to forty-eight hours of a declared disaster and to sustain those operations for a minimum of thirty days. Finally, the plan maintains the confidence of consumers, employees, funding providers, and vendors. Each of these purposes guides the actions presented in the remainder of the course. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The C O O P, or continuity of operations plan, keeps essential services running when a disaster threatens the Agency. The plan serves several purposes. First, the plan protects assets, records, information, and the safety and well-being of employees. Second, the plan continues essential functions, especially when the primary facility is threatened or inaccessible. Third, the plan sets a target to re-establish critical operations within twenty-four to forty-eight hours of a declared disaster and to sustain those operations for a minimum of thirty days. Finally, the plan maintains the confidence of consumers, employees, funding providers, and vendors. Each of these purposes guides the actions presented in the remainder of the course artTime":101.43,"finishTime":102.139},{"text":"and documentation templates","startTime":102.339,"finishTime":103.809},{"text":"are stored on the L drive,","startTime":103.93,"finishTime":105.47},{"text":"the portal,","startTime":105.589,"finishTime":106.19},{"text":"and in Teams.","startTime":106.269,"finishTime":107.11},{"text":"Many platforms can be reached without VPN","startTime":107.98,"finishTime":110.629},{"text":"including email,","startTime":110.849,"finishTime":111.589},{"text":"Teams,","startTime":111.889,"finishTime":112.319},{"text":"guiding care,","startTime":112.449,"finishTime":113.25},{"text":"Sage,","startTime":113.449,"finishTime":113.93},{"text":"and RingCentral.","startTime":114.05,"finishTime":114.97},{"text":"Others,","startTime":115.75,"finishTime":116.22},{"text":"such as the L,","startTime":116.389,"finishTime":117.139},{"text":"drive,","startTime":117.389,"finishTime":117.83},{"text":"and Ohio benefits require VPN.","startTime":117.989,"finishTime":120.389},{"text":"The key takeaway is that clear roles,","startTime":121.169,"finishTime":123.169},{"text":"prioritized member contact,","startTime":123.43,"finishTime":124.91},{"text":"reliable communication,","startTime":125.16,"finishTime":126.44},{"text":"and access to the right files and systems let","startTime":126.65,"finishTime":128.82},{"text":"us keep serving members when it matters most.","startTime":128.82,"finishTime":130.929}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["Q3Erhsdw36fpAbqMX","xifWFAGruYKrbFczc"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This HCBS Continuity Plan explains how our division will keep reaching and supporting members during an emergency. Our priority is member outreach. During a disaster, we need access to the Master List, provider contact information, phones, Outlook, Teams, and the documentation systems we use every day, such as CareDirector, SAGE, and Guiding Care. If those systems are unavailable, staff use standard templates and required reports, including progress notes, incident reports, service plans, and assessment templates, so that documentation continues. Each level of the division has a defined role and a backup. The Senior VP of H C B S works with the Emergency Response Team to determine the level of emergency and direct staff. The VP of H C B S communicates with our contracted health plans and instructs care managers to contact members who may be at risk. Supervisors and Team Leaders pull member lists and coordinate staff, and staff contact members, starting with those at the highest priority on the Disaster Profile List. If a member's care manager is unavailable, a Supervisor or Team Leader arranges for another staff member to make the call. Communication follows the chain of command. The Incident Commander informs the Senior VP and VP of H C B S, who pass updates to Supervisors and Team Leaders, and then to staff. If email is unavailable, we use text messages and phone calls. Direction Home Communications also coordinates messaging with external stakeholders. The plan lists contacts for AGE, our MyCare health plans, state and county agencies, and other partners. Critical files, including the Master Member List, program reports, and documentation templates, are stored on the L: drive, the Portal, and in Teams. Many platforms can be reached without V P N, including email, Teams, Guiding Care, SAGE, and RingCentral. Others, such as the L: drive, and Ohio Benefits, require VPN. The key takeaway is that clear roles, prioritized member contact, reliable communication, and access to the right files and systems let us keep serving members when it matters most.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"This HCBS Continuity Plan explains how our division will keep reaching and supporting members during an emergency. Our priority is member outreach. During a disaster, we need access to the Master List, provider contact information, phones, Outlook, Teams, and the documentation systems we use every day, such as CareDirector, SAGE, and Guiding Care. If those systems are unavailable, staff use standard templates and required reports, including progress notes, incident reports, service plans, and assessment templates, so that documentation continues. Each level of the division has a defined role and a backup. The Senior VP of H C B S works with the Emergency Response Team to determine the level of emergency and direct staff. The VP of H C B S communicates with our contracted health plans and instructs care managers to contact members who may be at risk. Supervisors and Team Leaders pull member lists and coordinate staff, and staff contact members, starting with those at the highest priority on the Disaster Profile List. If a member's care manager is unavailable, a Supervisor or Team Leader arranges for another staff member to make the call. Communication follows the chain of command. The Incident Commander informs the Senior VP and VP of H C B S, who pass updates to Supervisors and Team Leaders, and then to staff. If email is unavailable, we use text messages and phone calls. Direction Home Communications also coordinates messaging with external stakeholders. The plan lists contacts for AGE, our MyCare health plans, state and county agencies, and other partners. Critical files, including the Master Member List, program reports, and documentation templates, are stored on the L: drive, the Portal, and in Teams. Many platforms can be reached without V P N, including email, Teams, Guiding Care, SAGE, and RingCentral. Others, such as the L: drive, and Ohio Benefits, require VPN. The key takeaway is that clear roles, prioritized member contact, reliable communication, and access to the right files and systems let us keep serving members when it matters most.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"kH8zWqWQFNoJKnSsH"}},"8nj3BoB4F4q9w76Hm":{"_id":"8nj3BoB4F4q9w76Hm","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"cwX7Tc4xxGRPcT9Tj"},"dates":{"dateCreated":"2026-10-13T14:50:07.958Z","dateModified":"2026-10-13T19:00:04.304Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"L8kHCcP7nRbHCGeZH","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"Cq6WX4N7n3eMxMhff","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0,"imageCropping":{"positionX":0,"positionY":0,"width":100,"height":100}}],"duration":61.2,"captions":[{"text":"When a pandemic disease affects the area,","startTime":0.009,"finishTime":1.95},{"text":"an emergency text alert instructs staff on next steps,","startTime":2.25,"finishTime":5.11},{"text":"and the pandemic and post-pandemic operations plan applies.","startTime":5.25,"finishTime":8.21},{"text":"The agency uses 4 phases to describe the level of risk.","startTime":9.06,"finishTime":12.119},{"text":"Phase one is low risk.","startTime":13.1,"finishTime":14.329},{"text":"No new virus subtype has been detected in humans.","startTime":15.359,"finishTime":17.969},{"text":"Phase 2 is low to medium risk.","startTime":18.809,"finishTime":20.809},{"text":"No new virus subtype has been identified with evidence of human to human spread.","startTime":21.67,"finishTime":25.67},{"text":"Phase 3 is high risk.","startTime":26.489,"finishTime":28.09},{"text":"Human infections with a new subtype have been identified,","startTime":28.92,"finishTime":31.62},{"text":"and evidence of human to human spread exists.","startTime":32,"finishTime":34.24},{"text":"Phase 4 applies when a confirmed case is on site.","startTime":35.11,"finishTime":37.83},{"text":"In that phase,","startTime":38.599,"finishTime":39.47},{"text":"only essential personnel report to the agency.","startTime":39.65,"finishTime":42},{"text":"Staff follow the instructions in each emergency alert","startTime":42.86,"finishTime":45.529},{"text":"and complete annual training on pandemic illnesses.","startTime":45.529,"finishTime":48.029},{"text":"Staff minimize social contact on and off agency work sites when directed,","startTime":48.93,"finishTime":52.919},{"text":"and they follow the division plan for a pandemic illness.","startTime":53.13,"finishTime":55.549},{"text":"When requested,","startTime":56.56,"finishTime":57.349},{"text":"staff report positive test results for a pandemic illness.","startTime":57.599,"finishTime":60.299}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["cwX7Tc4xxGRPcT9Tj","Cq6WX4N7n3eMxMhff"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"When a pandemic disease affects the area, an emergency text alert instructs staff on next steps, and the Pandemic and Post-Pandemic Operations Plan applies. The Agency uses four phases to describe the level of risk. Phase I is low risk. No new virus sub-type has been detected in humans. Phase II is low to medium risk. No new virus sub-type has been identified with evidence of human-to-human spread. Phase III is high risk. Human infections with a new sub-type have been identified, and evidence of human-to-human spread exists. Phase IV applies when a confirmed case is on-site. In that phase, only essential personnel report to the Agency. Staff follow the instructions in each emergency alert and complete annual training on pandemic illnesses. Staff minimize social contact on and off Agency work sites when directed, and they follow the Division plan for a pandemic illness. When requested, staff report positive test results for a pandemic illness. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"When a pandemic disease affects the area, an emergency text alert instructs staff on next steps, and the Pandemic and Post-Pandemic Operations Plan applies. The Agency uses four phases to describe the level of risk. Phase I is low risk. No new virus sub-type has been detected in humans. Phase II is low to medium risk. No new virus sub-type has been identified with evidence of human-to-human spread. Phase III is high risk. Human infections with a new sub-type have been identified, and evidence of human-to-human spread exists. Phase IV applies when a confirmed case is on-site. In that phase, only essential personnel report to the Agency. Staff follow the instructions in each emergency alert and complete annual training on pandemic illnesses. Staff minimize social contact on and off Agency work sites when directed, and they follow the Division plan for a pandemic illness. When requested, staff report positive test results for a pandemic illness. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"fcsSvJmoKEEvZdFZs"}},"9pAhTYNLLeSuEDKcS":{"_id":"9pAhTYNLLeSuEDKcS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Quiz Instructions"},"dates":{"dateCreated":"2026-10-13T15:12:40.685Z","dateModified":"2026-10-13T18:45:01.246Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"sHbQszvjNSeX4r6Y4","kind":"overlay","type":"rectangle","width":435.99999999999994,"height":60.99999999999999,"x":31,"y":18,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"font":{"size":35,"bold":true,"underline":false,"italic":false},"fontColor":"rgba(32,141,174,1)","textAlignment":"left","type":"rectangle","border":{"size":0,"color":"#000000","left":true,"right":true,"top":true,"bottom":true},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Body Text","fill":{"type":"color","color":"rgba(255,255,255,0)"},"roundedCorners":{"bottomLeft":0,"bottomRight":0,"topLeft":0,"topRight":0},"textHeading":"heading1"},"htmlContent":"\u003cdiv>Quiz Instructions\u003c/div>\n","start":0,"behaviorType":"continue","rotationAngle":0},{"htmlContent":"\u003cdiv>On the next slide you will encounter a quiz. To begin the quiz you will need to click the\u003c/div>\n","identifier":"q6TMm9y79YFeZCPNx","kind":"overlay","type":"rectangle","width":1178,"height":60.99999999999999,"x":31,"y":104,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"fo
