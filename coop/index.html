37.99,"finishTime":38.869},{"text":"Finance and administration tracks costs and procurement.","startTime":39.75,"finishTime":42.599},{"text":"If the chain of command is interrupted,","startTime":43.34,"finishTime":45.25},{"text":"the agency follows the order of succession","startTime":45.459,"finishTime":47.619},{"text":"so that leadership continues without delay.","startTime":47.619,"finishTime":49.619}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["uPZqTrHDbPFxCjfnj","CPJqoXNYYEuKhLFk5"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The Agency uses the Incident Command System to manage emergencies of every size. The CEO serves as the Incident Commander, and a back-up Incident Commander serves where necessary. The Incident Commander holds overall responsibility for the incident. The Public Information Officer, the Safety Officer, and the Liaison Officer support the Incident Commander. Five functional areas organize the work of the response. Incident Command sets objectives and priorities. Operations carries out the response. Planning tracks resources and maintains documentation. Logistics provides people, equipment, supplies, and facilities. Finance and Administration tracks costs and procurement. If the chain of command is interrupted, the Agency follows the order of succession, so that leadership continues without delay.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The Agency uses the Incident Command System to manage emergencies of every size. The CEO serves as the Incident Commander, and a back-up Incident Commander serves where necessary. The Incident Commander holds overall responsibility for the incident. The Public Information Officer, the Safety Officer, and the Liaison Officer support the Incident Commander. Five functional areas organize the work of the response. Incident Command sets objectives and priorities. Operations carries out the response. Planning tracks resources and maintains documentation. Logistics provides people, equipment, supplies, and facilities. Finance and Administration tracks costs and procurement. If the chain of command is interrupted, the Agency follows the order of succession, so that leadership continues without delay.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"gpBHJff8pJwcAxcq9"}},"CqFH7chLAdfAtyfpa":{"_id":"CqFH7chLAdfAtyfpa","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"EWoRc9LQC6t5Cj94o"},"dates":{"dateCreated":"2026-10-13T14:47:58.392Z","dateModified":"2026-10-13T18:59:54.213Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"NSieyfY8owChQ8FtB","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"yhYoXEmeuqPuYWuAq","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":56.225,"captions":[{"text":"In a medical emergency,","startTime":0.009,"finishTime":1.33},{"text":"the first action is to dial 911 and request an ambulance.","startTime":1.49,"finishTime":4.849},{"text":"The caller provides 4 pieces of information the number and location of the victims,","startTime":5.65,"finishTime":9.689},{"text":"the nature of the injury or illness,","startTime":9.85,"finishTime":11.449},{"text":"any hazards involved,","startTime":11.64,"finishTime":12.81},{"text":"and the nearest entrance for emergency access.","startTime":13.039,"finishTime":15.21},{"text":"Trained employees are then alerted to respond with a","startTime":16.139,"finishTime":18.34},{"text":"first aid kit and an automated external defibrillator.","startTime":18.34,"finishTime":20.879},{"text":"Only trained responders provide first aid.","startTime":21.7,"finishTime":23.979},{"text":"The victim is not moved unless the location is unsafe.","startTime":24.739,"finishTime":27.62},{"text":"Staff control access to the scene and","startTime":28.489,"finishTime":30.379},{"text":"take universal precautions against bloodborne pathogens.","startTime":30.379,"finishTime":33.139},{"text":"Someone meets the ambulance at the nearest entrance","startTime":34.029,"finishTime":36.11},{"text":"and directs emergency personnel to the victim.","startTime":36.11,"finishTime":38.13},{"text":"Two automated external defibrillators are located in the office,","startTime":39.15,"finishTime":42.06},{"text":"1 in the 1st floor main lunchroom and one","startTime":42.36,"finishTime":44.36},{"text":"on the 2nd floor while outside the restrooms.","startTime":44.36,"finishTime":46.639},{"text":"First aid kits are located behind the 1st floor front desk,","startTime":47.549,"finishTime":50.72},{"text":"outside the human resources offices,","startTime":51.069,"finishTime":52.83},{"text":"and on the counter outside the 2nd floor restrooms.","startTime":52.99,"finishTime":55.47}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["EWoRc9LQC6t5Cj94o","yhYoXEmeuqPuYWuAq"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"In a medical emergency, the first action is to dial 9-1-1 and request an ambulance. The caller provides four pieces of information: the number and location of the victims, the nature of the injury or illness, any hazards involved, and the nearest entrance for emergency access. Trained employees are then alerted to respond with a first aid kit and an Automated External Defibrillator. Only trained responders provide first aid. The victim is not moved unless the location is unsafe. Staff control access to the scene and take universal precautions against bloodborne pathogens. Someone meets the ambulance at the nearest entrance and directs emergency personnel to the victim. Two Automated External Defibrillators are located in the office, one in the first floor main lunchroom and one on the second floor wall outside the restrooms. First aid kits are located behind the first floor front desk, outside the Human Resources offices, and on the counter outside the second floor restrooms. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"In a medical emergency, the first action is to dial 9-1-1 and request an ambulance. The caller provides four pieces of information: the number and location of the victims, the nature of the injury or illness, any hazards involved, and the nearest entrance for emergency access. Trained employees are then alerted to respond with a first aid kit and an Automated External Defibrillator. Only trained responders provide first aid. The victim is not moved unless the location is unsafe. Staff control access to the scene and take universal precautions against bloodborne pathogens. Someone meets the ambulance at the nearest entrance and directs emergency personnel to the victim. Two Automated External Defibrillators are located in the office, one in the first floor main lunchroom and one on the second floor wall outside the restrooms. First aid kits are located behind the first floor front desk, outside the Human Resources offices, and on the counter outside the second floor restrooms. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"KNdtiWay7Yb6C9fXe"}},"CsMdn8hDDy7cheKPy":{"_id":"CsMdn8hDDy7cheKPy","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"i2pFAgh94KwCagTrX"},"dates":{"dateCreated":"2026-10-13T14:42:00.594Z","dateModified":"2026-10-13T18:59:17.011Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"uiCoKWiw5A2wSqet8","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"XsRpeyx3WDWo9PN9i","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":50.3375,"captions":[{"text":"For priorities guide the immediate actions of staff during an emergency.","startTime":0.129,"finishTime":3.69},{"text":"The first priority is to protect life safety.","startTime":4.469,"finishTime":6.75},{"text":"Staff call 911 for any life threatening situation.","startTime":7.63,"finishTime":10.739},{"text":"The second priority is to follow the alert and the hazard specific procedure.","startTime":11.539,"finishTime":15.079},{"text":"The 3rd priority is to notify the supervisor of the evacuation or of","startTime":15.979,"finishTime":19.7},{"text":"the plan to stay at home when the employee works from home.","startTime":19.7,"finishTime":22.42},{"text":"The 4th priority is to assist others when it is safe to do so.","startTime":23.2,"finishTime":26.299},{"text":"Several general expectations also apply.","startTime":27.159,"finishTime":29.629},{"text":"Staff do not use elevators during a fire evacuation.","startTime":30.489,"finishTime":33.38},{"text":"Staff moved to the designated shelter location or assembly area for the hazard.","startTime":34.24,"finishTime":38.34},{"text":"Staff do not attempt to enter the office until the all","startTime":39.2,"finishTime":41.689},{"text":"clear is given by the supervisor or through agency-wide communication.","startTime":41.689,"finishTime":45.009},{"text":"Home-based employees notify the supervisor of the plan to stay at home.","startTime":45.939,"finishTime":49.599}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["i2pFAgh94KwCagTrX","XsRpeyx3WDWo9PN9i"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Four priorities guide the immediate actions of staff during an  0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":16},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"}},"questionId":"BnMGJYFemovRyR6i4","start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":"2MjBvkeDK98yorXbd","kind":"overlay","type":"rectangle","width":546,"height":295.8666666666667,"x":35,"y":54,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"r6SXRdTELN7wjgkJS","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":"bv2MGQasEXaTwkjd2","kind":"overlay","type":"rectangle","width":537.9999999999999,"height":139.9088471849866,"x":35,"y":425,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"4zPZkmZsXsB5du2WH","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0,"clickAction":{"type":"openWebsite","openWebsite":"https://areaagencyonaging10b.sharepoint.com/sites/PortalRebuild/SitePages/Emergency-Preparedness.aspx?web=1"}}],"duration":45.225,"captions":[{"text":"Consider a second scenario.","startTime":0.05,"finishTime":1.5899999999999999},{"text":"At 9:00 a.m. the Uniontown office loses power.","startTime":2.39,"finishTime":5.5},{"text":"An emergency text alert states that the outage","startTime":6.28,"finishTime":8.56},{"text":"is expected to last more than one hour.","startTime":8.56,"finishTime":10.56},{"text":"A staff member is scheduled to work in the office.","startTime":11.359,"finishTime":13.71},{"text":"Which actions should the staff member take?","startTime":14.55,"finishTime":16.489},{"text":"Option A is to wait in the dark office for the power to return.","startTime":17.299,"finishTime":20.379},{"text":"Option B is to follow the alert,","startTime":21.2,"finishTime":22.84},{"text":"take the necessary equipment,","startTime":23,"finishTime":24.44},{"text":"work remotely,","startTime":24.559,"finishTime":25.389},{"text":"and notify the supervisor.","startTime":25.479,"finishTime":26.979},{"text":"Option C is to take the day off without notifying the supervisor.","startTime":27.78,"finishTime":31.159},{"text":"Option D is to travel to another office without instruction.","startTime":31.969,"finishTime":34.81},{"text":"Select the best response.","startTime":35.689,"finishTime":37.049},{"text":"The emergency response plan and the divisions specific continuity of","startTime":37.9,"finishTime":41.49},{"text":"operations plan on the employee portal contain complete procedures.","startTime":41.49,"finishTime":44.43}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["tT99XRYjjHg2hsW4A","r6SXRdTELN7wjgkJS","4zPZkmZsXsB5du2WH"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Consider a second scenario. At 9:00 a.m., the Uniontown office loses power. An emergency text alert states that the outage is expected to last more than one hour. A staff member is scheduled to work in the office. Which actions should the staff member take? Option A is to wait in the dark office for the power to return. Option B is to follow the alert, take the necessary equipment, work remotely, and notify the supervisor. Option C is to take the day off without notifying the supervisor. Option D is to travel to another office without instruction. Select the best response. The Emergency Response Plan and the Division Specific Continuity of Operations Plan on the Employee Portal contain complete procedures. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Consider a second scenario. At 9:00 a.m., the Uniontown office loses power. An emergency text alert states that the outage is expected to last more than one hour. A staff member is scheduled to work in the office. Which actions should the staff member take? Option A is to wait in the dark office for the power to return. Option B is to follow the alert, take the necessary equipment, work remotely, and notify the supervisor. Option C is to take the day off without notifying the supervisor. Option D is to travel to another office without instruction. Select the best response. The Emergency Response Plan and the Division Specific Continuity of Operations Plan on the Employee Portal contain complete procedures. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"zmeSCzuTG5HXxoZKy"}},"Ei2uMKGTEd7iADokv":{"_id":"Ei2uMKGTEd7iADokv","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"uCfh6gkNjfAfHiQAE"},"dates":{"dateCreated":"2026-10-13T14:43:02.014Z","dateModified":"2026-10-13T18:59:26.398Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"cerJEWWh2YZKqrrLi","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"4PkBHdSkpLuoAzkZL","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":62.2375,"captions":[{"text":"The purpose of continuity planning is to keep","startTime":0.009,"finishTime":2.089},{"text":"services available to consumers during an emergency.","startTime":2.089,"finishTime":4.67},{"text":"Each division defines the mission essential functions,","startTime":5.48,"finishTime":7.909},{"text":"which are the functions that must continue.","startTime":8.119,"finishTime":9.88},{"text":"If the Uniontown location has no power,","startTime":10.72,"finishTime":12.89},{"text":"the division supervisor instructs staff to provide only","startTime":13.09,"finishTime":15.619},{"text":"the essential functions that support staff and consumers.","startTime":15.619,"finishTime":18.27},{"text":"Several practical expectations apply.","startTime":19.139,"finishTime":21.27},{"text":"Staff work from home when directed and take the necessary equipment,","startTime":22.11,"finishTime":25.26},{"text":"such as a laptop,","startTime":25.459,"finishTime":26.319},{"text":"a power cord,","startTime":26.559,"finishTime":27.52},{"text":"a headset,","startTime":27.62,"finishTime":28.299},{"text":"and a Mi device,","startTime":28.5,"finishTime":29.559},{"text":"which is a portable internet hotspot if applicable.","startTime":29.86,"finishTime":32.5},{"text":"When systems are unavailable,","startTime":33.34,"finishTime":34.729},{"text":"staff document work on paper and enter the information once system access returns.","startTime":34.979,"finishTime":39.18},{"text":"This practice is used in the Aging and Disability Resource Center.","startTime":40.049,"finishTime":43.189},{"text":"Division supervisors designate staff to contact consumers","startTime":43.979,"finishTime":47.15},{"text":"and advise them of the emergency.","startTime":47.15,"finishTime":48.77},{"text":"Once operations are restored,","startTime":49.639,"finishTime":51.189},{"text":"staff contact members according to acuity level.","startTime":51.439,"finishTime":53.819},{"text":"The continuity of operations plan and the division specific continuity","startTime":54.58,"finishTime":57.9},{"text":"of operations plans on the employee portal contain complete procedures.","startTime":57.9,"finishTime":61.459}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["uCfh6gkNjfAfHiQAE","4PkBHdSkpLuoAzkZL"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The purpose of continuity planning is to keep services available to consumers during an emergency. Each Division defines the mission essential functions, which are the functions that must continue. If the Uniontown location has no power, the Division Supervisor instructs staff to provide only the essential functions that support staff and consumers. Several practical expectations apply. Staff work from home when directed and take the necessary equipment, such as a laptop, a power cord, a headset, and a MiFi device, which is a portable internet hotspot, if applicable. When systems are unavailable, staff document work on paper and enter the information once system access returns. This practice is used in the Aging and Disability Resource Center. Division Supervisors designate staff to contact consumers and advise them of the emergency. Once operations are restored, staff contact members according to acuity level. The Continuity of Operations Plan and the Division Specific Continuity of Operations Plans on the Employee Portal contain complete procedures.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The purpose of continuity planning is to keep services available to consumers during an emergency. Each Division defines the mission essential functions, which are the functions that must continue. If the Uniontown location has no power, the Division Supervisor instructs staff to provide only the essential functions that support staff and consumers. Several practical expectations apply. Staff work from home when directed and take the necessary equipment, such as a laptop, a power cord, a headset, and a MiFi device, which is a portable internet hotspot, if applicable. When systems are unavailable, staff document work on paper and enter the information once system access returns. This practice is used in the e facts directly with facility management,","startTime":22.819,"finishTime":25.62},{"text":"residents,","startTime":25.739,"finishTime":26.44},{"text":"and families,","startTime":26.579,"finishTime":27.299},{"text":"and we collect a list of affected residents or family contacts.","startTime":27.51,"finishTime":30.62},{"text":"Throughout the response,","startTime":31.469,"finishTime":32.59},{"text":"we support each resident's right to","startTime":32.75,"finishTime":34.229},{"text":"make independent decisions about living arrangements,","startTime":34.229,"finishTime":36.549},{"text":"care,","startTime":36.72,"finishTime":37.18},{"text":"and privacy.","startTime":37.279,"finishTime":38.04},{"text":"The VP of elder rights leads the","startTime":38.81,"finishTime":40.729},{"text":"response with regional program supervisors as backups.","startTime":40.729,"finishTime":43.689},{"text":"The VP maintains facility information,","startTime":44.459,"finishTime":46.619},{"text":"identifies which residents are at risk,","startTime":46.779,"finishTime":48.729},{"text":"and determines the response,","startTime":48.939,"finishTime":50.159},{"text":"including the partners and resources needed.","startTime":50.619,"finishTime":52.5},{"text":"The VP also keeps Direction Home Leadership,","startTime":53.259,"finishTime":55.729},{"text":"AGE and other stakeholders informed.","startTime":55.9,"finishTime":58.419},{"text":"Inside an affected facility,","startTime":59.18,"finishTime":60.819},{"text":"our staff gather the resident roster and emergency contacts,","startTime":60.939,"finishTime":64},{"text":"track any transfers or hospital admissions,","startTime":64.18,"finishTime":66.29},{"text":"and keep communication open with facility management.","startTime":66.5,"finishTime":69.019},{"text":"They document their actions and after a move,","startTime":69.889,"finishTime":72.309},{"text":"follow up with transition residents or families to identify any problems.","startTime":72.61,"finishTime":76.37},{"text":"Corps ombudsman services continue throughout the emergency.","startTime":77.18,"finishTime":80.169},{"text":"We keep providing information,","startTime":81,"finishTime":82.44},{"text":"advocacy,","startTime":82.589,"finishTime":83.309},{"text":"and complaint handling by phone,","startTime":83.44,"finishTime":84.989},{"text":"email,","startTime":85.279,"finishTime":85.54},{"text":"text,","startTime":85.849,"finishTime":86.139},{"text":"and our website.","startTime":86.4,"finishTime":87.18},{"text":"Direction home communications coordinates messaging with the public,","startTime":88.12,"finishTime":91.279},{"text":"media,","startTime":91.489,"finishTime":91.989},{"text":"and other stakeholders.","startTime":92.16,"finishTime":93.319},{"text":"Sensitive consumer information is recorded in","startTime":94.22,"finishTime":96.379},{"text":"Minami or Ageis SharePoint spreadsheet.","startTime":96.379,"finishTime":98.48},{"text":"If those state platforms are unavailable,","startTime":99.3,"finishTime":101.339},{"text":"staff use a standard form","startTime":101.55,"finishTime":102.93},{"text":"such as the associate advocacy report form to capture their work.","startTime":103.069,"finishTime":106.349},{"text":"The VP of elder rights activates the plan after consulting the president and CEO.","startTime":106.43,"finishTime":110.559},{"text":"Triggers include facility closures,","startTime":111.36,"finishTime":113.209},{"text":"natural disasters,","startTime":113.37,"finishTime":114.4},{"text":"severe weather,","startTime":114.489,"finishTime":115.33},{"text":"and incidents that disrupt resident care.","startTime":115.489,"finishTime":117.349},{"text":"The same leaders decide when we return to routine operations.","startTime":118.25,"finishTime":121.209},{"text":"The key takeaway is that this plan keeps","startTime":121.33,"finishTime":123.16},{"text":"us focused on protecting residents' rights and safety,","startTime":123.16,"finishTime":125.61},{"text":"gathering reliable information,","startTime":125.809,"finishTime":127.29},{"text":"working with partners,","startTime":127.449,"finishTime":128.399},{"text":"and continuing ombudsman services during an emergency.","startTime":128.61,"finishTime":131.25}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["hdZsowwtFR4XFNynJ","36dS4qk7FBGtFsXMf"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"\\\"his Elder Rights Continuity of Operations Plan explains how our team will respond when an emergency affects residents of long-term care facilities or others in our service area. When we learn of an emergency, we notify the President and CEO, Operations staff, the Office of the State Ombudsman, and our Elder Rights team. We then gather facts about the scope and severity of the situation. Where possible, we verify those facts directly with facility management, residents, and families, and we collect a list of affected residents or family contacts. Throughout the response, we support each resident's right to make independent decisions about living arrangements, care, and privacy. The VP of Elder Rights leads the response, with Regional Program Supervisors as backups. The VP maintains facility information, identifies which residents are at risk, and determines the response, including the partners and resources needed. The VP also keeps Direction Home leadership, AGE, and other stakeholders informed. Inside an affected facility, our staff gather the resident roster and emergency contacts, track any transfers or hospital admissions, and keep communication open with facility management. They document their actions and, after a move, follow up with transitioned residents or families to identify any problems. Core Ombudsman services continue throughout the emergency. We keep providing information, advocacy, and complaint handling by phone, email, text, and our website. Direction Home Communications coordinates messaging with the public, media, and other stakeholders. Sensitive consumer information is recorded in MonAmi or AGE's SharePoint spreadsheet. If those state platforms are unavailable, staff use a standard form, such as the Associate Advocacy Report Form, to capture their work.The VP of Elder Rights activates the plan after consulting the President and CEO. Triggers include facility closures, natural disasters, severe weather, and incidents that disrupt resident care. The same leaders decide when we return to routine operations.The key takeaway is that this plan keeps us focused on protecting residents' rights and safety, gathering reliable information, working with partners, and continuing Ombudsman services during an emergency.\\\"\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"\"his Elder Rights Continuity of Operations Plan explains how our team will respond when an emergency affects residents of long-term care facilities or others in our service area. When we learn of an emergency, we notify the President and CEO, Operations staff, the Office of the State Ombudsman, and our Elder Rights team. We then gather facts about the scope and severity of the situation. Where possible, we verify those facts directly with facility management, residents, and families, and we collect a list of affected residents or family contacts. Throughout the response, we support each resident's right to make independent decisions about living arrangements, care, and privacy. The VP of Elder Rights leads the response, with Regional Program Supervisors as backups. The VP maintains facility information, identifies which residents are at risk, and determines the response, including the partners and resources needed. The VP also keeps Direction Home leadership, AGE, and other stakeholders informed. Inside an affected facility, our staff gather the resident roster and emergency contacts, track any transfers or hospital admissions, and keep communication open with facility management. They document their actions and, after a move, follow up with transitioned residents or families to identify any problems. Core Ombudsman services continue throughout the emergency. We keep providing information, advocacy, and complaint handling by phone, email, text, and our website. Direction Home Communications coordinates messaging with the public, media, and other stakeholders. Sensitive consumer information is recorded in MonAmi or AGE's SharePoint spreadsheet. If those state platforms are unavailable, staff use a standard form, such as the Associate Advocacy Report Form, to capture their work.The VP of Elder Rights activates the plan after consulting the President and CEO. Triggers include facility closures, natural disasters, severe weather, and incidents that disrupt resident care. The same leaders decide when we return to routine operations.The key takeaway is that this plan keeps us focused on protecting residents' rights and safety, gathering reliable information, working with partners, and continuing Ombudsman services during an emergency.\"","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"7gxHKdPQt5ntG2KEa"}},"RP8rKZWXNtooAXaM7":{"_id":"RP8rKZWXNtooAXaM7","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"DGZcPeTzu6rQSqTyT"},"dates":{"dateCreated":"2026-10-13T14:42:22.478Z","dateModified":"2026-10-13T18:59:19.739Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlay t through Alert","startTime":57.5,"finishTime":59.779},{"text":"Media followed by details by email,","startTime":59.779,"finishTime":62.259},{"text":"and the HR help desk serves as the main source for personnel,","startTime":62.38,"finishTime":65.459},{"text":"benefits,","startTime":65.61,"finishTime":66.19},{"text":"and payroll information.","startTime":66.339,"finishTime":67.54},{"text":"HR contacts external vendors as needed based on the level of the emergency.","startTime":68.41,"finishTime":72.629},{"text":"All critical files are stored in the encrypted LCon backslash HR","startTime":73.459,"finishTime":77.059},{"text":"folder and should be copied to a backup location when possible.","startTime":77.059,"finishTime":80.16},{"text":"Paycom and Outlook,","startTime":81.01,"finishTime":82.01},{"text":"including the HR help desk,","startTime":82.33,"finishTime":83.73},{"text":"can be used without VPN.","startTime":83.97,"finishTime":85.489},{"text":"HR also follows the incident command system for emergencies such as tornadoes,","startTime":86.33,"finishTime":90.48},{"text":"power outages,","startTime":90.75,"finishTime":91.559},{"text":"fires,","startTime":91.769,"finishTime":92.279},{"text":"bomb threats,","startTime":92.449,"finishTime":93.23},{"text":"active shooter situations,","startTime":93.339,"finishTime":94.76},{"text":"and pandemic diseases.","startTime":94.97,"finishTime":96.19},{"text":"The key takeaway is that HR keeps employees paid and informed first,","startTime":97,"finishTime":100.68},{"text":"then restores records,","startTime":100.879,"finishTime":102.069},{"text":"assistance programs,","startTime":102.36,"finishTime":103.309},{"text":"and benefit payments if the emergency continues.","startTime":103.55,"finishTime":105.879}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["tMPGPkmc6n8LCBgDa","Ht7sAgxmgYnxsfQiM"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This Human Resources Continuity Plan explains how HR will keep employee support, payroll, and personnel functions running during an emergency. We organize our priorities by how long the emergency lasts. In an emergency under 30 days, our first priorities are the HR Help Desk, Paycom, payroll processing, and an up-to-date emergency contact list. That list lets HR and the divisions reach employees even if agency phone lines are down. If an emergency lasts longer than 30 days, we also restore access to personnel records, keep the Employee Assistance Program active, and make payments to benefit vendors so coverage doesn't lapse. The HR Director and HR Generalist can each perform these functions, so the work continues even if one of them is unavailable. HR works with IT to keep the Help Desk available and to find a secure Wi-Fi network for processing payroll through Paycom. For communication, the HR team uses an established text group. Employees receive an initial alert through AlertMedia, followed by details by email, and the HR Help Desk serves as the main source for personnel, benefits, and payroll information. HR contacts external vendors as needed, based on the level of the emergency. All critical files are stored in the encrypted L:\\\\HR folder and should be copied to a backup location when possible. Paycom and Outlook, including the HR Help Desk, can be used without VPN. HR also follows the Incident Command System for emergencies such as tornadoes, power outages, fires, bomb threats, active shooter situations, and pandemic diseases. The key takeaway is that HR keeps employees paid and informed first, then restores records, assistance programs, and benefit payments if the emergency continues.\\\"\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direc  remain in the building until the authorities give further instruction.","startTime":12.81,"finishTime":15.949},{"text":"Exterior windows and doors stay closed.","startTime":16.819,"finishTime":19.149},{"text":"Staff shelter in an area away from windows or without windows.","startTime":20,"finishTime":23.36},{"text":"When possible,","startTime":24.219,"finishTime":24.879},{"text":"staff place a wet towel to seal the gaps under the doors.","startTime":25.18,"finishTime":27.92},{"text":"If the event is inside the building,","startTime":28.78,"finishTime":30.43},{"text":"staff evacuate immediately when instructed by emergency text alert.","startTime":30.629,"finishTime":34.15},{"text":"Staff turn off all electrical equipment except lights,","startTime":34.99,"finishTime":37.52},{"text":"and they close all doors and windows.","startTime":37.68,"finishTime":39.599},{"text":"Supervisors report anyone who is missing.","startTime":40.45,"finishTime":42.63},{"text":"A staff member who is trapped closes all doors,","startTime":43.369,"finishTime":45.84},{"text":"seals the large gaps under the doors,","startTime":45.97,"finishTime":47.889},{"text":"and calls 911.","startTime":48.049,"finishTime":49.409}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["jbRWbCRCrT6pypjdR","QBDbTzy445eM6m2Km"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"A chemical, biological, explosion, or radiological event triggers an emergency text alert that instructs staff on next steps. The response depends on the location of the event. If the event is outside the building, staff remain in the building until the authorities give further instruction. Exterior windows and doors stay closed. Staff shelter in an area away from windows or without windows. When possible, staff place a wet towel to seal the gaps under the doors. If the event is inside the building, staff evacuate immediately when instructed by emergency text alert. Staff turn off all electrical equipment except lights, and they close all doors and windows. Supervisors report anyone who is missing. A staff member who is trapped closes all doors, seals the large gaps under the doors, and calls 9-1-1. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"A chemical, biological, explosion, or radiological event triggers an emergency text alert that instructs staff on next steps. The response depends on the location of the event. If the event is outside the building, staff remain in the building until the authorities give further instruction. Exterior windows and doors stay closed. Staff shelter in an area away from windows or without windows. When possible, staff place a wet towel to seal the gaps under the doors. If the event is inside the building, staff evacuate immediately when instructed by emergency text alert. Staff turn off all electrical equipment except lights, and they close all doors and windows. Supervisors report anyone who is missing. A staff member who is trapped closes all doors, seals the large gaps under the doors, and calls 9-1-1. ","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"8nqXbsXvTxByf7RhN"}},"gCienGpv6xkHbidwv":{"_id":"gCienGpv6xkHbidwv","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"idpyW2QdTD4twWjXk"},"dates":{"dateCreated":"2026-10-13T14:49:32.307Z","dateModified":"2026-10-13T19:00:00.960Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"3JkBfkicM3m43gZKa","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"qa7t7FkkpsoiQHkzH","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":72.5,"captions":[{"text":"Power outages and internet outages follow a similar pattern.","startTime":0.09,"finishTime":3.109},{"text":"Both begin with an emergency text alert that instructs staff on next steps.","startTime":4.07,"finishTime":7.75},{"text":"In a power outage,","startTime":8.52,"finishTime":9.6},{"text":"information technology staff also send detailed instructions by email.","startTime":10.14,"finishTime":13.72},{"text":"In a power outage,","startTime":14.47,"finishTime":15.51},{"text":"staff are sent home to work remotely if the power will be","startTime":15.75,"finishTime":18.11},{"text":"out at the office for longer than 30 minutes to 1 hour.","startTime":18.11,"finishTime":20.79},{"text":"The security system is disabled during the outage,","startTime":21.569,"finishTime":23.969},{"text":"and the phone system outage plan is activated if needed.","startTime":24.12,"finishTime":26.809},{"text":"After power is restored,","startTime":27.649,"finishTime":29.01},{"text":"staff contact members according to acuity level if appropriate.","startTime":29.26,"finishTime":32.5},{"text":"In an internet outage,","startTime":33.24,"finishTime":34.43},{"text":"files stored on OneDrive and the saved staff contact list remain available.","startTime":34.56,"finishTime":38.22},{"text":"Badges and cameras continue to work","startTime":39.2,"finishTime":40.979},{"text":"and the security system is armed and disarmed at the physical panel.","startTime":41.279,"finishTime":44.299},{"text":"If staff cannot work without a phone or computer,","startTime":45.04,"finishTime":47.54},{"text":"personal time may be used.","startTime":47.729,"finishTime":49.2},{"text":"Communication follows a daily pattern during an internet outage.","startTime":50.069,"finishTime":53.209},{"text":"On day one,","startTime":54.02,"finishTime":54.81},{"text":"emails are sent from off-site locations.","startTime":55.139,"finishTime":57.139},{"text":"On day two,","startTime":57.99,"finishTime":58.759},{"text":"operations and incident command staff report to the office by 9:00 a.m.","startTime":59.349,"finishTime":62.84},{"text":"On day 3,","startTime":63.619,"finishTime":64.5},{"text":"a town hall meeting is held for all staff.","startTime":64.62,"finishTime":66.86},{"text":"After the internet is restored,","startTime":67.62,"finishTime":69.18},{"text":"staff contact members according to acuity level.","startTime":69.379,"finishTime":71.76}],"playbackCompletionAction":{"type":"nextPage"}}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["idpyW2QdTD4twWjXk","qa7t7FkkpsoiQHkzH"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Power outages and internet outages follow a similar pattern. Both begin with an emergency text alert that instructs staff on next steps. In a power outage, Information Technology staff also send detailed instructions by email. In a power outage, staff are sent home to work remotely if the power will be out at the office for longer than thirty minutes to one hour. The security system is disabled during the outage, and the phone system outage plan is activated if needed. After power is restored, staff contact members according to acuity level, if appropriate. In an internet outage, files stored on OneDrive and the saved staff contact list remain available. Badges and cameras continue to work, and the security system is armed and disarmed at the physical panel. If staff cannot work without a phone or computer, personal time may be used. Communication follows a daily pattern during an internet outage. On day one, emails are sent from off-site locations. On day two, Operations and Incident Command Staff report to the office by 9:00 a.m. On day three, a Town Hall Meeting is held for all staff. After the internet is restored, staff contact members according to acuity level.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Power outages and internet outages follow a similar pattern. Both begin with an emergency text alert that instructs staff on next steps. In a power outage, Information Technology staff also send detailed instructions by email. In a power outage, staff are sent home to work remotely if the power will be out at the office for longer than thirty minutes to one hour. The security system is disabled during the outage, and the phone system outage plan is activated if needed. After power is restored, staff contact members according to acuity level, if appropriate. In an internet outage, files stored on OneDrive and the saved staff contact list remain available. Badges and cameras continue to work, and the security system is armed and disarmed at the physical panel. If staff cannot work without a phone or computer, personal time may be used. Communication follows a daily pattern during an internet outage. On day one, emails are sent from off-site locations. On day two, Operations and Incident Command Staff report to the office by 9:00 a.m. On day three, a Town Hall Meeting is held for all staff. After the internet is restored, staff contact members according to acuity level.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"8rJDHsNKvRZfNStQL"}},"hkzMioJtLRQTw54JA":{"_id":"hkzMioJtLRQTw54JA","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"QEmkcq7vBZnWaBonD"},"dates":{"dateCreated":"2026-10-13T15:01:05.010Z","dateModified":"2026-10-13T17:40:57.730Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true,"questions":["JmZ7qh7Kg2buuQHCW"]},"video":{"autoPlay":true,"overlays":[{"identifier":"ybejmoW9Fz4ddzNWA","kind":"overlay","type":"questionMC","width":633,"height":674,"x":617,"y":29,"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":5,"topRight":5,"bottomLeft":5,"bottomRight":5},"fill":{"type":"color","color":"koantic(light1, 0, 1)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":16},"shadow":{"angle":270,"distance":0,"blur":12,"color":"rgba(0, 0, 0, 0.53)"}},"questionId":"JmZ7qh7Kg2buuQHCW","start":0,"behaviorType":"continue","rotationAngle":0},{"identifier":"65aDwkmwoFZxYTkBr","kind":"overlay","type":"rectangle","width":504.0000000000001,"height":276.894280762565,"x":43,"y":71,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fade "Building safety is another key priority.","startTime":32,"finishTime":34.11},{"text":"The manager of support and emergency","startTime":34.909,"finishTime":37.02},{"text":"operations works closely with CAM Incorporated,","startTime":37.02,"finishTime":39.419},{"text":"local law enforcement,","startTime":39.61,"finishTime":40.77},{"text":"and the Green Fire Department to respond to building emergencies such as fires,","startTime":41.029,"finishTime":44.59},{"text":"severe weather,","startTime":44.709,"finishTime":45.43},{"text":"structural issues,","startTime":45.569,"finishTime":46.47},{"text":"utility failures,","startTime":46.63,"finishTime":47.659},{"text":"or security threats.","startTime":47.83,"finishTime":48.869},{"text":"Building security systems,","startTime":49.74,"finishTime":51.159},{"text":"including cameras and alarms are maintained to support employee safety.","startTime":51.43,"finishTime":55},{"text":"To ensure continuity of operations,","startTime":55.77,"finishTime":57.72},{"text":"critical emergency documentation is maintained within the ICS team site,","startTime":57.97,"finishTime":61.93},{"text":"and emergency notification tools such as alert media","startTime":62.09,"finishTime":64.849},{"text":"are available to quickly communicate with staff.","startTime":64.849,"finishTime":67.089},{"text":"If the building cannot be occupied,","startTime":67.83,"finishTime":69.66},{"text":"employees may be relocated to approved alternate","startTime":70.029,"finishTime":72.15},{"text":"sites or assigned to work remotely.","startTime":72.15,"finishTime":73.989},{"text":"The plan also provides guidance for specific emergencies including tornadoes,","startTime":74.76,"finishTime":79.029},{"text":"power outages,","startTime":79.279,"finishTime":80.11},{"text":"medical emergencies,","startTime":80.319,"finishTime":81.389},{"text":"fires,","startTime":81.599,"finishTime":82.04},{"text":"earthquakes,","startTime":82.16,"finishTime":82.83},{"text":"bomb threats,","startTime":82.989,"finishTime":83.68},{"text":"active shooter incidents,","startTime":83.86,"finishTime":85},{"text":"and evacuations.","startTime":85.199,"finishTime":86.239},{"text":"Staff are expected to follow established emergency procedures","startTime":87.129,"finishTime":90.139},{"text":"and leadership instructions based on the situation.","startTime":90.139,"finishTime":92.58},{"text":"The key takeaway is that effective communication,","startTime":93.379,"finishTime":95.73},{"text":"coordinated emergency response,","startTime":95.9,"finishTime":97.529},{"text":"building safety measures,","startTime":97.73,"finishTime":98.849},{"text":"and flexible work location options allow the organization to continue","startTime":99.099,"finishTime":102.419},{"text":"serving the community while protecting employees during an emergency.","startTime":102.419,"finishTime":105.58}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["wqLQfC7KL7LWG5eFo","TBQA4xwMraMS2SNCT"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This Building Operations Continuity Plan explains how Direction Home Akron Canton will protect employees, maintain building safety, and continue operations during emergencies that affect our facilities. The plan begins with communication. During an emergency, the Incident Commander and leadership team will use the organization's emergency alert system to provide updates through text messages, emails, and voicemail. If email is unavailable, communication will continue through text messages and phone calls to ensure employees receive timely instructions. Building safety is another key priority. The Manager of Support and Emergency Operations works closely with CAM Incorporated, local law enforcement, and the Green Fire Department to respond to building emergencies such as fires, severe weather, structural issues, utility failures, or security threats. Building security systems, including cameras and alarms, are maintained to support employee safety. To ensure continuity of operations, critical emergency documentation is maintained within the ICS Teams site, and emergency notification tools such as AlertMedia are available to quickly communicate with staff. If the building cannot be occupied, employees may be relocated to approved alternate sites or assigned to work remotely. The plan also provides guidance for specific emergencies, including tornadoes, power outages, medical emergencies, fires, earthquakes, bomb threats, active shooter incidents, and evacuations. Staff are expected to follow established emergency procedures and leadership instructions based on the situation. The key takeaway is that effective communication, coordinated emergency response, building safety measures, and flexible work location options allow the organization to continue serving the community while protecting employees during an emergency.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"This Building Operations Continuity Plan explains how Direction Home Akron Canton will protect employees, maintain building safety, and continue operations during emergencies that affect our facilities. The plan begins with communication. During an emergency, the Incident Commander and leadership team will use the organization's emergency alert system to provide updates through text messages, emails, and voicemail. If email is unavailable, communication will continue through text messages and phone calls to ensure employees receive timely instructions. Building safety is another key priority. The Manager of Support and Emergency Operations works closely with CAM Incorporated, local law enforcement, and the Green Fire Department to respond to building emergencies such as fires, severe weather, structural issues, utility failures, or security threats. Building security systems, including cameras and alarms, are maintained to support employee safety. To ensure continuity of operations, critical emergency documentation is maintained within the ICS Teams site, and emergency notification tools such as AlertMedia are available to quickly communicate with staff. If the building cannot be occupied, employees may be relocated to approved alternate sites or assigned to work remotely. The plan also provides guidance for specific emergencies, including tornadoes, power outages, medical emergencies, fires, earthquakes, bomb threats, active shooter incidents, and evacuations. Staff are expected to follow established emergency procedures and leadership instructions based on the situation. The key takeaway is that effective communication, coordinated emergency response, building safety measures, and flexible work location options allow the organization to continue serving the community while protecting employees during an emergency.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"7dMsyP8xFP6XZrEXz"}},"ioLQdtT523LCLFwxC":{"_id":"ioLQdtT523LCLFwxC","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"T3MfsgnqviPMZ2oCd"},"dates":{"dateCreated":"2026-10-13T15:00:50.782Z","dateModified":"2026-10-13T19:00:12.379Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"kF8bLGiw5H3hiiiaz","kind":"overlay","type":"rectangle","width":1280,"height":720,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"cust er":{"size":0,"color":"#000000","left":true,"right":true,"top":true,"bottom":true},"fill":{"type":"color","color":"koantic(accent1, 0, 1)"},"padding":{"top":0,"bottom":0,"left":0,"right":0},"lineHeight":1.2,"title":"Button","hover":{"fillColor":"koantic(accent1, 4, 1)"},"roundedCorners":{"bottomLeft":6,"bottomRight":6,"topLeft":6,"topRight":6}},"htmlContent":"\u003cdiv>Click here to return to department menu\u003c/div>\n","start":0,"behaviorType":"continue","rotationAngle":0,"clickAction":{"goToPage":{"type":"branchingPage","pageId":"5jn6A3vhmipYk8Lfs"},"type":"goToPage"}}],"duration":110.525,"captions":[{"text":"This provider relations continuity plan explains how","startTime":0.09,"finishTime":2.73},{"text":"our team will keep communicating with providers","startTime":2.73,"finishTime":4.969},{"text":"and recruit new ones when needed during an emergency.","startTime":5.09,"finishTime":7.829},{"text":"Our two essential functions are communicating with","startTime":8.64,"finishTime":10.97},{"text":"providers and recruiting providers as needed.","startTime":10.97,"finishTime":12.93},{"text":"Every role on the team has a defined backup.","startTime":13.75,"finishTime":16.158},{"text":"Provider relations specialists back each other up.","startTime":16.93,"finishTime":19.42},{"text":"The manager is backed up by the non-Mediccaid team leader","startTime":20.129,"finishTime":22.989},{"text":"and the team leader by the manager.","startTime":23.09,"finishTime":24.549},{"text":"The vice president of strategic Planning and Performance Improvement","startTime":25.479,"finishTime":28.36},{"text":"oversees the team with the COLO as backup.","startTime":28.36,"finishTime":31.299},{"text":"When a disaster occurs,","startTime":32.208,"finishTime":33.398},{"text":"the VP works with the emergency response officer and the","startTime":33.528,"finishTime":36.199},{"text":"incident command structure to determine whether there is an emergency.","startTime":36.199,"finishTime":39.148},{"text":"The VP then tells the manager and team leader the emergency level,","startTime":39.919,"finishTime":43.29},{"text":"and the manager directs staff on actions such as working from home,","startTime":43.439,"finishTime":46.479},{"text":"contacting providers,","startTime":46.88,"finishTime":47.909},{"text":"or retrieving vital records.","startTime":47.959,"finishTime":49.4},{"text":"The VP also works with communications to reach the wider provider network","startTime":50.18,"finishTime":54.06},{"text":"and makes sure disaster assistance information","startTime":54.06,"finishTime":56.18},{"text":"reaches home and community-based services,","startTime":56.18,"finishTime":58.18},{"text":"elder rights,","startTime":58.33,"finishTime":59.09},{"text":"and communications.","startTime":59.299,"finishTime":60.299},{"text":"Email is our primary communication method with text and phone calls as backups.","startTime":61.159,"finishTime":65.76},{"text":"Provider contact information is stored on the L","startTime":66.58,"finishTime":69.199},{"text":"drive and copied monthly to an Excel file that any agency staff can use.","startTime":69.379,"finishTime":73.199},{"text":"The communications department can also reach providers","startTime":74,"finishTime":76.639},{"text":"through constant contact and social media.","startTime":76.639,"finishTime":78.68},{"text":"Critical files include the active provider list in","startTime":79.459,"finishTime":81.87},{"text":"SharePoint and provider contracts on the L drive.","startTime":81.87,"finishTime":84.43},{"text":"Provider information is also available in Ages sage.","startTime":85.25,"finishTime":88.23},{"text":"If needed,","startTime":89.04,"finishTime":89.68},{"text":"we recruit providers to expand services in affected areas.","startTime":89.839,"finishTime":92.809},{"text":"Within a month after a disaster,","startTime":93.68,"finishTime":95.22},{"text":"the VP prepares an evaluation of our response,","startTime":95.36,"finishTime":97.8},{"text":"which is reviewed at the next EPC meeting.","startTime":98,"finishTime":100.059},{"text":"The key takeaways that defined roles clear","startTime":100.94,"finishTime":103.449},{"text":"communication and ready access to provider information","startTime":103.449,"finishTime":106.339},{"text":"let us keep our provider network informed and supported when it matters most.","startTime":106.339,"finishTime":109.779}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["qKwGYc5dibKqvPEqY","qbpbzj9BgecWQdvCk"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This Provider Relations Continuity Plan explains how our team will keep communicating with providers, and recruit new ones when needed, during an emergency. Our two essential functions are communicating with providers and recruiting providers as needed. Every role on the team has a defined backup. Provider Relations Specialists back each other up. The Manager is backed up by the Non-Medicaid Team Leader, and the Team Leader by the Manager. The Vice President of Strategic Planning and Performance Improvement oversees the team, with the C O L O as backup. When a disaster occurs, the VP works with the Emergency Response Officer and the Incident Command Structure to determine whether there is an emergency. The VP then tells the Manager and Team Leader the emergency level, and the Manager directs staff on actions such as working from home, contacting providers, or retrieving vital records. The VP also works with Communications to reach the wider provider network and makes sure disaster assistance information reaches Home and Community Based Services, Elder Rights, and Communications. Email is our primary communication method, with text and phone calls as backups. Provider contact information is stored on the L: drive and copied monthly to an Excel file that any agency staff can use. The Communications Department can also reach providers through Constant Contact and social media. Critical files include the active Provider List in SharePoint and provider contracts on the L: drive. Provider information is also available in AGE's SAGE. If needed, we recruit providers to expand services in affected areas. Within a month after a disaster, the VP prepares an evaluation of our response, which is reviewed at the next E P C meeting. The key takeaway is that defined roles, clear communication, and ready access to provider information let us keep our provider network informed and supported when it matters most.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"This Provider Relations Continuity Plan explains how our team will keep communicating with providers, and recruit new ones when needed, during an emergency. Our two essential functions are communicating with providers and recruiting providers as needed. Every role on the team has a defined backup. Provider Relations Specialists back each other up. The Manager is backed up by the Non-Medicaid Team Leader, and the Team Leader by the Manager. The Vice President of Strategic Planning and Performance Improvement oversees the team, with the C O L O as backup. When a disaster occurs, the VP works with the Emergency Response Officer and the Incident Command Structure to determine whether there is an emergency. The VP then tells the Manager and Team Leader the emergency level, and the Manager directs staff on actions such as working from home, contacting providers, or retrieving vital records. The VP also works with Communications to reach the wider provider network and makes sure disaster assistance information reaches Home and Community Based Services, Elder Rights, and Communications. Email is our primary communication method, with text and phone calls as backups. Provider contact information is stored on the L: drive and copied monthly to an Excel file that any agency staff can use. The Communications Department can also reach providers through Constant Contact and social media. Critical files include the active Provider List in SharePoint and provider contracts on the L: drive. Provider information is also available in AGE's SAGE. If needed, we recruit providers to expand services in affected areas. Within a month after a disaster, the VP prepares an evaluation of our response, which is reviewed at the next E P C meeting. The key takeaway is that defined roles, clear communication, and ready access to provider information let us keep our provider network informed and supported when it matters most.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"mmhvWoGm9qcjHfNAX"}},"sTw28zT84y4Sy5GAK":{"_id":"sTw28zT84y4Sy5GAK","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Finance","upload":"sfXxfHFuapykNojBW"},"dates":{"dateCreated":"2026-10-13T17:57:05.657Z","dateModified":"2026-10-13T18:27:33.619Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"x":-31,"y":-39,"width":1285,"height":722.8125,"rotationAngle":0,"identifier":"jxckHCkhayyFgLvAg","kind":"overlay","type":"rectangle","entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight": ,"startTime":20.79,"finishTime":23.459},{"text":"contact vendors and partners as required,","startTime":23.879,"finishTime":25.739},{"text":"and process and reconcile member share of cost accounts.","startTime":25.92,"finishTime":28.639},{"text":"Every one of these functions has a designated owner and a backup.","startTime":29.459,"finishTime":32.81},{"text":"For example,","startTime":33.47,"finishTime":34.11},{"text":"the payroll slash accounting specialist processes payroll","startTime":34.229,"finishTime":36.99},{"text":"with the cash specialist as backup.","startTime":36.99,"finishTime":38.61},{"text":"The accountant that handles funds requests and grant","startTime":39.459,"finishTime":41.849},{"text":"invoices with the manager of accounting as backup.","startTime":41.849,"finishTime":44.2},{"text":"The CFO or designee handles vendor and partner contact","startTime":45.069,"finishTime":48.209},{"text":"with the AVP finance slash controller as backup.","startTime":48.209,"finishTime":51.229},{"text":"Communication follows the chain of command.","startTime":52.04,"finishTime":54.2},{"text":"The incident commander notifies the CFO,","startTime":55,"finishTime":57.34},{"text":"who then informs the AVP finance slash controller about the level of emergency.","startTime":57.599,"finishTime":61.86},{"text":"The AVP finance slash controller and the manager of accounting serve as team leads.","startTime":62.63,"finishTime":67.309},{"text":"They direct staff on actions such as working from home or an alternate facility,","startTime":68.16,"finishTime":71.91},{"text":"processing payroll,","startTime":72.309,"finishTime":73.12},{"text":"and processing billing.","startTime":73.25,"finishTime":74.319},{"text":"If email is unavailable,","startTime":75.099,"finishTime":76.61},{"text":"we communicate by text and phone.","startTime":76.73,"finishTime":78.519},{"text":"The CFO also keeps current contacts for AGE,","startTime":79.279,"finishTime":82.36},{"text":"the AAAS payors,","startTime":82.519,"finishTime":84.269},{"text":"our insurance risk advisor,","startTime":84.48,"finishTime":85.959},{"text":"PNC,","startTime":86.12,"finishTime":86.959},{"text":"Paycom,","startTime":87.199,"finishTime":87.72},{"text":"and other active vendors.","startTime":87.959,"finishTime":89.16},{"text":"Our critical files are stored in financial services folders on the L drive.","startTime":90.029,"finishTime":94.139},{"text":"Several platforms are available without VPN","startTime":94.98,"finishTime":97.72},{"text":"including Paycom,","startTime":97.959,"finishTime":98.739},{"text":"PNC Online banking,","startTime":99.029,"finishTime":100.769},{"text":"and Office 365 email.","startTime":100.94,"finishTime":102.76},{"text":"Others,","startTime":103.709,"finishTime":104.22},{"text":"including the L,","startTime":104.51,"finishTime":105.26},{"text":"drive,","startTime":105.51,"finishTime":105.87},{"text":"SH,","startTime":106.11,"finishTime":106.459},{"text":"Ohio benefits,","startTime":106.919,"finishTime":107.98},{"text":"and MITS require VPN.","startTime":108.139,"finishTime":110.79},{"text":"The plan is activated through the chain of command,","startTime":111.559,"finishTime":113.919},{"text":"and each executive reviews the division's essential functions annually.","startTime":114.16,"finishTime":117.48},{"text":"The key takeaway is that clear roles,","startTime":118.26,"finishTime":120.29},{"text":"backups,","startTime":120.43,"finishTime":120.94},{"text":"communication,","startTime":121.059,"finishTime":121.9},{"text":"and secure access to files and systems let us keep paying staff and providers,","startTime":122.059,"finishTime":125.94},{"text":"billing our funders,","startTime":126.18,"finishTime":127.129},{"text":"and supporting members during any disruption.","startTime":127.37,"finishTime":129.3}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["sfXxfHFuapykNojBW","cD9dskEFcRd3yy55r"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This Financial Services Division Continuity Plan explains how we will keep our critical financial operations running during an emergency or disruption. Five functions must continue. They are processing payroll, provider billing, and accounts payable. We also prepare and submit requests for funds and invoices for our Grant and Risk contract activities. We purchase the supplies and equipment employees need, contact vendors and partners as required, and process and reconcile member share-of-cost accounts. Every one of these functions has a designated owner and a backup. For example, the Payroll/Accounting Specialist processes payroll with the Cash Specialist as backup. The Accountant I handles funds requests and grant invoices with the Manager of Accounting as backup. The CFO or designee handles vendor and partner contact with the A V P Finance/Controller as backup. Communication follows the chain of command. The Incident Commander notifies the CFO, who then informs the A V P Finance/Controller about the level of emergency. The A V P Finance/Controller and the Manager of Accounting serve as Team Leads. They direct staff on actions such as working from home or an alternate facility, processing payroll, and processing billing. If email is unavailable, we communicate by text and phone. The CFO also keeps current contacts for AGE, the AAAs, payors, our insurance risk advisor, P N C, Paycom, and other active vendors. Our critical files are stored in Financial Services folders on the L: drive. Several platforms are available without V P N, including Paycom, P N C online banking, and Office 365 email. Others, including the L: drive, S AGE, Ohio Benefits, and M I T S, require V P N. The plan is activated through the chain of command, and each Executive reviews the division's essential functions annually. The key takeaway is that clear roles, backups, communication, and secure access to files and systems let us keep paying staff and providers, billing our funders, and supporting members during any disruption.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-LiamNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"This Financial Services Division Continuity Plan explains how we will keep our critical financial operations running during an emergency or disruption. Five functions must continue. They are processing payroll, provider billing, and accounts payable. We also prepare and submit requests for funds and invoices for our Grant and Risk contract activities. We purchase the supplies and equipment employees need, contact vendors and partners as required, and process and reconcile member share-of-cost accounts. Every one of these functions has a designated owner and a backup. For example, the Payroll/Accounting Specialist processes payroll with the Cash Specialist as backup. The Accountant I handles funds requests and grant invoices with the Manager of Accounting as backup. The CFO or designee handles vendor and partner contact with the A V P Finance/Controller as backup. Communication follows the chain of command. The Incident Commander notifies the CFO, who then informs the A V P Finance/Controller about the level of emergency. The A V P Finance/Controller and the Manager of Accounting serve as Team Leads. They direct staff on actions such as working from home or an alternate facility, processing payroll, and processing billing. If email is unavailable, we communicate by text and phone. The CFO also keeps current contacts for AGE, the AAAs, payors, our insurance risk advisor, P N C, Paycom, and other active vendors. Our critical files are stored in Financial Services folders on the L: drive. Several platforms are available without V P N, including Paycom, P N C online banking, and Office 365 email. Others, including the L: drive, S AGE, Ohio Benefits, and M I T S, require V P N. The plan is activated through the chain of command, and each Executive reviews the division's essential functions annually. The key takeaway is that clear roles, backups, communication, and secure access to files and systems let us keep paying staff and providers, billing our funders, and supporting members during any disruption.","voiceCodeUsed":"en-CA-LiamNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"QSsDA6W23KdTwmonf"}},"tziubRrTAvXpe2tEf":{"_id":"tziubRrTAvXpe2tEf","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceAssessment","locale":"en","title":"Quiz"},"dates":{"dateCreated":"2026-10-13T19:05:45.990Z","dateModified":"2026-10-13T19:26:59.614Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":true,"includeInProjectResult":true,"passingGrade":80,"skipQuestions":true,"showFeedback":true,"questions":["D5LnGZwjNjJHjaeQB","shCJihrgj5sY9t6cT","AsyXC9dT7dZH6ZXaS","cF7EwWJGqZp6muQWD","RpuuNhLuXa533bTxr","6yBStuzDZWFceXojT","PpJgqstAAqHaX7RAg","grLxPKNL4hpoJ53wt","KQE9vdoPhHcvAdnpR","rRSyKHPBEYuRQz5fn"],"numberOfRetries":-1}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":[],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[]},"v8XbZNzRncTMZ9MPM":{"_id":"v8XbZNzRncTMZ9MPM","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank"},"dates":{"dateCreated":"2026-10-13T14:39:57.332Z","dateModified":"2026-10-13T18:47:36.903Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true,"questions":["LGup8d6angKzytdDW"]},"video":{"autoPlay":true,"overlays":[{"identifier":"tap3H4uqaahC97dgS","kind":"overlay","type":"questionSEQ","width":11
