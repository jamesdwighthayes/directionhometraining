lor":"koantic(light1, 0, 1)"},"themeColors":{"dark1":"rgba(0,0,0,1)","light1":"rgba(255,255,255,1)","dark2":"rgba(68, 84, 106, 1)","light2":"rgba(255, 255, 255, 1)","accent1":"rgba(68, 114, 196, 1)","accent2":"rgba(237, 125, 49, 1)","accent3":"rgba(165, 165, 165, 1)","accent4":"rgba(255, 192, 0, 1)","accent5":"rgba(91, 155, 213, 1)","accent6":"rgba(112, 173, 71, 1)"}},"assetsById":{"3YWArbCuH2xuf3xGb":{"_id":"3YWArbCuH2xuf3xGb","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":2964,"uploadedFileName":"image.png","height":88,"uploadedFileNameExtension":".png","width":244},"dates":{"dateCreated":"2025-08-18T18:05:08.102Z","dateModified":"2025-08-18T18:05:08.102Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"cjKvZ6odgmXE3tKAx","thumbnail":"32XvqrssnLRo5dmS7"},"JocPE4RRLocoyLGkS":{"_id":"JocPE4RRLocoyLGkS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":424,"uploadedFileName":"image.png","height":43,"uploadedFileNameExtension":".png","width":56},"dates":{"dateCreated":"2025-08-18T18:15:50.701Z","dateModified":"2025-08-18T18:15:50.701Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"fwNPXZ67Y9b5RgyeH","thumbnail":"erNerTKF4ZQpD4HbT"},"K9aipdNR9uYrkngL2":{"_id":"K9aipdNR9uYrkngL2","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":3094,"uploadedFileName":"image.png","height":68,"uploadedFileNameExtension":".png","width":241},"dates":{"dateCreated":"2025-08-18T18:07:22.542Z","dateModified":"2025-08-18T18:07:22.542Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"n93aJBFtXbP8pqHbx","thumbnail":"rvmQwzkQ2Sj9w5MxC"}},"questionsById":{"3iE8eDCsmDtZPFtMT":{"_id":"3iE8eDCsmDtZPFtMT","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionTF","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Sending account information in regular, unencrypted email is acceptable as long as you are writing to a trusted contact.\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["5kXoFzEmeqhRXQtko"]},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> That&#39;s right. A trusted contact doesn&#39;t make the channel safe. Email can be intercepted, so account details should be sent encrypted when email is necessary, or better yet through an established, secure platform.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Trusting the person doesn&#39;t protect the message. Regular email can be intercepted, and attackers who read it can use the details to impersonate someone. When account information must be sent by email, encrypt it. Where possible, use an established platform instead.\u003c/div>\n"}},"responses":[{"identifier":"GqduZHC4ZuneRwnfa","description":{"type":"text","html":"True","resourceWidthPercentage":100}},{"identifier":"5kXoFzEmeqhRXQtko","description":{"type":"text","html":"False","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"7aBsxLFb3cBpXxJd3":{"_id":"7aBsxLFb3cBpXxJd3","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Your team collects donations by emailing donors links and account details. An attacker who intercepts one of these conversations could slip in a fraudulent link. Which change does the most to prevent this?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["kgXM9NqmsE2g4gWsn"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. An official platform removes ad hoc links and account details from email, which gives an attacker nothing to replace. Standard messaging telling donors they will never be asked to click outside the platform helps them recognize a fraudulent request.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Confirmations, speed, and a formal tone don&#39;t stop an attacker who has intercepted the conversation. The strongest fix is to move transactions onto an official platform, so no links or account details travel by ad hoc email. Then tell recipients they will never be asked to click links outside of it.\u003c/div>\n"}},"responses":[{"identifier":"3GSECWegRdiXLug5a","description":{"type":"text","html":"\u003cdiv>Ask donors to reply to confirm they received each email\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"kgXM9NqmsE2g4gWsn","description":{"type":"text","html":"\u003cdiv>Use an official gift and donation platform for all transactions, and tell donors they will never be asked to click links outside of it\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"xsJa2weP6GsaSwtc9","description":{"type":"text","html":"\u003cdiv>Send donors links more quickly so there is less time to intercept them\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"zroJ834ASAvXLMoWF","description":{"type":"text","html":"\u003cdiv>Use a more formal writing style so messages look more professional\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"CxxxdoizC3nZT4PmK":{"_id":"CxxxdoizC3nZT4PmK","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>When reviewing a business process for security, which questions should you ask?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["Evwjw4kjg2kCedwTz","87KthQ4Q3nc3muBpj","78tEYDzBvpeiH5MXf","bazcfLRvmNo7mZ6ap"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. A good security review asks whether the process is secure, how someone could intercept or interfere with it, what the risks are, and whether a temporary solution has become permanent. Speed alone is never the measure of a good process.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. A security review looks for weaknesses: Is the process secure? How could someone intercept it? What are the risks? Has a temporary fix become permanent? Questions that put speed ahead of risk don&#39;t belong in a security review.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Is this process secure?\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"Evwjw4kjg2kCedwTz"},{"description":{"html":"\u003cdiv>How might someone intercept it or step in and cause damage?\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"87KthQ4Q3nc3muBpj"},{"description":{"html":"\u003cdiv>What are the risks of harm with this operation?\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"78tEYDzBvpeiH5MXf"},{"description":{"html":"\u003cdiv>Is this a temporary solution that has quietly become permanent?\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"bazcfLRvmNo7mZ6ap"},{"identifier":"QztPQxJKpRNgBWDGY","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>How quickly can we complete it, regardless of risk?\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"HjeimnATXrSKTLgGA":{"_id":"HjeimnATXrSKTLgGA","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Which step is the best one to take to handle an unexpected request to change payment or account details?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["c6XoKTwSCwJaSFaL2"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. Notice something unusual and stay suspicious, hold the change, verify through a different trusted channel, then report the request so IT can double-check it. Pausing before acting is what keeps one bad request from becoming a loss.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. The order should be: apply healthy suspicion when something seems off, hold the change, verify through a separate trusted channel, then report the request for IT to review. The change should never go through before it has been verified.\u003c/div>\n"}},"responses":[{"identifier":"ryT7t7AfQXrKRBj34","description":{"type":"text","html":"\u003cdiv>Contact the requester through a different, trusted channel, such as a phone call, to verify\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"QCpWWDkPrpeCkrRha","description":{"type":"text","html":"\u003cdiv>Notice that something seems unusual and report suspicious requests to IT\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"YHSv4fccKGbrq8Mfp","description":{"type":"text","html":"\u003cdiv>Hold the change until the request has been confirmed\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"c6XoKTwSCwJaSFaL2","description":{"type":"text","html":"\u003cdiv>All of the above steps are appropriate\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"JG7oJJvJPCjL8Dj4j":{"_id":"JG7oJJvJPCjL8Dj4j","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionTF","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Confirming a sensitive request through a second communication channel that isn&#39;t connected to the first makes it harder for an attacker to succeed.\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["vuhAJrRJXLLeNF2pF"]},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> That&#39;s right. Verifying through a second, unconnected channel, such as a phone call after an email, means an attacker who controls only one channel has a hard time confirming a fake request.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Verification across multiple, unconnected channels is a key safeguard, because an attacker who controls only one channel will struggle to confirm a fake request on the others.\u003c/div>\n"}},"responses":[{"identifier":"vuhAJrRJXLLeNF2pF","description":{"type":"text","html":"True","resourceWidthPercentage":100}},{"identifier":"MpJWEXfAp9gAGtm6F","description":{"type":"text","html":"False","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"QtvTbsp9hTCahfBES":{"_id":"QtvTbsp9hTCahfBES","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>You receive a phone call asking you to change an employee&#39;s direct deposit information. Something about the call feels off. What is the best next step?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["dqkiHABeoBSqrBt74"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. When a request feels off, contact the actual person through a separate, known channel before acting. This catches fraud even when the request seems to come from the right person.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Acting on the request, or replying through the same channel it came from, can keep you inside the attacker&#39;s conversation. Instead, pause and verify with the real person through a separate, trusted channel before doing anything.\u003c/div>\n"}},"responses":[{"identifier":"bTnMpnZfBZJpaG5Lp","description":{"type":"text","html":"\u003cdiv>Process the change, then follow up later\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"o5K6zRHcJkmYykExS","description":{"type":"text","html":"\u003cdiv>Ask the caller to repeat the request by email and process it once received\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"dqkiHABeoBSqrBt74","description":{"type":"text","html":"\u003cdiv>Contact the employee through a separate, known channel to confirm the request before acting\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"Hcas4GHDQFgXipngo","description":{"type":"text","html":"\u003cdiv>Ignore the call and take no further action\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"ck98GWBufXrMxMytK":{"_id":"ck98GWBufXrMxMytK","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Why does using multiple communication channels for verification work as a security safeguard?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["MrWmpiGJku2R2be49"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. Using multiple unconnected channels means an attacker who has compromised one channel, such as an email account, still has to fake confirmation on the others, such as a phone call. That is why this method works.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. The purpose of multiple channels is security, not speed or convenience. If an attacker controls only one channel, they can&#39;t easily confirm a request through the others.\u003c/div>\n"}},"responses":[{"identifier":"JQb4JdztfGk6a9rAr","description":{"type":"text","html":"\u003cdiv>It speeds up approvals\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"nKYtnqnijA6jLD2Yz","description":{"type":"text","html":"\u003cdiv>It reduces the amount of paperwork\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"MrWmpiGJku2R2be49","description":{"type":"text","html":"\u003cdiv>An attacker who controls only one channel has a harder time confirming a request across the others\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"8KM6ursJGiJ7FJqGJ","description":{"type":"text","html":"\u003cdiv>It removes the need for encryption\u003c/div>\n","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"fQRHY3pGTK7GEEbap":{"_id":"fQRHY3pGTK7GEEbap","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionTF","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>A process that starts as a quick, email-based pilot is safe to keep running long-term as long as it has worked so far.\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["v5wf2dFrsLzZfRMCh"]},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> That&#39;s right. Temporary, email-based pilots often stay in place for a year or two. Regularly review your processes and ask whether each one is still secure.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. A process that has &quot;worked so far&quot; may simply not have been attacked yet. Quick pilots and temporary workarounds tend to become permanent, so review them regularly and move to secure, established solutions.\u003c/div>\n"}},"responses":[{"identifier":"oBXXqnB654xqgkDLC","description":{"type":"text","html":"True","resourceWidthPercentage":100}},{"identifier":"v5wf2dFrsLzZfRMCh","description":{"type":"text","html":"False","resourceWidthPercentage":100}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"oEq6s2rR6iF3avbz3":{"_id":"oEq6s2rR6iF3avbz3","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>\u003cstrong>Select all that apply.\u003c/strong>&nbsp;Which of the following makes an account-support process \u003cem>more\u003c/em> resistant to social engineering?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["6Bfwv7r6rMPJzpHvo","HTwwHjnS8qTqZ4BHP","cBag5QsBTydrBT6oh"],"multipleAnswers":true},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. Requiring several pieces of identifying information, checking them against the account record, and applying the same protocol to every request make support processes much harder to exploit. Speed and high volume are never reasons to loosen verification.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. Strong verification means requiring multiple identifiers that can be checked against the account, and applying that protocol consistently. Resetting access quickly or relaxing checks when things are busy creates the opening attackers look for. Review which options add verification and which remove it.\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Requiring multiple pieces of identifying information\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"HTwwHjnS8qTqZ4BHP"},{"description":{"html":"\u003cdiv>Asking for details that can be checked against the account record\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"6Bfwv7r6rMPJzpHvo"},{"description":{"html":"\u003cdiv>Resetting access quickly when a caller says they are locked out\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"Ea4rZETiKCQGAkbBu"},{"description":{"html":"\u003cdiv>Treating a high volume of requests as a reason to loosen verification\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"cibAktjo89PBBrnxr"},{"identifier":"cBag5QsBTydrBT6oh","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Building verification protocols that apply to every request\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"smjgdYSFPwJAQmZbv":{"_id":"smjgdYSFPwJAQmZbv","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>Why is it recommended to use email as minimally as possible for financial transactions?\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctResponses":["SCAW93on6tscnfYLH"],"multipleAnswers":false},"users":{"_userModifierID":"fMCCj2F5RvKPEqE8F","_userCreatorID":"fMCCj2F5RvKPEqE8F"},"dates":{"dateModified":"2026-10-05T17:31:38.857Z","dateCreated":"2026-10-05T17:31:38.857Z"},"feedback":{"feedbackPositive":"\u003cdiv>\u003cstrong>Correct:\u003c/strong> Yes. Email can be intercepted, and attackers can create look-alike addresses that appear trustworthy. Established platforms, with email used minimally and encrypted when needed, reduce that exposure.\u003c/div>\n","feedbackNegative":"\u003cdiv>\u003cstrong>Incorrect:\u003c/strong> Not quite. The concern isn&#39;t speed or functionality. Email messages can be intercepted, and attackers can imitate trusted senders. That&#39;s why financial transactions belong on established, secure platforms.\u003c/div>\n"}},"responses":[{"identifier":"MCxany6nRqEGoEety","description":{"type":"text","html":"\u003cdiv>Email is too slow for financial work\u003c/div>\n","resourceWidthPercentage":100}},{"identifier":"SCAW93on6tscnfYLH","description":{"type":"text","html":" oizC3nZT4PmK_87KthQ4Q3nc3muBpj":"How might someone intercept it or step in and cause damage?","CxxxdoizC3nZT4PmK_78tEYDzBvpeiH5MXf":"What are the risks of harm with this operation?","CxxxdoizC3nZT4PmK_bazcfLRvmNo7mZ6ap":"Is this a temporary solution that has quietly become permanent?","CxxxdoizC3nZT4PmK_QztPQxJKpRNgBWDGY":"How quickly can we complete it, regardless of risk?","HjeimnATXrSKTLgGA":"Which step is the best one to take to handle an unexpected request to change payment or account details?","HjeimnATXrSKTLgGA_ryT7t7AfQXrKRBj34":"Contact the requester through a different, trusted channel, such as a phone call, to verify","HjeimnATXrSKTLgGA_QCpWWDkPrpeCkrRha":"Notice that something seems unusual and report suspicious requests to IT","HjeimnATXrSKTLgGA_YHSv4fccKGbrq8Mfp":"Hold the change until the request has been confirmed","HjeimnATXrSKTLgGA_c6XoKTwSCwJaSFaL2":"All of the above steps are appropriate","JG7oJJvJPCjL8Dj4j":"Confirming a sensitive request through a second communication channel that isn't connected to the first makes it harder for an attacker to succeed.","JG7oJJvJPCjL8Dj4j_vuhAJrRJXLLeNF2pF":"True","JG7oJJvJPCjL8Dj4j_MpJWEXfAp9gAGtm6F":"False","QtvTbsp9hTCahfBES":"You receive a phone call asking you to change an employee's direct deposit information. Something about the call feels off. What is the best next step?","QtvTbsp9hTCahfBES_bTnMpnZfBZJpaG5Lp":"Process the change, then follow up later","QtvTbsp9hTCahfBES_o5K6zRHcJkmYykExS":"Ask the caller to repeat the request by email and process it once received","QtvTbsp9hTCahfBES_dqkiHABeoBSqrBt74":"Contact the employee through a separate, known channel to confirm the request before acting","QtvTbsp9hTCahfBES_Hcas4GHDQFgXipngo":"Ignore the call and take no further action","ck98GWBufXrMxMytK":"Why does using multiple communication channels for verification work as a security safeguard?","ck98GWBufXrMxMytK_JQb4JdztfGk6a9rAr":"It speeds up approvals","ck98GWBufXrMxMytK_nKYtnqnijA6jLD2Yz":"It reduces the amount of paperwork","ck98GWBufXrMxMytK_MrWmpiGJku2R2be49":"An attacker who controls only one channel has a harder time confirming a request across the others","ck98GWBufXrMxMytK_8KM6ursJGiJ7FJqGJ":"It removes the need for encryption","fQRHY3pGTK7GEEbap":"A process that starts as a quick, email-based pilot is safe to keep running long-term as long as it has worked so far.","fQRHY3pGTK7GEEbap_oBXXqnB654xqgkDLC":"True","fQRHY3pGTK7GEEbap_v5wf2dFrsLzZfRMCh":"False","oEq6s2rR6iF3avbz3":"Select all that apply. Which of the following makes an account-support process more resistant to social engineering?","oEq6s2rR6iF3avbz3_HTwwHjnS8qTqZ4BHP":"Requiring multiple pieces of identifying information","oEq6s2rR6iF3avbz3_6Bfwv7r6rMPJzpHvo":"Asking for details that can be checked against the account record","oEq6s2rR6iF3avbz3_Ea4rZETiKCQGAkbBu":"Resetting access quickly when a caller says they are locked out","oEq6s2rR6iF3avbz3_cibAktjo89PBBrnxr":"Treating a high volume of requests as a reason to loosen verification","oEq6s2rR6iF3avbz3_cBag5QsBTydrBT6oh":"Building verification protocols that apply to every request","smjgdYSFPwJAQmZbv":"Why is it recommended to use email as minimally as possible for financial transactions?","smjgdYSFPwJAQmZbv_MCxany6nRqEGoEety":"Email is too slow for financial work","smjgdYSFPwJAQmZbv_SCAW93on6tscnfYLH":"Email messages can be intercepted, and attackers can imitate trusted senders","smjgdYSFPwJAQmZbv_YLmKdMiu9WtcMxHTz":"Email can't carry attachments","smjgdYSFPwJAQmZbv_XdyCyBQhKAxb27TCn":"Email isn't allowed in financial services"}}};
