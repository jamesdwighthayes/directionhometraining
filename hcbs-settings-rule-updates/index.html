ampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"Welcome to this supplemental training on the Home and Community-Based Services, or HCBS, Settings Rule. This lesson is designed for case managers who have already completed the 2024 Ohio Department of Aging video on HCBS settings. Rather than repeating that foundational content, this training focuses specifically on what has changed as of August 2026. Over the next several slides, updated documentation requirements, system processes, protected rights, and review timelines will be reviewed. These updates apply to both the PASSPORT and Assisted Living waivers, so the guidance covered here is relevant regardless of the setting in which an individual receives services.\nThe 2024 video established the foundation for understanding HCBS settings requirements, and that knowledge remains essential. This lesson simply layers the August 2026 changes on top of it. Previously, care plans relied on informal, narrative descriptions to explain why a modification was needed, and most examples centered on Adult Day Services. The updated guidance moves toward standardized, structured documentation that is applied consistently across both waivers. This shift is intended to reduce compliance risk and minimize audit findings. Four major changes will be covered in this training: the mandatory seven-point documentation framework, standardized documentation within the PIMS HCBS Assessment Tool, an expanded scope of protected rights, and clearly defined review timelines and approval limits. ","voiceCode":"en-US-JacobNeural","language":"en","originalResourceId":"HxMcPukrJgteyctqS","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoic e":69.219,"finishTime":71.719},{"text":"This shift is intended to reduce compliance risk and minimize audit findings.","startTime":72.66,"finishTime":76.94},{"text":"For major changes will be covered in this training,","startTime":77.839,"finishTime":80.15},{"text":"the mandatory seven-point documentation framework,","startTime":80.36,"finishTime":83.029},{"text":"standardized documentation within the PIMS HCBS assessment tool,","startTime":83.319,"finishTime":87.23},{"text":"an expanded scope of protected rights,","startTime":87.4,"finishTime":89.309},{"text":"and clearly defined review timelines and approval limits.","startTime":89.44,"finishTime":92.4}]}},"cTrX77bgoEQTJkg9H":{"_id":"cTrX77bgoEQTJkg9H","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1374336,"uploadedFileName":"Jacob-en-2024Videovs2026Guidance-8232026.mp3","uploadedFileNameExtension":".mp3","duration":57.2375},"dates":{"dateCreated":"2026-08-24T02:40:10.072Z","dateModified":"2026-08-24T02:40:13.015Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"To bring everything together, consider the key differences between the 2024 practice and the 2026 guidance. For system process, care managers previously entered general text into PIMS care plan fields; now, the structured HCBS Assessment Tool in PIMS auto-populates the Person-Centered Service Plan. When no rights are modified, this was once mentioned only in general care plan text; now, case managers select \"no rights modification\" in PIMS and apply standardized language. For modification elements, the flexible narrative of the past has been replaced by a mandatory seven-point checklist for every modification. Finally, regarding waiver scope, the earlier broad, Adult Day Services-focused application has given way to specific rules outlined for both the PASSPORT and Assisted Living waivers. Keeping these distinctions in mind will help ensure that every care plan meets the updated August 2026 requirements. ","voiceCode":"en-US-JacobNeural","language":"en","originalResourceId":"LNPEzarJsnoebhbCe","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JacobNeural\">To bring everything together, consider the key differences between the 2024 practice and the 2026 guidance. For system process, care managers previously entered general text into PIMS care plan fields; now, the structured HCBS Assessment Tool in PIMS auto-populates the Person-Centered Service Plan. When no rights are modified, this was once mentioned only in general care plan text; now, case managers select \"no rights modification\" in PIMS and apply standardized language. For modification elements, the flexible narrative of the past has been replaced by a mandatory seven-point checklist for every modification. Finally, regarding waiver scope, the earlier broad, Adult Day Services-focused application has given way to specific rules outlined for both the PASSPORT and Assisted Living waivers. Keeping these distinctions in mind will help ensure that every care plan meets the updated August 2026 requirements. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"To bring everything together,","startTime":0.079,"finishTime":1.399},{"text":"consider the key differences between the 2024 practice and the 2026 guidance.","startTime":1.8090000000000002,"finishTime":6.409},{"text":"For system process,","startTime":7.34,"finishTime":8.539},{"text":"care managers previously entered general text into PMS care plan fields.","startTime":8.818999999999999,"finishTime":12.81},{"text":"Now,","startTime":13.13,"finishTime":13.479},{"text":"the structured HCBS assessment tool in PMS","startTime":13.659,"finishTime":16.42},{"text":"auto populates the person-centered service plan.","startTime":16.42,"finishTime":18.78},{"text":"When no rights are modified,","startTime":19.68,"finishTime":21.17},{"text":"this was once mentioned only in general care plan text.","startTime":21.37,"finishTime":24.129},{"text":"Now","startTime":24.489,"finishTime":24.95},{"text":"case managers select no rights modification","startTime":25.159,"finishTime":27.93},{"text":"in PMS and apply standardized language.","startTime":27.93,"finishTime":30.309},{"text":"For modification elements,","startTime":31.209,"finishTime":32.598},{"text":"the flexible narrative of the past has been replaced","startTime":32.79,"finishTime":35.209},{"text":"by a mandatory seven-point checklist for every modification.","startTime":35.209,"finishTime":38.29},{"text":"Finally,","startTime":39.229,"finishTime":39.77},{"text":"regarding waiver scope,","startTime":40.119,"finishTime":41.15},{"text":"the earlier broad","startTime":41.349,"finishTime":42.409},{"text":"adult day services focused application has given way to specific","startTime":42.669,"finishTime":45.95},{"text":"rules outlined for both the passport and assisted living waivers.","startTime":45.95,"finishTime":49.25},{"text":"Keeping these distinctions in mind will help ensure that","startTime":50.139,"finishTime":52.72},{"text":"every care plan meets the updated August 2026 requirements.","startTime":52.72,"finishTime":56.45}]}},"fp7gG3sX6wkxjEzZo":{"_id":"fp7gG3sX6wkxjEzZo","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1191744,"uploadedFileName":"Jacob-en-TimelinesApprovalTimeLimits-8232026.mp3","uploadedFileNameExtension":".mp3","duration":49.625},"dates":{"dateCreated":"2026-08-24T02:38:05.383Z","dateModified":"2026-08-24T02:38:08.076Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The fourth change concerns review timelines and approval limits. Quarterly case manager reviews remain the standard and continue as before. However, the updated guidance adds an important requirement: every modification must now carry a defined time limit. A modification may be approved for ninety days, six months, or one year, and that time limit must be paired with a clear reassessment schedule. In addition, internal monitoring cycles are now expected. This means regular data reviews, often conducted monthly or quarterly, performed by appropriate clinical staff such as a physician or a Director of Nursing. Where the previous practice emphasized general quarterly contact and annual reviews, the new approach requires specific, documented time limits combined with defined monitoring responsibilities. ","voiceCode":"en-US-JacobNeural","language":"en","originalResourceId":"t4sq9jvGAkNPTFWf9","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JacobNeural\">The fourth change concerns review timelines and approval limits. Quarterly case manager reviews remain the standard and continue as before. However, the updated guidance adds an important requirement: every modification must now carry a defined time limit. A modification may be approved for ninety days, six months, or one year, and that time limit must be paired with a clear reassessment schedule. In addition, internal monitoring cycles are now expected. This means regular data reviews, often conducted monthly or quarterly, performed by appropriate clinical staff such as a physician or a Director of Nursing. Where the previous practice emphasized general quarterly contact and annual reviews, the new approach requires specific, documented time limits combined with defined monitoring responsibilities. \u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The 4th change concerns review timelines and approval limits.","startTime":0.009,"finishTime":3.49},{"text":"Quarterly case manager reviews remain the standard and continue as before.","startTime":4.349,"finishTime":8.25},{"text":"However,","startTime":9.119,"finishTime":9.64},{"text":"the updated guidance adds an important requirement.","startTime":9.77,"finishTime":12.38},{"text":"Every modification must now carry a defined time limit.","startTime":12.489,"finishTime":15.489},{"text":"A modification may be approved for 90 days,","startTime":16.27,"finishTime":18.95},{"text":"6 months,","startTime":19.139,"finishTime":19.87},{"text":"or 1 year,","startTime":20.04,"finishTime":20.819},{"text":"and that time limit must be paired with a clear reassessment schedule.","startTime":20.989,"finishTime":24.25},{"text":"In addition,","startTime":25.02,"finishTime":25.739},{"text":"internal monitoring cycles are now expected.","startTime":25.94,"finishTime":28.459},{"text":"This means regular data reviews often conducted monthly or quarterly,","startTime":29.36,"finishTime":33.459},{"text":"performed by appropriate clinical staff such as","startTime":33.72,"finishTime":35.84},{"text":"a physician or a director of nursing.","startTime":35.84,"finishTime":37.799},{"text":"Where the previous practice emphasized general","startTime":38.659,"finishTime":40.779},{"text":"quarterly contact and annual reviews,","startTime":40.779,"finishTime":42.889},{"text":"the new approach requires specific","startTime":43.06,"finishTime":44.759},{"text":"documented time limits combined with defined monitoring responsibilities.","startTime":45.11,"finishTime":48.819}]}},"ie4Q6C3t7YaXgbJqc":{"_id":"ie4Q6C3t7YaXgbJqc","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":767445,"uploadedFileName":"Locks-and-Visitors-Jack-and-Bob.png","height":994,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-08-24T02:15:33.177Z","dateModified":"2026-08-24T02:15:33.177Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"bZfzThhQum8WHZr5h","thumbnail":"zkjEeNGrzPYvfrbuk"},"q35ct7xCpCdDhj4jt":{"_id":"q35ct7xCpCdDhj4jt","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":470772,"uploadedFileName":"Community-Life-Secured-Unit-Gayle.png","height":984,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-08-24T02:10:48.486Z","dateModified":"2026-08-24T02:10:48.486Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"YwW8Taj52izycg25n","thumbnail":"9MfTeANr439EuWPn8"},"qc7XscPRJqrLXPHaR":{"_id":"qc7XscPRJqrLXPHaR","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1409472,"uploadedFileName":"Jacob-en-EmploymentVolunteerRights-8232026.mp3","uploadedFileNameExtension":".mp3","duration":58.7},"dates":{"dateCreated":"2026-08-24T02:38:45.073Z","dateModified":"2026-08-24T02:38:53.589Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"To see how these requirements come to 01/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-JacobNeural\">The third change expands and clarifies the scope of protected rights across both the PASSPORT and Assisted Living waivers. These rights are organized into three categories. The first is Autonomy and Independence, which includes the freedom to furnish and decorate one's living unit, the freedom to control one's own schedule and activities, and the right to have visitors of one's choosing at any time. The second category is Dignity and Respect, which includes access to food and snacks at any time and a lock on the living unit door with a key, or lock box access where appropriate. The third category is Community Integration, which includes the ability to come and go freely from the setting and the opportunity to seek employment or volunteer outside of it. Understanding these categories helps case managers recognize when a right is being limited and when a formal modification is required.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The third change expands and clarifies the scope of protected","startTime":0.009,"finishTime":3.3689999999999998},{"text":"rights across both the passport and assisted living waivers.","startTime":3.3689999999999998,"finishTime":6.349},{"text":"These rights are organized into three categories.","startTime":7.289,"finishTime":9.85},{"text":"The first is autonomy and independence,","startTime":10.68,"finishTime":12.869},{"text":"which includes the freedom to furnish and decorate one's living unit,","startTime":13.079,"finishTime":16.19},{"text":"the freedom to control one's own schedule and activities,","startTime":16.399,"finishTime":19.229},{"text":"and the right to have visitors of one's choosing at any time.","startTime":19.44,"finishTime":22.239},{"text":"The second category is dignity and respect,","startTime":23.079,"finishTime":25.34},{"text":"which includes access to food and snacks at any time","startTime":25.68,"finishTime":28.36},{"text":"in a lock on the living unit door with a key","startTime":28.36,"finishTime":30.459},{"text":"or lockbox access where appropriate.","startTime":30.719,"finishTime":32.799},{"text":"The third category is community integration,","startTime":33.61,"finishTime":36.08},{"text":"which includes the ability to come and go freely from the setting","startTime":36.25,"finishTime":39.13},{"text":"and the opportunity to seek employment or volunteer outside of it.","startTime":39.13,"finishTime":42.45},{"text":"Understanding these categories helps case managers recognize when a right","startTime":43.299,"finishTime":46.939},{"text":"is being limited and when a formal modification is required.","startTime":46.939,"finishTime":49.919}]}},"zq6DfdvxPcHro72X8":{"_id":"zq6DfdvxPcHro72X8","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"image","mimetype":"image/png","status":"online","fileSizeInBytes":204890,"uploadedFileName":"Standardized-Documentation-in-PIMS.png","height":945,"uploadedFileNameExtension":".png","width":1680},"dates":{"dateCreated":"2026-08-20T22:09:06.363Z","dateModified":"2026-08-20T22:09:06.363Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","jobId":"3ZCHeQkNPWFG3Gb6z","thumbnail":"GTKgABB7e4rkSW9St"}},"questionsById":{"2pS5J4G6griJ6y5XH":{"_id":"2pS5J4G6griJ6y5XH","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionMC","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>In the worked example involving Bob (visitor restriction), which statements are TRUE? \u003cstrong>(Select all that apply.)&nbsp;\u003c/strong>\u003c/div>\n"}},"options":{"retryUntilSuccess":false,"score":10,"correctRespo :23.43},{"text":"exited the front doors,","startTime":23.59,"finishTime":24.75},{"text":"and was intercepted near a four-lane highway.","startTime":24.95,"finishTime":27.19},{"text":"Less intrusive strategies such as visual reminders and verbal redirection","startTime":28.04,"finishTime":32.098},{"text":"temporarily reduced the behavior but did not stop the elopement.","startTime":32.479,"finishTime":35.639},{"text":"For data collection and review,","startTime":36.54,"finishTime":38.159},{"text":"staff document each attempt to leave the unit,","startTime":38.45,"finishTime":40.549},{"text":"and the director of nursing and physician review this information monthly.","startTime":40.729,"finishTime":44.11},{"text":"The modification was approved for one year and is","startTime":44.9,"finishTime":47.5},{"text":"reviewed quarterly with consent provided on August 9,","startTime":47.5,"finishTime":50.22},{"text":"2026","startTime":50.299,"finishTime":51.439},{"text":"and signed by the provider that same day.","startTime":51.54,"finishTime":53.5}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["XAjQyWJ3xEzdqytAL","q35ct7xCpCdDhj4jt"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The second example involves the right to engage in community life, specifically the ability to come and go freely. This applies when a person lives in a secured wing and is not given the entry code. The individual, Gayle, has Alzheimer's disease and resides on a secure unit. The identified risk is a history of wandering into heavy traffic; in one instance, she bypassed staff, exited the front doors, and was intercepted near a four-lane highway. Less-intrusive strategies, such as visual reminders and verbal redirection, temporarily reduced the behavior but did not stop the elopement. For data collection and review, staff document each attempt to leave the unit, and the Director of Nursing and physician review this information monthly. The modification was approved for one year and is reviewed quarterly, with consent provided on August 9th, 2026, and signed by the provider that same day. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"The second example involves the right to engage in community life, specifically the ability to come and go freely. This applies when a person lives in a secured wing and is not given the entry code. The individual, Gayle, has Alzheimer's disease and resides on a secure unit. The identified risk is a history of wandering into heavy traffic; in one instance, she bypassed staff, exited the front doors, and was intercepted near a four-lane highway. Less-intrusive strategies, such as visual reminders and verbal redirection, temporarily reduced the behavior but did not stop the elopement. For data collection and review, staff document each attempt to leave the unit, and the Director of Nursing and physician review this information monthly. The modification was approved for one year and is reviewed quarterly, with consent provided on August 9th, 2026, and signed by the provider that same day. ","jobId":"tptyKTaQn8tpr6AGx"}},"AzfFYA5CcLveuydHE":{"_id":"AzfFYA5CcLveuydHE","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank"},"dates":{"dateCreated":"2026-08-24T02:42:20.987Z","dateModified":"2026-08-24T02:42:24.018Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video": :"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"4mwXYJkCRfZZQafJb","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":58.7,"captions":[{"text":"To see how these requirements come together,","startTime":0.079,"finishTime":2.2},{"text":"consider the first example,","startTime":2.609,"finishTime":3.8689999999999998},{"text":"which involves the right to seek employment or volunteer outside the setting.","startTime":4.01,"finishTime":7.61},{"text":"The individual,","startTime":8.449,"finishTime":9.189},{"text":"Jean,","startTime":9.449,"finishTime":9.81},{"text":"has a traumatic brain injury and lacks the","startTime":9.97,"finishTime":12.01},{"text":"safety awareness needed for unmonitored community access.","startTime":12.01,"finishTime":14.869},{"text":"The identified risk includes severe spatial disorientation","startTime":15.88,"finishTime":19.239},{"text":"and physical aggression towards strangers when startled.","startTime":19.239,"finishTime":21.78},{"text":"Before this modification,","startTime":22.799,"finishTime":24.03},{"text":"less intrusive strategies were attempted over 90 days,","startTime":24.159,"finishTime":27.219},{"text":"including job coaching,","startTime":27.559,"finishTime":28.709},{"text":"behavioral group therapy,","startTime":29.04,"finishTime":30.229},{"text":"and noise canceling headphones,","startTime":30.399,"finishTime":31.92},{"text":"but none were successful.","startTime":32.15,"finishTime":33.38},{"text":"For data collection,","startTime":34.31,"finishTime":35.38},{"text":"staff document Jean's behavior daily during group activities,","startTime":35.669,"finishTime":38.779},{"text":"and this is reviewed by the case manager and a physician.","startTime":38.99,"finishTime":41.669},{"text":"The modification was approved for 6 months and is reviewed quarterly.","startTime":42.509,"finishTime":46.13},{"text":"Informed consent was provided on February 15,","startTime":46.9,"finishTime":49.65},{"text":"2026","startTime":49.779,"finishTime":50.919},{"text":"and signed by the provider that same day.","startTime":51.06,"finishTime":53.06},{"text":"Notice how each element of the seven point framework is clearly represented.","startTime":53.979,"finishTime":57.939}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["qc7XscPRJqrLXPHaR","4mwXYJkCRfZZQafJb"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"To see how these requirements come together, consider the first example, which involves the right to seek employment or volunteer outside the setting. The individual, Jean, has a traumatic brain injury and lacks the safety awareness needed for unmonitored community access. The identified risk includes severe spatial disorientation and physical aggression toward strangers when startled. Before this modification, less-intrusive strategies were attempted over ninety days, including job coaching, behavioral group therapy, and noise-cancelling headphones, but none were successful. For data collection, staff document Jean's behavior daily during group activities, and this is reviewed by the case manager and a physician. The modification was approved for six months and is reviewed quarterly. Informed consent was provided on February 15th, 2026, and signed by the provider that same day. Notice how each element of the seven-point framework is clearly represented. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"To see how these requirements come together, consider the first example, which involves the right to seek employment or volunteer outside the setting. The individual, Jean, has a traumatic brain injury and lacks the safety awareness needed for unmonitored community access. The identified risk includes severe spatial disorientation and physical aggression toward strangers when startled. Before this modification, less-intrusive strategies were attempted over ninety days, including job coaching, behavioral group therapy, and noise-cancelling headphones, but none were successful. For data collection, staff document Jean's behavior daily during group activities, and this is reviewed by the case manager and a physician. The modification was approved for six months and is reviewed quarterly. Informed consent was provided on February 15th, 2026, and signed by the provider that same day. Notice how each element of the seven-point framework is clearly represented. ","jobId":"efQt8XC59t8TDrQCD"}},"HxMcPukrJgteyctqS":{"_id":"HxMcPukrJgteyctqS","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank Slide","upload":"XbQgHbH2oAu6hAbT6"},"dates":{"dateCreated":"2026-08-20T22:01:09.845Z","dateModified":"2026-08-24T03:10:05.655Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"XAt3i8RB9n7suwvfF","kind":"overlay","type":"rectangle","width":1022.0000000000001,"height":732.4333333333334,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"QTap3zqQJERYXm3Bf","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":93.225,"captions":[{"text":"Welcome to this supplemental training on the home and community-based services,","startTime":0.129,"finishTime":3.8689999999999998},{"text":"or HCBS","startTime":4.01,"finishTime":5.309},{"text":"settings rule.","startTime":5.53,"finishTime":6.289},{"text":"This lesson is designed for case managers who have already completed","startTime":7.159,"finishTime":10.399000000000001},{"text":"the 2024 Ohio Department of Aging video on HCBS settings.","startTime":10.399000000000001,"finishTime":14.659},{"text":"Rather than repeating that foundational content,","startTime":15.55,"finishTime":17.829},{"text":"this training focuses specifically on what has changed as of August 2026.","startTime":18.11,"finishTime":22.469},{"text":"Over the next several slides,","startTime":23.35,"finishTime":24.94},{"text":"updated documentation requirements,","startTime":25.27,"finishTime":27.1},{"text":"system processes,","startTime":27.309,"finishTime":28.459},{"text":"protected rights,","startTime":28.87,"finishTime":29.549},{"text":"and review timelines will be reviewed.","startTime":29.67,"finishTime":31.53},{"text":"These updates apply to both the passport and assisted living waivers,","startTime":32.429,"finishTime":35.859},{"text":"so the guidance covered here is relevant regardless of","startTime":36.118,"finishTime":38.499},{"text":"the setting in which an individual receives services.","startTime":38.499,"finishTime":41.028},{"text":"The 2024 video established the foundation","startTime":42.38,"finishTime":45.139},{"text":"for understanding HCBS settings requirements,","startTime":45.139,"finishTime":47.849},{"text":"and that knowledge remains essential.","startTime":48.049,"finishTime":49.72},{"text":"This lesson simply layers the August 2026 changes on top of it.","startTime":50.619,"finishTime":54.5},{"text":"Previously,","startTime":55.33,"finishTime":56.09},{"text":"care plans relied on informal narrative descriptions","startTime":56.299,"finishTime":59.22},{"text":"to explain why a modification was needed,","startTime":59.22,"finishTime":61.52},{"text":"and most examples centered on adult day services.","startTime":61.659,"finishTime":64.3},{"text":"The updated guidance moves towards standardized structured documentation","startTime":65.098,"finishTime":69.219},{"text":"that is applied consistently across both waivers.","startTime":69.219,"finishTime":71.719},{"text":"This shift is intended to reduce compliance risk and minimize audit findings.","startTime":72.66,"finishTime":76.94},{"text":"For major changes will be covered in this training,","startTime":77.839,"finishTime":80.15},{"text":"the mandatory seven-point documentation framework,","startTime":80.36,"finishTime":83.029},{"text":"standardized documentation within the PIMS HCBS assessment tool,","startTime":83.319,"finishTime":87.23},{"text":"an expanded scope of protected rights,","startTime":87.4,"finishTime":89.309},{"text":"and clearly defined review timelines and approval limits.","startTime":89.44,"finishTime":92.4}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["XbQgHbH2oAu6hAbT6","QTap3zqQJERYXm3Bf"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Welcome to this supplemental training on the Home and Community-Based Services, or HCBS, Settings Rule. This lesson is designed for case managers who have already completed the 2024 Ohio Department of Aging video on HCBS settings. Rather than repeating that foundational content, this training focuses specifically on what has changed as of August 2026. Over the next several slides, updated documentation requirements, system processes, protected rights, and review timelines will be reviewed. These updates apply to both the PASSPORT and Assisted Living waivers, so the guidance covered here is relevant regardless of the setting in which an individual receives services.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The 2024 video established the foundation for understanding HCBS settings requirements, and that knowledge remains essential. This lesson simply layers the August 2026 changes on top of it. Previously, care plans relied on informal, narrative descriptions to explain why a modification was needed, and most examples centered on Adult Day Services. The updated guidance moves toward standardized, structured documentation that is applied consistently across both waivers. This shift is intended to reduce compliance risk and minimize audit findings. Four major changes will be covered in this training: the mandatory seven-point documentation framework, standardized documentation within the PIMS HCBS Assessment Tool, an expanded scope of protected rights, and clearly defined review timelines and approval limits. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Welcome to this supplemental training on the Home and Community-Based Services, or HCBS, Settings Rule. This lesson is designed for case managers who have already completed the 2024 Ohio Department of Aging video on HCBS settings. Rather than repeating that foundational content, this training focuses specifically on what has changed as of August 2026. Over the next several slides, updated documentation requirements, system processes, protected rights, and review timelines will be reviewed. These updates apply to both the PASSPORT and Assisted Living waivers, so the guidance covered here is relevant regardless of the setting in which an individual receives services.\nThe 2024 video established the foundation for understanding HCBS settings requirements, and that knowledge remains essential. This lesson simply layers the August 2026 changes on top of it. Previously, care plans relied on informal, narrative descriptions to explain why a modification was needed, and most examples centered on Adult Day Services. The updated guidance moves toward standardized, structured documentation that is applied consistently across both waivers. This shift is intended to reduce compliance risk and minimize audit findings. Four major changes will be covered in this training: the mandatory seven-point documentation framework, standardized documentation within the PIMS HCBS Assessment Tool, an expanded scope of protected rights, and clearly defined review timelines and approval limits. ","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"EfFttbnWyoFs5aiwv"}},"Kfei3XuCvbgJ9obkg":{"_id":"Kfei3XuCvbgJ9obkg","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"uShAfSPz7ESKR9zYe"},"dates":{"dateCreated":"2026-08-20T22:02:16.610Z","dateModified":"2026-08-24T03:10:20.448Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"mynzQYPqrzhHa5mPa","kind":"overlay","type":"rectangle","width":859,"height":735.7744047619049,"x":62,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"RiWRtPnqyKjDEZzZC","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0,"imageCropping":{"positionX":3.7873523280055608,"positionY":0,"width":92.42529534398888,"height":100}}],"duration":57.5,"captions":[{"text":"The first major change is the introduction","startTime":0.05,"finishTime":2.049},{"text":"of a mandatory seven-point documentation framework.","startTime":2.049,"finishTime":4.9399999999999995},{"text":"Under the updated guidance,","startTime":5.76,"finishTime":7.21},{"text":"every rights modification in the person-centered service","startTime":7.369,"finishTime":10.09},{"text":"plan must address all 7 standards.","startTime":10.09,"finishTime":12.21},{"text":"These may appear within the implication,","startTime":13.109,"finishTime":14.989},{"text":"the goal,","startTime":15.189,"finishTime":15.67},{"text":"or the intervention.","startTime":15.85,"finishTime":16.79},{"text":"The 7 points are the identified risk,","startTime":17.639,"finishTime":20.26},{"text":"meaning the specific danger or health concern,","startTime":20.44,"finishTime":22.62},{"text":"the less intrusive strategies that were tried first and why they failed,","startTime":22.879,"finishTime":26.2},{"text":"the data collection and review process,","startTime":26.44,"finishTime":28.43},{"text":"including who reviews it and how often,","startTime":28.76,"finishTime":30.379},{"text":"the defined time limits and reassessment schedule,","startTime":30.68,"finishTime":33.099},{"text":"a no harm statement confirming the modification causes no harm,","startTime":33.319,"finishTime":36.669},{"text":"documentation of informed consent along with the date obtained,","startTime":36.88,"finishTime":39.919},{"text":"and finally,","startTime":40.119,"finishTime":40.799},{"text":"provider documentation,","startTime":41.2,"finishTime":42.479},{"text":"including the provider's signature,","startTime":42.84,"finishTime":44.27},{"text":"the","startTime":44.479,"finishTime":44.84},{"text":"Date received and confirmation that a signed copy was returned.","startTime":45.619,"finishTime":49.169},{"text":"Where the previous practice allowed a flexible narrative,","startTime":50.049,"finishTime":52.68},{"text":"the new expectation is that all 7 elements are present every time.","startTime":52.919,"finishTime":56.729}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["uShAfSPz7ESKR9zYe","RiWRtPnqyKjDEZzZC"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The first major change is the introduction of a mandatory seven-point documentation framework. Under the updated guidance, every rights modification in the Person-Centered Service Plan must address all seven standards. These may appear within the implication, the goal, or the intervention. The seven points are: the identified risk, meaning the specific danger or health concern; the less-intrusive strategies that were tried first and why they failed; the data collection and review process, including who reviews it and how often; the defined time limits and reassessment schedule; a no-harm statement confirming the modification causes no harm; documentation of informed consent along with the date obtained; and finally, provider documentation, including the provider's signature, the date received, and confirmation that a signed copy was returned. Where the previous practice allowed a flexible narrative, the new expectation is that all seven elements are present, every time. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"The first major change is the introduction of a mandatory seven-point documentation framework. Under the updated guidance, every rights modification in the Person-Centered Service Plan must address all seven standards. These may appear within the implication, the goal, or the intervention. The seven points are: the identified risk, meaning the specific danger or health concern; the less-intrusive strategies that were tried first and why they failed; the data collection and review process, including who reviews it and how often; the defined time limits and reassessment schedule; a no-harm statement confirming the modification causes no harm; documentation of informed consent along with the date obtained; and finally, provider documentation, including the provider's signature, the date received, and confirmation that a signed copy was returned. Where the previous practice allowed a flexible narrative, the new expectation is that all seven elements are present, every time. ","jobId":"vmzgMLxXnwMJLL9Mf"}},"LNPEzarJsnoebhbCe":{"_id":"LNPEzarJsnoebhbCe","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"cTrX77bgoEQTJkg9H"},"dates":{"dateCreated":"2026-08-24T02:16:21.659Z","dateModified":"2026-08-24T03:11:05.536Z"},"users":{"_userCrea ":27.93},{"text":"in PMS and apply standardized language.","startTime":27.93,"finishTime":30.309},{"text":"For modification elements,","startTime":31.209,"finishTime":32.598},{"text":"the flexible narrative of the past has been replaced","startTime":32.79,"finishTime":35.209},{"text":"by a mandatory seven-point checklist for every modification.","startTime":35.209,"finishTime":38.29},{"text":"Finally,","startTime":39.229,"finishTime":39.77},{"text":"regarding waiver scope,","startTime":40.119,"finishTime":41.15},{"text":"the earlier broad","startTime":41.349,"finishTime":42.409},{"text":"adult day services focused application has given way to specific","startTime":42.669,"finishTime":45.95},{"text":"rules outlined for both the passport and assisted living waivers.","startTime":45.95,"finishTime":49.25},{"text":"Keeping these distinctions in mind will help ensure that","startTime":50.139,"finishTime":52.72},{"text":"every care plan meets the updated August 2026 requirements.","startTime":52.72,"finishTime":56.45}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["cTrX77bgoEQTJkg9H","T4bzhJoNgAXFiiiDC"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"To bring everything together, consider the key differences between the 2024 practice and the 2026 guidance. For system process, care managers previously entered general text into PIMS care plan fields; now, the structured HCBS Assessment Tool in PIMS auto-populates the Person-Centered Service Plan. When no rights are modified, this was once mentioned only in general care plan text; now, case managers select \\\"no rights modification\\\" in PIMS and apply standardized language. For modification elements, the flexible narrative of the past has been replaced by a mandatory seven-point checklist for every modification. Finally, regarding waiver scope, the earlier broad, Adult Day Services-focused application has given way to specific rules outlined for both the PASSPORT and Assisted Living waivers. Keeping these distinctions in mind will help ensure that every care plan meets the updated August 2026 requirements. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"To bring everything together, consider the key differences between the 2024 practice and the 2026 guidance. For system process, care managers previously entered general text into PIMS care plan fields; now, the structured HCBS Assessment Tool in PIMS auto-populates the Person-Centered Service Plan. When no rights are modified, this was once mentioned only in general care plan text; now, case managers select \"no rights modification\" in PIMS and apply standardized language. For modification elements, the flexible narrative of the past has been replaced by a mandatory seven-point checklist for every modification. Finally, regarding waiver scope, the earlier broad, Adult Day Services-focused application has given way to specific rules outlined for both the PASSPORT and Assisted Living waivers. Keeping these distinctions in mind will help ensure that every care plan meets the updated August 2026 requirements. ","jobId":"HQiCReKETjwL9WC6p"}},"Mx2Rxh9qP3XcpuCMQ":{"_id":"Mx2Rxh9qP3XcpuCMQ","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"CtGvtrRzS8ntMMFYh"},"dates":{"dateCreated":"2026-08-20T22:07:08.876Z","dateModified":"2026-08-24T03:10:24.023Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessme hTime":9.25},{"text":"replacing the manual","startTime":9.39,"finishTime":10.609},{"text":"narrative-style care plan text used previously.","startTime":10.71,"finishTime":13.369},{"text":"The process differs depending on whether any rights are being modified.","startTime":14.199,"finishTime":17.379},{"text":"When no rights are modified,","startTime":18.43,"finishTime":19.85},{"text":"the case manager selects no rights modification in the PMS tool,","startTime":20.149,"finishTime":24.27},{"text":"then creates a new implication in the person-centered service","startTime":24.51,"finishTime":27.35},{"text":"plan using standardized template language across the implication,","startTime":27.35,"finishTime":30.35},{"text":"goal,","startTime":30.629,"finishTime":31.049},{"text":"and intervention.","startTime":31.11,"finishTime":31.909},{"text":"When rights are modified,","startTime":32.84,"finishTime":34.02},{"text":"the case manager selects yes for the specific right,","startTime":34.319,"finishTime":37.439},{"text":"enters a corresponding modification implication,","startTime":37.639,"finishTime":40.029},{"text":"and that implication automatically populates","startTime":40.2,"finishTime":42.279},{"text":"into the person-centered service plan.","startTime":42.279,"finishTime":43.979},{"text":"From","startTime":44.849,"finishTime":44.86},{"text":"there,","startTime":45.27,"finishTime":45.59},{"text":"the seven-point documentation framework is applied.","startTime":45.709,"finishTime":48.45},{"text":"This standardization ensures consistency and reduces the","startTime":49.369,"finishTime":52.439},{"text":"variability that came with freeform narrative entries.","startTime":52.439,"finishTime":55.209}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["CtGvtrRzS8ntMMFYh","zq6DfdvxPcHro72X8","ugc8WWH29dzTpbKz7"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The second change addresses how documentation is entered into the system. Case managers must now use the HCBS Assessment Tool directly within PIMS, replacing the manual, narrative-style care plan text used previously. The process differs depending on whether any rights are being modified. When no rights are modified, the case manager selects \\\"no rights modification\\\" in the PIMS tool, then creates a new implication in the Person-Centered Service Plan using standardized template language across the implication, goal, and intervention. When rights are modified, the case manager selects \\\"yes\\\" for the specific right, enters a corresponding modification implication, and that implication automatically populates into the Person-Centered Service Plan. From there, the seven-point documentation framework is applied. This standardization ensures consistency and reduces the variability that came with free-form narrative entries. \",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"The second change addresses how documentation is entered into the system. Case managers must now use the HCBS Assessment Tool directly within PIMS, replacing the manual, narrative-style care plan text used previously. The process differs depending on whether any rights are being modified. When no rights are modified, the case manager selects \"no rights modification\" in the PIMS tool, then creates a new implication in the Person-Centered Service Plan using standardized template language across the implication, goal, and intervention. When rights are modified, the case manager selects \"yes\" for the specific right, enters a corresponding modification implication, and that implication automatically populates into the Person-Centered Service Plan. From there, the seven-point documentation framework is applied. This standardization ensures consistency and reduces the variability that came with free-form narrative entries. ","jobId":"asmdsvD9pNYmdBQy2"}},"XAyvaJfCpxLEGTgYy":{"_id":"XAyvaJfCpxLEGTgYy","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"yCeGQqWvuwZoogMuh"},"dates":{"dateCreated":"2026-08-20T22:09:41.955Z","dateModified":"2026-08-24T03:10:29.663Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"hXnx22oscFKR6EJrF","kind":"overlay","type":"rectangle","width":1154,"height":752.1607142857143,"x":63,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"4jWqeCY3vE5drHLhD","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":50.7,"captions":[{"text":"The third change expands and clarifies the scope of protected","startTime":0.009,"finishTime":3.3689999999999998},{"text":"rights across both the passport and assisted living waivers.","startTime":3.3689999999999998,"finishTime":6.349},{"text":"These rights are organized into three categories.","startTime":7.289,"finishTime":9.85},{"text":"The first is autonomy and independence,","startTime":10.68,"finishTime":12.869},{"text":"which includes the freedom to furnish and decorate one's living unit,","startTime":13.079,"finishTime":16.19},{"text":"the freedom to control one's own schedule and activities,","startTime":16.399,"finishTime":19.229},{"text":"and the right to have visitors of one's choosing at any time.","startTime":19.44,"finishTime":22.239},{"text":"The second category is dignity and respect,","startTime":23.079,"finishTime":25.34},{"text":"which includes access to food and snacks at any time","startTime":25.68,"finishTime":28.36},{"text":"in a lock on the living unit door with a key","startTime":28.36,"finishTime":30.459},{"text":"or lockbox access where appropriate.","startTime":30.719,"finishTime":32.799},{"text":"The third category is community integration,","startTime":33.61,"finishTime":36.08},{"text":"which includes the ability to come and go freely from the setting","startTime":36.25,"finishTime":39.13},{"text":"and the opportunity to seek employment or volunteer outside of it.","startTime":39.13,"finishTime":42.45},{"text":"Understanding these categories helps case managers recognize when a right","startTime":43.299,"finishTime":46.939},{"text":"is being limited and when a formal modification is required.","startTime":46.939,"finishTime":49.919}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["yCeGQqWvuwZoogMuh","4jWqeCY3vE5drHLhD"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The third change expands and clarifies the scope of protected rights across both the PASSPORT and Assisted Living waivers. These rights are organized into three categories. The first is Autonomy and Independence, which includes the freedom to furnish and decorate one's living unit, the freedom to control one's own schedule and activities, and the right to have visitors of one's choosing at any time. The second category is Dignity and Respect, which includes access to food and snacks at any time and a lock on the living unit door with a key, or lock box access where appropriate. The third category is Community Integration, which includes the ability to come and go freely from the setting and the opportunity to seek employment or volunteer outside of it. Understanding these categories helps case managers recognize when a right is being limited and when a formal modification is required.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-JacobNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"The third change expands and clarifies the scope of protected rights across both the PASSPORT and Assisted Living waivers. These rights are organized into three categories. The first is Autonomy and Independence, which includes the freedom to furnish and decorate one's living unit, the freedom to control one's own schedule and activities, and the right to have visitors of one's choosing at any time. The second category is Dignity and Respect, which includes access to food and snacks at any time and a lock on the living unit door with a key, or lock box access where appropriate. The third category is Community Integration, which includes the ability to come and go freely from the setting and the opportunity to seek employment or volunteer outside of it. Understanding these categories helps case managers recognize when a right is being limited and when a formal modification is required.","voiceCodeUsed":"en-US-JacobNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"rxNaJWrhSh2hzj4hb"}},"kpN3qpShkbbxMCsWm":{"_id":"kpN3qpShkbbxMCsWm","_siteID":"ZoiyE itors of one's choosing.","startTime":34.979,"finishTime":38.259},{"text":"Bob has mild cognitive impairment and is financially and physically vulnerable.","startTime":39.15,"finishTime":43.25},{"text":"A specific visitor,","startTime":44.09,"finishTime":45.22},{"text":"his daughter Amy,","startTime":45.419,"finishTime":46.319},{"text":"posed an imminent risk.","startTime":46.45,"finishTime":47.639},{"text":"Importantly,","startTime":48.61,"finishTime":49.369},{"text":"only AMI is restricted.","startTime":49.529,"finishTime":50.93},{"text":"The modification is narrowly tailored,","startTime":51.13,"finishTime":53.049},{"text":"requiring late night visitors to check in and verify their identity.","startTime":53.229,"finishTime":56.63},{"text":"This was approved for 6 months,","startTime":57.52,"finishTime":59.2},{"text":"reviewed quarterly,","startTime":59.52,"finishTime":60.34},{"text":"with consent provided on July 15,","startTime":60.439,"finishTime":62.43},{"text":"2026.","startTime":62.56,"finishTime":63.639},{"text":"These examples demonstrate that modifications should always be","startTime":64.58,"finishTime":67.58},{"text":"as specific and limited as the situation requires.","startTime":67.58,"finishTime":70.419}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["EhbvtHAZjZKLKAozh","ie4Q6C3t7YaXgbJqc"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The next two examples further illustrate how modifications are documented. In the first, the right being modified is the lock on the living unit door. Jack has advanced Parkinson's disease with a history of falls, and staff require immediate access to his room after he was found unconscious following a fall. As a solution, Jack is given a lock box for personal items, and staff knock and identify themselves before entering. This modification was approved for s was approved for six months, reviewed quarterly, with consent provided on July 15th, 2026. These examples demonstrate that modifications should always be as specific and limited as the situation requires. ","jobId":"z7CsozNFP37YfFXHo"}},"t4sq9jvGAkNPTFWf9":{"_id":"t4sq9jvGAkNPTFWf9","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"template":"resourceSlide","locale":"en","title":"Blank","upload":"fp7gG3sX6wkxjEzZo"},"dates":{"dateCreated":"2026-08-20T22:11:04.746Z","dateModified":"2026-08-24T03:10:34.703Z"},"users":{"_userCreatorID":"fMCCj2F5RvKPEqE8F","_userModifierID":"fMCCj2F5RvKPEqE8F"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"overlays":[{"identifier":"s8aS2Ta2tK23MR7bC","kind":"overlay","type":"rectangle","width":1233,"height":780.1660714285714,"x":0,"y":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"verticalAlignment":"middle","type":"rectangle","lineHeight":1.2,"textAlignment":"center","border":{"color":"koantic(dark1, 0, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"fill":{"type":"color","color":"koantic(light1, 0, 0)"},"fontColor":"koantic(dark1, 0, 1)","padding":{"left":0,"top":0,"bottom":0,"right":0},"font":{"bold":false,"italic":false,"underline":false,"size":20}},"isImage":true,"imageAsset":"8b9vqf7iKMFKh6ZY5","isRatioFixed":true,"start":0,"behaviorType":"continue","rotationAngle":0}],"duration":49.625,"captions":[{"text":"The 4th change concerns review timelines and approval limits.","startTime":0.009,"finishTime":3.49},{"text":"Quarterly case manager reviews remain the standard and continue as before.","startTime":4.349,"finishTime":8.25},{"text":"However,","startTime":9.119,"finishTime":9.64},{"text":"the updated guidance adds an important requirement.","startTime":9.77,"finishTime":12.38},{"text":"Every modification must now carry a defined time limit.","startTime":12.489,"finishTime":15.489},{"text":"A modification may be approved for 90 days,","startTime":16.27,"finishTime":18.95},{"text":"6 months,","startTime":19.139,"finishTime":19.87},{"text":"or 1 year,","startTime":20.04,"finishTime":20.819},{"text":"and that time limit must be paired with a clear reassessment schedule.","startTime":20.989,"finishTime":24.25},{"text":"In addition,","startTime":25.02,"finishTime":25.739},{"text":"internal monitoring cycles are now expected.","startTime":25.94,"finishTime":28.459},{"text":"This means regular data reviews often conducted monthly or quarterly,","startTime":29.36,"finishTime":33.459},{"text":"performed by appropriate clinical staff such as","startTime":33.72,"finishTime":35.84},{"text":"a physician or a director of nursing.","startTime":35.84,"finishTime":37.799},{"text":"Where the previous practice emphasized general","startTime":38.659,"finishTime":40.779},{"text":"quarterly contact and annual reviews,","startTime":40.779,"finishTime":42.889},{"text":"the new approach requires specific","startTime":43.06,"finishTime":44.759},{"text":"documented time limits combined with defined monitoring responsibilities.","startTime":45.11,"finishTime":48.819}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["fp7gG3sX6wkxjEzZo","8b9vqf7iKMFKh6ZY5"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The fourth change concerns review timelines and approval limits. Quarterly case manager reviews remain the standard and continue as before. However, the updated guidance adds an important requirement: every modification must now carry a defined time limit. A modification may be approved for ninety days, six months, or one year, and that time limit must be paired with a clear reassessment schedule. In addition, internal monitoring cycles are now expected. This means re
